async function doBuy(code){
  const price = priceOf(code);
  if(money.balance_cents < price){ openTopUp(price); return; }
  try{
    const { data } = await sb.rpc('buy_v1', { p:{ wallet: addr, code: code, qty: 1 } });
    if(!data || !data.ok){
      if(data && data.error === 'no_money'){ openTopUp(price); return; }
      return say(T('failed') + (data && data.error ? ' · ' + data.error : ''), 'warn');
    }
    money.balance_cents = data.balance_cents;
    bag[code] = (bag[code] || 0) + 1;
    paintBagBtn();
    await DB.put('kv', money, 'money');
    await DB.put('kv', bag, 'bag');
    paintShop();
    say(T('sh_bought', { n: T('it_' + code) }), 'good');
  }catch(e){ say(T('gun_neednet'), 'warn'); }
}

function hasWallet(){ return !!(window.ethereum); }
function pad32(hexNoPrefix, right){
  const h = hexNoPrefix.replace(/^0x/,'');
  return right ? h.padEnd(64,'0') : h.padStart(64,'0');
}
function toWeiHex(amount, decimals){
  // без больших чисел: считаем строкой, чтобы не потерять копейки
  const [a, b=''] = String(amount).split('.');
  const frac = (b + '0'.repeat(decimals)).slice(0, decimals);
  return BigInt(a + frac).toString(16);
}

function openTopUp(needCents){
  sheetMode = 'info';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-p').textContent = '';

  document.getElementById('sheet-t').textContent = T('sh_topup');

  let html = '';
  if(needCents) html += '<div class="mv-warn">' + esc(T('sh_notenough', { n: money$(needCents) })) + '</div>';

        + '<div class="pf-sec">' + T('sh_howmuch') + '</div>'
        + '<div class="sum-box">'
        +   '<button class="sum-pm" onclick="bumpSum(-1)">−</button>'

        +   '<button class="sum-pm" onclick="bumpSum(1)">+</button>'
        + '</div>'
        + '<div class="sum-hint" id="sum-hint"></div>'
        + '<div class="row" style="gap:8px;margin-top:10px">'

        + '</div>'

  document.getElementById('sheet-body').innerHTML = html;
  document.getElementById('veil').classList.add('on');

// Сколько платить — решает сам игрок, хоть $2.50
function readSum(){
  const el = document.getElementById('topup-sum');
  let v = parseFloat((el && el.value) || '0');
  if(!isFinite(v)) v = 0;
  return Math.round(v * 100) / 100;
}
function bumpSum(dir){
  const el = document.getElementById('topup-sum');
  if(!el) return;
  el.value = Math.max((money.min_cents||30)/100, readSum() + dir).toFixed(2);
  paintSum();
}
function paintSum(){
  const h = document.getElementById('sum-hint');
  if(!h) return;
  const v = readSum(), rate = money.bnb_usd || 600;
  const mn = (money.min_cents || 30) / 100;
  if(v < mn){ h.className = 'sum-hint bad'; h.textContent = T('sh_minlow', { n: money$(money.min_cents||30) }); return; }
  h.className = 'sum-hint';
  h.textContent = '≈ ' + (v / rate).toFixed(5) + ' BNB · ' + T('sh_or') + ' ' + v.toFixed(2) + ' USDT';
}
function goPay(kind){
  const v = readSum();
  const mn = (money.min_cents || 30) / 100;
  if(v < mn){ say(T('sh_minlow', { n: money$(money.min_cents||30) }), 'warn'); return; }
  pickWallet(v, kind);
}

// Какой у тебя кошелёк
function pickWallet(usd, kind){
  if(hasWallet()){ payVia('here', usd, kind); return; }
  document.getElementById('sheet-t').textContent = T('sh_which');
  const apps = [['metamask','MetaMask'],['trust','Trust Wallet'],
                ['okx','OKX Wallet'],['bitget','Bitget Wallet']];
  let html = '<div class="mv-warn">' + esc(T('sh_whichp')) + '</div>';
  for(const [id, name] of apps){
    html += '<div class="row" style="margin:8px 0"><button class="btn-ghost" '
          + 'onclick="payVia(\'' + id + '\',' + usd + ',\'' + kind + '\')">' + name + '</button></div>';
  }
  html += '<div class="row" style="margin-top:10px"><button class="btn-ghost" '
        + 'onclick="copyPay(' + usd + ',\'' + kind + '\')">' + esc(T('sh_copylink')) + '</button></div>';
  document.getElementById('sheet-body').innerHTML = html;
}
async function copyPay(usd, kind){
  const url = payUrl(usd, kind);
  try{ await navigator.clipboard.writeText(url); say(T('mv_copied'),'good'); waitForMoney(); }
  catch(e){ say(T('mv_manual'),'warn'); }
}

async function ensureChain(){
  try{
    const id = await ethereum.request({ method:'eth_chainId' });
    if(id === BSC_HEX) return true;
    await ethereum.request({ method:'wallet_switchEthereumChain',
                             params:[{ chainId: BSC_HEX }] });
    return true;
  }catch(e){ say(T('sh_wrongchain'),'warn'); return false; }
}

// Кошелёк нужен на одну минуту покупки, а не для игры. Поэтому в
// кошелёк уезжает отдельная страница оплаты весом в пару килобайт,
// а игра остаётся установленной на экране.
function payUrl(usd, kind){
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  return base + 'pay.html'
       + '?u=' + encodeURIComponent(addr)
       + '&a=' + usd
       + '&k=' + kind
       + '&r=' + (money.bnb_usd || 600)
       + '&h=' + encodeURIComponent(base + 'index.html');
}
// Ссылки-переходы в разные кошельки. Каждый открывает страницу
// у себя внутри — только там есть, чем подписать перевод.
function walletLink(app, url){
  const bare = url.replace(/^https?:\/\//, '');
  if(app === 'metamask') return 'https://metamask.app.link/dapp/' + bare;
  if(app === 'trust')    return 'https://link.trustwallet.com/open_url?coin_id=20000714&url=' + encodeURIComponent(url);
  if(app === 'okx')      return 'okx://wallet/dapp/url?dappUrl=' + encodeURIComponent(url);
  if(app === 'bitget')   return 'https://bkcode.vip?action=dapp&url=' + encodeURIComponent(url);
  return url;
}
function payVia(app, usd, kind){
  const url = payUrl(usd, kind);
  // Кошелёк уже вокруг нас — просто открываем страницу
  if(hasWallet()){ location.href = url; return; }
  waitForMoney();
  location.href = walletLink(app, url);
}

// Пока человек платит в кошельке, игра сама поглядывает на счёт.
let _moneyTimer = null;
function waitForMoney(){
  const was = money.balance_cents;
  if(_moneyTimer) clearInterval(_moneyTimer);
  let n = 0;
  _moneyTimer = setInterval(async () => {
    n++;
    if(n > 60){ clearInterval(_moneyTimer); _moneyTimer = null; return; }
    if(document.hidden) return;
    await loadMoney();
    // подхватываем сделку, если страница оплаты успела её записать
    try{
      const tx = localStorage.getItem('ogt_last_tx');
      if(tx){
        localStorage.removeItem('ogt_last_tx');
        fetch('/api/topup', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ tx_hash: tx }) }).catch(()=>{});
      }
    }catch(e){}
    if(money.balance_cents > was){
      clearInterval(_moneyTimer); _moneyTimer = null;
      say(T('sh_credited', { n: money$(money.balance_cents - was) }), 'good');
      if(document.getElementById('veil').classList.contains('on')) openShop();
    }
  }, 5000);
}



// Ждём подтверждений и зачисления. Проверяет сервер, не телефон.
async function watchTx(tx){
  say(T('sh_waiting'));
  for(let i = 0; i < 40; i++){
    await new Promise(r => setTimeout(r, 6000));
    try{
      const r = await fetch('/api/topup', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tx_hash: tx }) });
      const j = await r.json();
      if(j && j.ok){
        money.balance_cents = j.balance_cents;
        await DB.put('kv', money, 'money');
        say(T('sh_credited', { n: money$(j.cents) }), 'good');
        openShop();
        return;
      }
      if(j && j.error === 'tx_failed'){ say(T('sh_txfail'),'warn'); return; }
    }catch(e){}
  }
  say(T('sh_slow'),'warn');
}

// ═══════════ Клан и чат ═══════════
// Клан — это те, с кем ты НЕ воюешь и с кем делишь добычу.
// Чат виден только своим: таблица закрыта наглухо, сервер сперва
// проверяет, что человек правда в этом клане.
let clan = null;              // мой клан
let chatMsgs = [];            // сообщения, что уже видел
let chatSince = 0;
let _chatTimer = null;

async function loadClan(){
  try{
    const { data } = await sb.rpc('clan_info_v1', { p:{ wallet: addr } });
    clan = (data && data.in_clan) ? data : null;
  }catch(e){}
  return clan;
}

async function openClan(){
  const turn = ++_sheetTurn;
  await loadClan();
  if(turn !== _sheetTurn) return;
  sheetMode = 'info';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-p').textContent = '';
  document.getElementById('sheet-ok').textContent = T('closebtn');
  document.getElementById('sheet-t').textContent = T('cl_title');
  document.getElementById('veil').classList.add('on');

  if(clan){
    let html = '<div class="pf-row"><span>'+T('cl_name')+'</span><b>'+esc(clan.name)+'</b></div>'
             + '<div class="pf-row"><span>'+T('cl_members')+'</span><b>'+clan.members+' / '+clan.max+'</b></div>'
             + '<div class="pf-sec">'+T('cl_list')+'</div>';
    for(const m of (clan.list||[])){
      const me = m.wallet === addr;
      html += '<div class="pf-row"><span>' + (m.role === 'leader' ? '★ ' : '')
            + esc(m.wallet.slice(0,6)+'…'+m.wallet.slice(-4)) + (me ? ' ('+T('cl_you')+')' : '')
            + '</span><b>' + m.bunkers + '</b></div>';
    }
    html += '<div class="row" style="margin:12px 0 0;">'
          + '<button class="btn-ghost" onclick="openChat()">'+esc(T('cl_chat'))+'</button>'
          + '<button class="btn-ghost" onclick="doClanLeave()">'+esc(T('cl_leave'))+'</button>'
          + '</div>';
    document.getElementById('sheet-body').innerHTML = html;
  } else {
    let html = '<div class="mv-warn">'+esc(T('cl_none'))+'</div>'
             + '<div class="row" style="margin:10px 0 0;">'
             + '<button class="btn-ghost" onclick="askClanName()">'+esc(T('cl_create'))+'</button>'
             + '</div><div class="pf-sec">'+T('cl_near')+'</div>'
             + '<div id="clan-near">…</div>';
    document.getElementById('sheet-body').innerHTML = html;
    try{
      const { data } = await sb.rpc('clans_near_v1', { p:{ lat: here?here[0]:0, lng: here?here[1]:0 } });
      const box = document.getElementById('clan-near');
      if(!data || !data.length){ box.textContent = T('cl_nonear'); return; }
      box.innerHTML = data.map(c =>
        '<div class="pf-row"><span>'+esc(c.name)+' · '+c.members+'/'+c.max+'</span>'
        + '<button class="btn-ghost" style="padding:5px 10px" onclick="doClanJoin('+c.id+')">'
        + esc(T('cl_join'))+'</button></div>').join('');
    }catch(e){}
  }
}

function askClanName(){
  const name = prompt(T('cl_ask_name'));
  if(!name) return;
  doClanCreate(name.trim());
}
async function doClanCreate(name){
  try{
    const { data } = await sb.rpc('clan_create_v1', { p:{ wallet: addr, name: name } });
    if(!data || !data.ok){
      const e = data && data.error;
      if(e === 'bad_name')        return say(T('cl_badname'),'warn');
      if(e === 'name_taken')      return say(T('cl_taken'),'warn');
      if(e === 'already_in_clan') return say(T('cl_already'),'warn');
      if(e === 'need_bunker')     return say(T('cl_needbunker'),'warn');
      return say(T('failed'),'warn');
    }
    say(T('cl_created',{ n: data.name }),'good');
    openClan();
  }catch(e){ say(T('gun_neednet'),'warn'); }
}
async function doClanJoin(id){
  try{
    const { data } = await sb.rpc('clan_join_v1', { p:{ wallet: addr, clan_id: id } });
    if(!data || !data.ok){
      const e = data && data.error;
      if(e === 'full')     return say(T('cl_full'),'warn');
      if(e === 'cooldown') return say(T('cl_cooldown',{ n: data.left_min }),'warn');
      if(e === 'closed')   return say(T('cl_closed'),'warn');
      return say(T('failed'),'warn');
    }
    say(T('cl_joined',{ n: data.name }),'good');
    openClan();
  }catch(e){ say(T('gun_neednet'),'warn'); }
}
async function doClanLeave(){
  if(!confirm(T('cl_leave_ask'))) return;
  try{ await sb.rpc('clan_leave_v1', { p:{ wallet: addr } }); }catch(e){}
  clan = null; say(T('cl_left'));
  openClan();
}

// ── Чат. Живой, пока экран открыт: опрос раз в 3 секунды.
//    Постоянное соединение у всех держать нельзя — упрёмся в пределы.
function openChat(){
  sheetMode = 'chat';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-t').textContent = T('cl_chat') + (clan ? ' · ' + clan.name : '');
  document.getElementById('sheet-p').textContent = '';
  document.getElementById('sheet-ok').textContent = T('back');
  document.getElementById('sheet-body').innerHTML =
      '<div id="chat-list"></div>'
    + '<div class="chat-send">'
    + '<input id="chat-in" maxlength="240" placeholder="' + esc(T('cl_say')) + '"/>'
    + '<button class="btn-ghost" onclick="chatSend()">' + esc(T('cl_send')) + '</button>'
    + '</div>';
  document.getElementById('veil').classList.add('on');
  paintChat();
  chatPull();
  if(_chatTimer) clearInterval(_chatTimer);
  _chatTimer = setInterval(chatPull, 3000);
}
function stopChat(){ if(_chatTimer){ clearInterval(_chatTimer); _chatTimer = null; } }

async function chatPull(){
  if(!clan || document.hidden) return;
  try{
    const { data } = await sb.rpc('chat_read_v1', { p:{ wallet: addr, since: chatSince } });
    if(Array.isArray(data) && data.length){
      for(const m of data){ chatMsgs.push(m); if(m.id > chatSince) chatSince = m.id; }
      if(chatMsgs.length > 200) chatMsgs = chatMsgs.slice(-200);
      try{ await DB.put('kv', chatMsgs.slice(-100), 'chat'); }catch(e){}
      paintChat();
    }
  }catch(e){}
}
function paintChat(){
  const box = document.getElementById('chat-list');
  if(!box) return;
  if(!chatMsgs.length){ box.innerHTML = '<div class="chat-empty">'+esc(T('cl_empty'))+'</div>'; return; }
  box.innerHTML = chatMsgs.map(m => {
    const me = m.wallet === addr;
    const t = new Date(m.at);
    const hh = String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    return '<div class="chat-m'+(me?' me':'')+'">'
         + '<b>'+esc(m.wallet.slice(0,6))+'</b><i>'+hh+'</i>'
         + '<span>'+esc(m.body)+'</span></div>';
  }).join('');
  box.scrollTop = box.scrollHeight;
}
async function chatSend(){
  const el = document.getElementById('chat-in');
  const body = (el.value||'').trim();
  if(!body) return;
  el.value = '';
  try{
    const { data } = await sb.rpc('chat_send_v1', { p:{ wallet: addr, body: body } });
    if(data && !data.ok && data.error === 'too_fast') say(T('cl_toofast',{n:data.wait}),'warn');
  }catch(e){ say(T('gun_neednet'),'warn'); }
  chatPull();
}

// ═══════════ Осада ═══════════
// Отсчёт рисует телефон, а урон считает сервер по своим часам.
// Наружу уходит только «я здесь, бью вот по этому» раз в полминуты.
let siege = null;          // текущая осада, если я в ней
let sieges = [];           // живые осады в районе, чтобы видеть на карте
let siegeTarget = null;    // по какой пушке бью
let _siegeTimer = null;

// Если осаждают мою точку и я рядом — включаюсь защитником: сервер
// начнёт считать починку, а на экране появится своя панель.
function checkMySiege(){
  if(siege) return;
  for(const s of sieges){
    const b = bunkerById(s.bunker_id);
    if(!b || b.owner !== addr) continue;
    siege = { id:s.id, bunker_id:b.id, total_hp:s.total_hp, damage:s.damage,
              guns_left:gunsOf(b.id).length, attackers:1, defenders:0,
              side:'defend', started:Date.parse(s.started_at) };
    startSiegeLoop();
    say(T('sg_alarm'),'warn');
    return;
  }
}
function bunkerById(id){ return bunkers.find(b => b.id === id) || null; }
function gunsOf(id){ return units.filter(u => u.bunker_id === id && u.alive !== false); }

// ── Нажатие по карте: что там стоит ──────────────────────────────
function onMapTap(e){
  const ll = e.latlng;
  let best = null, bd = 1e9, kind = null;
  for(const b of bunkers){
    if(b.alive === false) continue;
    if(fogHides(b.lat, b.lng, b.owner, 'b'+b.id)) continue;
    const d = metersBetween(b.lat, b.lng, ll.lat, ll.lng);
    if(d < bd){ bd = d; best = b; kind = 'bunker'; }
  }
  for(const u of units){
    if(u.alive === false) continue;
    if(fogHides(u.lat, u.lng, u.owner, 'u'+u.id)) continue;
    const d = metersBetween(u.lat, u.lng, ll.lat, ll.lng);
    if(d < bd){ bd = d; best = u; kind = 'unit'; }
  }
  // Прицел перехватывает тычок раньше всего остального
  if(aimMode){
    if(!best || bd > 80){ say(aimMode === 'drone' ? T('dr_aim') : T('lr_aim'), 'warn'); return; }
    aimFire(best, kind);
    return;
  }
  if(!best || bd > 60) return;
  if(kind === 'unit'){
    // во время осады тычок по пушке выбирает её целью
    if(siege && siege.bunker_id === best.bunker_id && best.owner !== addr){
      pickTarget(String(best.id));
    }
    return;
  }
  showBunker(best);
}

function showBunker(b){
  const mine = b.owner === addr;
  const d = here ? Math.round(metersBetween(b.lat, b.lng, here[0], here[1])) : null;
  const guns = gunsOf(b.id).length;
  const under = sieges.find(x => x.bunker_id === b.id);
  const reach = cfg.siege_reach_m || 80;
  sheetMode = 'bunker'; window._sheetBunker = b;
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-t').textContent =
      mine ? T('sg_mine') : (names[b.owner] || T('sg_foreign'));
  document.getElementById('sheet-body').innerHTML =
      '<div class="pf-row"><span>' + T('sg_guns') + '</span><b>' + guns + ' / 7</b></div>'
    + '<div class="pf-row"><span>' + T('sg_dist') + '</span><b>'
        + (d === null ? '—' : d + ' м') + '</b></div>'
    + (under ? '<div class="pf-row"><span>' + T('sg_state') + '</span><b>' + T('sg_live') + '</b></div>' : '');
  document.getElementById('sheet-p').textContent =
      mine ? T('sg_mine_p')
           : (d !== null && d <= reach ? T('sg_can') : T('sg_come', { n: reach }));
  document.getElementById('sheet-ok').textContent =
      (!mine && d !== null && d <= reach) ? T(under ? 'sg_join' : 'sg_attack') : T('closebtn');
  document.getElementById('veil').classList.add('on');
}

async function doAttack(){
  const b = window._sheetBunker;
  closeSheet();
  if(!b || !here) return;
  if(!navigator.onLine){ say(T('gun_neednet'),'warn'); return; }
  try{
    const { data, error } = await sb.rpc('siege_start_v1', { p:{
      wallet: addr, bunker_id: b.id, lat: here[0], lng: here[1] }});
    if(error) throw error;
    if(!data || !data.ok){
      const e = data && data.error;
      if(e === 'too_far')            return say(T('sg_come',{n:data.need}),'warn');
      if(e === 'own_bunker')         return say(T('sg_mine_p'),'warn');
      if(e === 'already_under_siege'){ return doJoin(b); }
      if(e === 'cooldown')           return say(T('sg_wait',{n:data.minutes}),'warn');
      if(e === 'owner_shielded')     return say(T('sg_shield',{n:data.limit}),'warn');
      if(e === 'newbie')             return say(T('sg_newbie',{n:data.hours}),'warn');
      return say(T('failed'),'warn');
    }
    siege = { id:data.siege_id, bunker_id:b.id,
              bunker_hp:data.bunker_hp || data.total_hp, bunker_max:data.bunker_max || data.total_hp,
              guns:[], guns_left:gunsOf(b.id).length, attackers:1, defenders:0,
              power:12, side:'attack', started:Date.now() };
    siegeTarget = 'auto';
    startSiegeLoop();
    pushAlarm(data.siege_id);
    say(T('sg_started'),'good');
  }catch(e){ say(T('gun_neednet'),'warn'); }
}

let _smokeTimer = null;
// Точка уже под осадой — вступаем в неё вместе с остальными
async function doJoin(b){
  try{
    const { data } = await sb.rpc('siege_join_v1', { p:{
      wallet: addr, bunker_id: b.id, lat: here[0], lng: here[1] }});
    if(!data || !data.ok){
      if(data && data.error === 'too_far') return say(T('sg_come',{n:data.need}),'warn');
      return say(T('failed') + (data && data.error ? ' · ' + data.error : ''), 'warn');
    }
    siege = { id:data.siege_id, bunker_id:b.id,
              bunker_hp:data.bunker_hp, bunker_max:data.bunker_max,
              guns:[], guns_left:gunsOf(b.id).length, attackers:2, defenders:0,
              power:12, side:'attack', started:Date.now() };
    siegeTarget = 'auto';
    startSiegeLoop();
    say(T('sg_joined'),'good');
  }catch(e){ say(T('gun_neednet'),'warn'); }
}

function startSiegeLoop(){
  stopSiegeLoop();
  track = []; pushTrack();
  // точка дымит, пока её грызут — видно даже боковым зрением
  _smokeTimer = setInterval(() => {
    if(document.hidden || !siege) return;
    const b = bunkerById(siege.bunker_id);
    if(b) FX.smoke(b.lat, b.lng);
  }, 1400);
  paintSiege();
  siegeTick();
  _siegeTimer = setInterval(siegeTick, 30000);
  startShells();
}
function stopSiegeLoop(){
  if(_siegeTimer){ clearInterval(_siegeTimer); _siegeTimer = null; }
  if(_smokeTimer){ clearInterval(_smokeTimer); _smokeTimer = null; }
  stopShells();
  FX.stop();
}

async function siegeTick(){
  if(!siege || !here || document.hidden) return;
  try{
    pushTrack();
    const { data } = await sb.rpc('siege_tick_v1', { p:{
      wallet: addr, siege_id: siege.id, lat: here[0], lng: here[1],
      target: siegeTarget || 'auto', track: track.slice(-40) }});
    if(!data || !data.ok) return;
    if(data.left){ endSiege(T('sg_left')); return; }
    siege.bunker_hp  = data.bunker_hp;
    siege.bunker_max = data.bunker_max || siege.bunker_max;
    siege.guns       = Array.isArray(data.guns) ? data.guns : (siege.guns || []);
    siege.guns_left  = data.guns_left;
    siege.attackers  = data.attackers;
    siege.defenders  = data.defenders;
    siege.repair     = data.repair;
    siege.power      = data.power;
    siege.target     = data.target;
    siege.dist       = data.dist;
    siege.shield_pct = data.shield_pct;
    // пушка пала — показать обвал на её месте
    if(siege._prevGuns){
      for(const old of siege._prevGuns){
        if(!(siege.guns||[]).some(g => g.id === old.id)){
          const u = units.find(x => x.id === old.id);
          if(u){ u.alive = false; FX.burst(u.lat, u.lng); FX.num(u.lat, u.lng, '−'+(old.hp||50), '#FFD67A'); }
        }
      }
    }
    siege._prevGuns = (siege.guns || []).slice();

    // полоски жизни на карте: сперва общая картина по району, потом
    // точные цифры по своей осаде — они свежее на полминуты.
    hpFromSieges();
    if(siege.bunker_max) hpSet('b'+siege.bunker_id, siege.bunker_hp, siege.bunker_max);
    for(const g of (siege.guns || [])) hpSet('u'+g.id, g.hp, g.max);
    Sprites.refresh();
    if(data.hits > 0){
      say(T('sh_hit', { n: Math.round(data.lost_sec) }), 'warn');
      // видно, КТО именно достал: трассы идут от каждой живой пушки
      if(here){
        try{ FX.volley(siege.guns || [], here[0], here[1]); }catch(e){}
        setTimeout(() => { if(here) FX.blast(here[0], here[1], cfg.siege_blast_m || 20, true); }, 700);
      }
    }
    if(siege.guns_left !== undefined){ Sprites.refresh(); drawRing(); }
    if(data.done){
      const b = bunkerById(siege.bunker_id);
      const win = siege.side === 'attack';
      if(b){
        FX.collapse(b.lat, b.lng, !win);
        FX.num(b.lat, b.lng, win ? '+' + money$(cfg.loot_cents || 25) : '', '#FFD67A');
        // пушки взрываются вместе с бункером, вразнобой
        const gs = units.filter(u => u.bunker_id === b.id && u.alive !== false);
        gs.forEach((u, i) => setTimeout(() => {
          FX.burst(u.lat, u.lng); FX.smoke(u.lat, u.lng);
        }, 120 + i * 180));
        for(const u of gs){ u.alive = false; try{ await DB.put('units', u); }catch(e){} }
        if(win) setTimeout(() => FX.claim(b.lat, b.lng, cfg.radius_earth_m || 250), 700);
        b.alive = false; await DB.put('bunkers', b);
      }
      HP.clear();
      // место освободилось — можно ставить своё прямо тут
      setTimeout(() => { drawAll(); drawZones(); paintReticle(); }, 1400);
      endSiege(win ? T('sg_won') : T('sg_lost'), true);
      return;
    }
    paintSiege();
  }catch(e){}
}

async function siegeLeave(){
  if(!siege) return;
  const id = siege.id;
  endSiege(T('sg_left'));
  try{ await sb.rpc('siege_leave_v1', { p:{ wallet: addr, siege_id: id } }); }catch(e){}
}
function endSiege(msg, good){
  // на прощание — вспышка по цели, если победили
  if(good && siege){
    const b = bunkerById(siege.bunker_id);
    if(b){ FX.burst(b.lat, b.lng); FX.blast(b.lat, b.lng, 40, false); }
  }
  stopSiegeLoop();
  FX.stop();
  siege = null; siegeTarget = null;
  // вышел из боя — но чужая осада никуда не делась, полосу оставляем
  hpFromSieges(); Sprites.refresh();
  paintSiege();
  if(msg) say(msg, good ? 'good' : 'warn');
}


// ── Ответный огонь пушек ─────────────────────────────────────────
// Расписание залпов считается ровно так же, как на сервере: от
// времени начала осады и номера пушки. Поэтому телефон может
// нарисовать предупреждение заранее, а сервер потом проверит,
// ушёл человек из круга или стоял.
let track = [];              // где я был: время и точка
let shellLayer = null, _shellTimer = null;

function pushTrack(){
  if(!here) return;
  track.push({ t: Date.now(), lat: here[0], lng: here[1] });
  const cut = Date.now() - 150000;
  while(track.length && track[0].t < cut) track.shift();
}
// Ближайшая запись к нужному времени
function whereAt(ms){
  let best = null, bd = 1e18;
  for(const p of track){ const d = Math.abs(p.t - ms); if(d < bd){ bd = d; best = p; } }
  return best;
}
// Какой залп сейчас в воздухе
function pendingShell(){
  if(!siege || siege.side !== 'attack') return null;
  const every = (cfg.siege_gun_every_sec || 60) * 1000;
  const warn  = (cfg.siege_warn_sec || 15) * 1000;
  const now = Date.now();
  for(const u of gunsOf(siege.bunker_id)){
    const off = (u.id % (cfg.siege_gun_every_sec || 60)) * 1000;
    const k = Math.floor((now - siege.started - off) / every);
    for(const kk of [k, k+1]){
      if(kk < 0) continue;
      const aim = siege.started + kk*every + off;
      const land = aim + warn;
      if(land > now && aim <= now){
        const c = whereAt(aim);
        if(c) return { unit: u.id, land: land, lat: c.lat, lng: c.lng };
      }
    }
  }
  return null;
}
let _lastShell = null;
// Живые пушки бьют по тому, кто рядом. Раз в несколько секунд
// пускаем трассу от случайной пушки — видно, что тебя обстреливают.
let _lastTracer = 0;
function fireTracers(){
  if(!siege || siege.side !== 'attack' || !here) return;
  const gs = (siege.guns || []).filter(g => g.hp > 0 && g.lat);
  if(!gs.length) return;
  const now = Date.now();
  if(now - _lastTracer < 2600) return;
  _lastTracer = now;
  const g = gs[Math.floor(Math.random() * gs.length)];
  FX.tracer(g.lat, g.lng, here[0], here[1], 700, '#FFC46A');
  const u = units.find(x => x.id === g.id);
  if(u) FX.smoke(u.lat, u.lng);
}

function paintShell(){
  fireTracers();
  const sh = pendingShell();
  if(shellLayer){ map.removeLayer(shellLayer); shellLayer = null; }
  const warnEl = document.getElementById('shell-warn');
  const r = cfg.siege_blast_m || 20;

  // снаряд лёг: вспышка, волна и — если накрыло — дрожание с вибрацией
  if(_lastShell && (!sh || sh.land !== _lastShell.land)){
    const inside = here && metersBetween(here[0], here[1],
                        _lastShell.lat, _lastShell.lng) <= r;
    FX.blast(_lastShell.lat, _lastShell.lng, r, inside);
    if(inside) FX.num(_lastShell.lat, _lastShell.lng,
                      '−' + (cfg.siege_hit_pause_sec || 10) + ' с', '#E27A5F');
    _lastShell = null;
  }
  if(!sh){ if(warnEl) warnEl.style.display = 'none'; return; }
  _lastShell = sh;
  FX.aim(sh.lat, sh.lng, r, Math.max(0, sh.land - Date.now()));
  shellLayer = L.circle([sh.lat, sh.lng], {
    radius: r, color:'#B23A2E', weight:2.5, dashArray:'5 4',
    fillColor:'#B23A2E', fillOpacity:0.25 }).addTo(map);
  const left = Math.max(0, Math.ceil((sh.land - Date.now())/1000));
  const inside = here && metersBetween(here[0], here[1], sh.lat, sh.lng) <= r;
  if(warnEl){
    warnEl.style.display = 'block';
    warnEl.className = inside ? 'hot' : 'safe';
    warnEl.innerHTML = '<b>' + esc(T(inside ? 'sh_out' : 'sh_ok', { n: left })) + '</b>'
                     + '<i>' + esc(T('sh_sub', { r: r })) + '</i>';
  }
}
function startShells(){
  stopShells();
  _shellTimer = setInterval(() => { pushTrack(); paintShell(); }, 1000);
}
function stopShells(){
  if(_shellTimer){ clearInterval(_shellTimer); _shellTimer = null; }
  if(shellLayer){ map.removeLayer(shellLayer); shellLayer = null; }
  const w = document.getElementById('shell-warn'); if(w) w.style.display = 'none';
}

// ── Панель осады ─────────────────────────────────────────────────
function paintSiege(){
  const el = document.getElementById('siege-box');
  const dock = document.getElementById('build-block');
  if(!el) return;
  if(!siege){
    el.style.display = 'none';
    if(dock) dock.style.display = '';
    // не HP.clear(): чужая осада на моей точке продолжается, и полоса
    // жизни обязана остаться на карте
    hpFromSieges(); Sprites.refresh();
    return;
  }
  if(dock) dock.style.display = 'none';
  el.style.display = 'block';
  el.className = siege.side === 'defend' ? 'defend' : '';

  const pow  = Math.max(Number(siege.power) || 1, 0.5);
  const left = Math.max(0, (siege.bunker_hp || 0)
             + (siege.guns || []).reduce((a,g) => a + (g.hp||0), 0));
  const mins = left / pow;
  const mm = Math.floor(mins), ss = Math.floor((mins - mm) * 60);
  const tgt = String(siege.target) === 'bunker'
            ? T('tg_bunker')
            : T('tg_gun') + ' ' + (siege.dist != null ? siege.dist + ' м' : '');

  // Всё коротко: карту закрывать нельзя, полоски жизни теперь на ней
  el.innerHTML =
      '<div class="sg-line">'
    +   '<span class="sg-top">' + (siege.side === 'defend' ? T('sg_hold') : T('sg_title')) + '</span>'
    +   '<span class="sg-time">' + mm + ':' + String(ss).padStart(2,'0') + '</span>'
    + '</div>'
    + '<div class="sg-sub">' + esc(tgt) + ' · ' + T('sg_short', {
        a: siege.attackers || 1, d: siege.defenders || 0, p: pow.toFixed(0) }) + '</div>'
    + (siege.shield_pct > 0
        ? '<div class="sg-sub warn">' + T('sg_shield', { n: siege.shield_pct }) + '</div>' : '')
    + '<div class="sg-row">'
    +   '<button class="btn-ghost" onclick="siegeLeave()">' + esc(T('sg_leave')) + '</button>'
    + '</div>'
    + '<div id="shell-warn" style="display:none"></div>';
}

// ═══════════ Ключ устройства ═══════════
// Номер игрока сам по себе ничего не доказывает — это просто строка.
// Поэтому телефон заводит себе настоящий ключ. Делает его сам браузер,
// ни одной скачанной библиотеки. Пока ключ только хранится; когда
// появятся деньги, каждая отправка будет им подписана, и подделать
// чужое имя станет нельзя.
async function ensureKey(){
  try{
    let k = await DB.get('kv','key');
    if(k && k.priv) return k;
    if(!(window.crypto && crypto.subtle)) return null;
    const kp = await crypto.subtle.generateKey({ name:'ECDSA', namedCurve:'P-256' },
                                               true, ['sign','verify']);
    k = { priv: await crypto.subtle.exportKey('jwk', kp.privateKey),
          pub:  await crypto.subtle.exportKey('jwk', kp.publicKey) };
    await DB.put('kv', k, 'key');
    return k;
  }catch(e){ return null; }
}

// ═══════════ Перенос игрока на другой телефон ═══════════
// Без кошелька каждый телефон — отдельный игрок. Чтобы играть с двух,
// первый отдаёт ссылку, второй её открывает и становится тем же игроком.
function b64u(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(str){ str = str.replace(/-/g,'+').replace(/_/g,'/'); return decodeURIComponent(escape(atob(str))); }

async function moveLink(){
  const k = await DB.get('kv','key');
  const payload = JSON.stringify({ v:1, a:addr, k:k||null });
  return location.origin + location.pathname + '#move=' + b64u(payload);
}

// Открыли ссылку переноса — спрашиваем и заменяем игрока на этом телефоне.
async function checkMoveLink(){
  const m = (location.hash||'').match(/move=([A-Za-z0-9\-_]+)/);
  if(!m) return false;
  history.replaceState(null,'',location.pathname);
  let data = null;
  try{ data = JSON.parse(unb64u(m[1])); }catch(e){}
  if(!data || !/^0x[0-9a-f]{40}$/.test(data.a||'')){
    sheetInfo(T('mv_bad'), T('mv_bad2')); return false;
  }
  if(data.a === addr) return false;
  const ok = confirm(T('mv_ask', { p: data.a.slice(0,6)+'…'+data.a.slice(-4) }));
  if(!ok) return false;
  await DB.put('kv', data.a, 'addr');
  if(data.k) await DB.put('kv', data.k, 'key');
  // Бункеры в памяти телефона трогать не надо: чей круг золотой, а чей
  // красный, считается при отрисовке по новому номеру игрока.
  location.reload();
  return true;
}

// Мир нарезан на клетки по 0,02° — это примерно 2,2 км. Телефон берёт
// свою клетку и восемь соседних, и ничего больше. Раньше он тянул все
// бункеры планеты: на 15 миллионах это 1,8 ГБ на телефон.
const CELL = 0.02;
function cellKey(lat,lng){ return 'box:'+Math.floor(lat/CELL)+':'+Math.floor(lng/CELL); }
function boxAround(lat,lng){
  const i = Math.floor(lat/CELL), j = Math.floor(lng/CELL);
  return { latMin:(i-1)*CELL, latMax:(i+2)*CELL, lngMin:(j-1)*CELL, lngMax:(j+2)*CELL };
}
const haveIds = new Set();
const namesAsked = new Set();

// Пора ли снова спрашивать редкие вещи
async function staleFor(key, ms){
  try{
    const t = await DB.get('kv', key + 'At');
    return !t || (Date.now() - t) > ms;
  }catch(e){ return true; }
}

async function sync(){
  if(!navigator.onLine){ linkState(T('st_offline'), 'off'); return; }
  try{
    let added = 0;
    if(here){
      const box = boxAround(here[0], here[1]);
      const key = cellKey(here[0], here[1]);
      // Первый приход в клетку — берём её целиком. Дальше только новое.
      let lastId = (await DB.get('kv', key)) || 0;
      let q = sb.from('territory_bunkers')
        .select('id,owner,lat,lng,kind,built_at')
        .eq('alive', true)
        .gte('lat', box.latMin).lte('lat', box.latMax)
        .gte('lng', box.lngMin).lte('lng', box.lngMax);
      if(lastId) q = q.gt('id', lastId);
      const { data, error } = await q.order('id', { ascending:true }).limit(2000);
      if(error) throw error;
      for(const b of (data||[])){
        if(b.id > lastId) lastId = b.id;
        if(haveIds.has(b.id)) continue;
        haveIds.add(b.id);
        await DB.put('bunkers', b);
        bunkers.push(b); drawOne(b); added++;
      }
      await DB.put('kv', lastId, key);

      // Пушки того же района. Отдельная отметка, чтобы бункеры и
      // пушки не мешали друг другу догоняться.
      const ukey = 'ubox:' + key.slice(4);
      let uLast = (await DB.get('kv', ukey)) || 0;
      let uq = sb.from('territory_units')
        .select('id,owner,bunker_id,code,lat,lng,hp_left,alive,built_at')
        .eq('alive', true)
        .gte('lat', box.latMin).lte('lat', box.latMax)
        .gte('lng', box.lngMin).lte('lng', box.lngMax);
      if(uLast) uq = uq.gt('id', uLast);
      const { data:ud } = await uq.order('id', { ascending:true }).limit(2000);
      for(const u of (ud||[])){
        if(u.id > uLast) uLast = u.id;
        if(haveUnitIds.has(u.id)) continue;
        haveUnitIds.add(u.id);
        await DB.put('units', u);
        units.push(u); added++;
      }
      await DB.put('kv', uLast, ukey);

      // Живые осады района: чтобы видеть, что где горит, и чтобы
      // хозяин узнал о нападении на свою точку.
      // Свои точки идут первыми и не выпадают из среза. Раньше здесь
      // стоял slice(0, 200) по общему списку: если мой бункер оказывался
      // 201-м, я просто не узнавал, что меня осаждают.
      const mineIds  = bunkers.filter(x => x.alive !== false && x.owner === addr).map(x => x.id);
      const otherIds = bunkers.filter(x => x.alive !== false && x.owner !== addr).map(x => x.id);
      const ids = mineIds.concat(otherIds).slice(0, 300);
      if(ids.length){
        const { data:sg } = await sb.from('territory_sieges')
          .select('id,bunker_id,attacker,started_at,total_hp,damage,state')
          .eq('state','live').in('bunker_id', ids).limit(300);
        sieges = sg || [];
        hpFromSieges();
        checkMySiege();
      }
      Sprites.refresh(); paintGunBtn(); drawRing();
    }

    // Правила, отметки заведений и реклама меняются раз в недели, а не
    // раз в три минуты. Спрашиваем их РЕДКО и держим в телефоне.
    // Раньше на каждую проверку уходило шесть запросов вместо двух.
    if(await staleFor('slow', 6*3600*1000)){
      const { data:cf } = await sb.from('territory_config').select('key,value');
      if(cf){
        const o={}; cf.forEach(r=>o[r.key]=Number(r.value));
        // Круги уже нарисованы по запасным числам. Если настоящие
        // отличаются — перерисовываем всё, иначе на карте останется
        // старая ложь: круг 100 м при правиле 250.
        const changed = ['radius_earth_m','min_distance_m','unit_influence_m',
                         'unit_step_m','min_cannon_distance_m']
                        .some(k => o[k] !== undefined && Number(o[k]) !== Number(cfg[k]));
        cfg=Object.assign(cfg,o); await DB.put('kv',o,'cfg');
        if(changed) drawAll();
      }

      const box2 = here ? boxAround(here[0], here[1]) : null;
      let pq = sb.from('territory_places')
        .select('id,kind,title,subtitle,lat,lng,radius_m,icon,color,perks')
        .eq('visible', true);
      if(box2) pq = pq.gte('lat',box2.latMin).lte('lat',box2.latMax)
                      .gte('lng',box2.lngMin).lte('lng',box2.lngMax);
      const { data:pl } = await pq.limit(200);
      if(pl){ places = pl; await DB.put('kv', pl, 'places'); drawPlaces(); }

      const { data:ad } = await sb.from('territory_ads')
        .select('id,slot,title,body,image_url,link_url,lat,lng,radius_m,weight')
        .eq('active', true).limit(200);
      if(ad){ ads = ad; await DB.put('kv', ad, 'ads'); showAd('dock'); }

      // Запоминаем «спросили» только если сервер правда ответил.
      // Иначе одна пустая выдача заморозила бы правила на шесть часов.
      if(cf && cf.length) await DB.put('kv', Date.now(), 'slowAt');
    }

    // Названия спрашиваем только для тех хозяев, чьё имя нам ещё
    // неизвестно. У кого уже знаем — второй раз не тревожим.
    const fresh = Array.from(new Set(bunkers.map(b=>b.owner)))
                       .filter(o => o && !(o in names) && !namesAsked.has(o))
                       .slice(0, 200);
    if(fresh.length){
      fresh.forEach(o => namesAsked.add(o));
      const { data:nm } = await sb.from('territory_names')
        .select('owner,label').in('owner', fresh);
      if(nm){ nm.forEach(r=>names[r.owner]=r.label); await DB.put('kv',names,'names'); }
    }

    await DB.put('kv', Date.now(), 'syncedAt');
    drawLabels(); refreshStats();
    linkState(added ? T('st_new',{n:added}) : T('st_ok'));
    flushQueue();
  }catch(e){ linkState(T('st_noserver'), 'off'); }
}

function linkState(t, cls){
  document.getElementById('link-txt').textContent = t + (queue.length ? ' · '+queue.length+' '+T('st_wait') : '');
  document.getElementById('link').className = queue.length ? 'queued' : (cls||'');
}

// ═══════════ Отрисовка ═══════════
function drawAll(){
  layers.forEach(l => map.removeLayer(l)); layers.clear();
  bunkers.forEach(drawOne);
  Sprites.refresh();
  drawRing();
  drawZones();
}
function drawOne(b){
  if(fogHides(b.lat, b.lng, b.owner, 'b'+b.id)) return;
  if(b.alive === false) return;
  const g = L.layerGroup();
  const mine = addr && b.owner === addr;
  const col = mine ? '#E0A32E' : ownerColor(b.owner);
  const r = Number(cfg.radius_earth_m) || 250;
  L.circle([b.lat, b.lng], {
    radius: r,
    color: col, weight: mine ? 2.5 : 2,
    opacity: mine ? 0.95 : 0.85,
    fillColor: col,
    fillOpacity: mine ? 0.16 : 0.20,
    dashArray: mine ? null : '9 6'
  }).addTo(g);
  // внутренний обод — чтобы чужая земля читалась даже поверх карты
  L.circle([b.lat, b.lng], {
    radius: Math.max(20, r * 0.28),
    color: col, weight: 1.5, opacity: 0.7,
    fillColor: col, fillOpacity: mine ? 0.22 : 0.3
  }).addTo(g);
  g.addTo(map); layers.set(b.id, g);
  Sprites.refresh();
}

// Свой цвет каждому чужому игроку: из его же номера, всегда один и тот же
const OWNER_COLORS = ['#B4462F','#B5539B','#4E7FD4','#3F9E8C','#C2762B',
                      '#8E5BC6','#C0453F','#2F8F4E','#B08A2E','#5468C4'];
function ownerColor(w){
  if(!w) return '#B4462F';
  let h = 0;
  for(let i = 0; i < w.length; i++) h = (h * 31 + w.charCodeAt(i)) & 0xffffff;
  return OWNER_COLORS[Math.abs(h) % OWNER_COLORS.length];
}

function drawLabels(){
  labels.forEach(l => map.removeLayer(l)); labels.clear();
  const byOwner = {};
  bunkers.forEach(b => { (byOwner[b.owner] = byOwner[b.owner]||[]).push(b); });
  Object.keys(byOwner).forEach(owner => {
    const label = names[owner]; const list = byOwner[owner];
    if(!label || list.length < 3) return;
    const lat = list.reduce((s,b)=>s+b.lat,0)/list.length;
    const lng = list.reduce((s,b)=>s+b.lng,0)/list.length;
    const mine = addr && owner === addr;
    labels.set(owner, L.marker([lat,lng], { interactive:false, icon:L.divIcon({ className:'',
      html:'<div class="terr-label '+(mine?'terr-mine':'terr-them')+'">'+esc(label)+'</div>',
      iconSize:[0,0] })}).addTo(map));
  });
}
// Отметки заведений: кафе, спортзал, спонсор. Кружок другого рисунка,
// чтобы не путать с бункером, и подпись рядом.
let placeLayers = [];
function drawPlaces(){
  placeLayers.forEach(l => map.removeLayer(l)); placeLayers = [];
  places.forEach(pl => {
    const col = pl.color || '#7FA65C';
    const g = L.layerGroup();
    L.circle([pl.lat,pl.lng], { radius: pl.radius_m || 60, color: col, weight:1,
      opacity:.7, fillColor:col, fillOpacity:.10, dashArray:'2 5' }).addTo(g);
    L.marker([pl.lat,pl.lng], { interactive:false, icon: L.divIcon({ className:'',
      html:'<div class="place-pin">'+(pl.icon||'\u2691')+'<span>'+esc(pl.title)+'</span></div>',
      iconSize:[0,0] })}).addTo(g);
    g.addTo(map); placeLayers.push(g);
  });
}

// Реклама. Место показа — просто строка: dock, plant, siege, profile,
// win, splash, map_pin. Появится новое место — добавляется значение,
// таблицу и код загрузки менять не надо.
function pickAd(slot){
  const list = ads.filter(a => a.slot === slot).filter(a => {
    if(a.lat == null || !here) return true;
    return metersBetween(here[0], here[1], a.lat, a.lng) <= (a.radius_m || 50000);
  });
  if(!list.length) return null;
  let total = list.reduce((s,a)=>s+(a.weight||100), 0), r = Math.random()*total;
  for(const a of list){ r -= (a.weight||100); if(r <= 0) return a; }
  return list[0];
}
function showAd(slot){
  const box = document.getElementById('ad-'+slot);
  if(!box) return;
  const a = pickAd(slot);
  if(!a){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML = '<span class="ad-tag">ad</span>'
    + (a.image_url ? '<img src="'+esc(a.image_url)+'" alt=""/>' : '')
    + '<b>'+esc(a.title)+'</b>'
    + (a.body ? '<span>'+esc(a.body)+'</span>' : '');
  box.onclick = () => {
    if(a.link_url) window.open(a.link_url, '_blank', 'noopener');
    try{ sb.rpc('territory_ad_click', { p:{ id:a.id } }); }catch(e){}
  };
}

function refreshStats(){
  const mine = addr ? bunkers.filter(b=>b.owner===addr) : [];
  const today = mine.filter(b => new Date(b.built_at).toDateString() === new Date().toDateString());
  document.getElementById('s-mine').textContent = addr ? mine.length : '—';
  document.getElementById('s-near').textContent = bunkers.length;
  document.getElementById('s-left').textContent = addr
    ? Math.max(0, cfg.earth_per_day - today.length - queue.length) : '—';
}

// ═══════════ Постройка ═══════════
// Правила проверяем НА ТЕЛЕФОНЕ до отправки: отказ приходит мгновенно
// и без интернета. Наружу уходит только то, что прошло проверку.
function preCheck(){
  if(!here || acc == null) return 'nogps';
  if(acc > cfg.max_accuracy_m) return 'weak';
  const mine = bunkers.filter(b=>b.owner===addr);
  const today = mine.filter(b => new Date(b.built_at).toDateString() === new Date().toDateString());
  if(today.length + queue.length >= cfg.earth_per_day) return 'daily';
  if(mine.length + queue.length >= cfg.max_earth_alive) return 'max';
  const n = nearestBunker(here[0], here[1]);
  if(n.b && n.d < cfg.min_distance_m) return 'close:'+Math.round(n.d);
  return null;
}

// Показания телефона на момент постройки. Собираем что доступно:
// в лесу сетей нет и это нормально — тогда вес на остальном.
function collectProof(){
  const pr = { mocked:false, wifi:0, cells:0, device:{} };
  try{
    pr.device = { ua:navigator.userAgent.slice(0,120),
                  lang:navigator.language,
                  cores:navigator.hardwareConcurrency||0,
                  mem:navigator.deviceMemory||0 };
  }catch(e){}
  if(typeof _lastSpeed === 'number') pr.speed = _lastSpeed;
  if(typeof _steps === 'number') pr.steps = _steps;
  return pr;
}

function plant(){
  const bad = preCheck();
  if(bad === 'weak' || bad === 'nogps'){ say(T('weak'),'warn'); return; }
  if(bad === 'daily'){ say(T('daily'),'warn'); return; }
  if(bad === 'max'){ say(T('maxb',{n:cfg.max_earth_alive}),'warn'); return; }
  if(bad && bad.startsWith('close:')){
    say(T('close',{d:bad.split(':')[1], n:cfg.min_distance_m}),'warn'); return;
  }
  document.getElementById('cam').click();
}

document.getElementById('cam').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(!f) return;
  const fr = new FileReader(); fr.onload = () => stampPhoto(fr.result); fr.readAsDataURL(f);
});

function stampPhoto(dataUrl){
  const img = new Image();
  img.onload = function(){
    const side = 900, c = document.createElement('canvas');
    const scale = side/Math.max(img.width, img.height);
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0, c.width, c.height);
    x.fillStyle = 'rgba(18,20,15,.82)'; x.fillRect(0, c.height-54, c.width, 54);
    x.fillStyle = '#E8E2D0'; x.font = '13px monospace';
    x.fillText(here[0].toFixed(5)+', '+here[1].toFixed(5)+'  ±'+Math.round(acc)+'m', 10, c.height-32);
    x.fillText(new Date().toISOString().slice(0,19).replace('T',' ')+'  '+addr.slice(0,10), 10, c.height-12);
    pendingPhoto = c.toDataURL('image/jpeg', 0.6);
    sheetMode = 'plant';
    document.getElementById('sheet-body').innerHTML = '';
    document.getElementById('shot').src = pendingPhoto;
    document.getElementById('shot').style.display = 'block';
    document.getElementById('sheet-in').style.display = 'none';
    sheet(T('planthere'), T('planthere2', { r: cfg.radius_earth_m }));
    document.getElementById('sheet-ok').textContent = T('plantit');
  };
  img.src = dataUrl;
}

async function doPlant(){
  closeSheet();
  const tmp = 'q'+Date.now();
  const hash = await photoHash(pendingPhoto);
  // Снимок остаётся в телефоне. Наружу пойдёт только отпечаток.
  await DB.put('photos', pendingPhoto, tmp);
  const item = { tmp:tmp, owner:addr, lat:here[0], lng:here[1],
                 accuracy:acc, hash:hash, proof:collectProof(), at:Date.now() };
  pendingPhoto = null;

  if(!navigator.onLine){
    // В лесу связи нет — постройка ждёт в телефоне и уйдёт позже
    queue.push(item); await DB.put('queue', item);
    say(T('saved'),'good');
    refreshStats(); linkState(T('st_offline'),'off');
    return;
  }
  say(T('planting'));
  const ok = await sendOne(item);
  if(ok === 'network'){
    queue.push(item); await DB.put('queue', item);
    say(T('noconn'),'good');
    refreshStats(); linkState(T('st_offline'),'off');
  }
}

async function sendOne(item){
  try{
    // Один аргумент jsonb: новые поля можно добавлять сколько угодно,
    // подпись функции в базе от этого не меняется и обновлять её
    // вручную не придётся.
    const { data, error } = await sb.rpc('place_bunker_v2', { p: {
      owner: item.owner, lat: item.lat, lng: item.lng,
      accuracy: item.accuracy, photo_hash: item.hash,
      kind: 'earth', proof: item.proof || {}
    }});
    if(error) return 'network';
    if(!data || !data.ok){
      const e = data && data.error;
      if(e === 'too_close') say(T('taken',{d:data.got}),'warn');
      else if(e === 'daily_limit') say(T('daily'),'warn');
      else if(e === 'max_alive')   say(T('maxb',{n:data.limit}),'warn');
      else if(e === 'weak_gps')    say(T('weaksig',{n:data.got}),'warn');
      else if(e === 'fake_location') say(T('fake'),'warn');
      else say(T('failed'),'warn');
      try{ await DB.del('photos', item.tmp); }catch(_){}
      return 'rejected';
    }
    const b = { id:data.id, owner:item.owner, lat:item.lat, lng:item.lng,
                kind:'earth', built_at:new Date(item.at).toISOString() };
    bunkers.push(b); await DB.put('bunkers', b); drawOne(b);
    try{
      const ph = await DB.get('photos', item.tmp);
      if(ph){ await DB.put('photos', ph, 'b'+data.id); await DB.del('photos', item.tmp); }
    }catch(e){}
    haveIds.add(data.id);
    try{ FX.place('bunker', item.lat, item.lng); FX.claim(item.lat, item.lng, cfg.radius_earth_m || 250); }catch(e){}
    const ck = cellKey(item.lat, item.lng);
    const last = (await DB.get('kv', ck)) || 0;
    if(data.id > last) await DB.put('kv', data.id, ck);
    say(T('planted'),'good');
    refreshStats();
    return 'ok';
  }catch(e){ return 'network'; }
}

async function flushQueue(){
  if(!queue.length || !navigator.onLine) return;
  const list = queue.slice();
  for(const item of list){
    const r = await sendOne(item);
    if(r === 'network') break;
    queue = queue.filter(q => q.tmp !== item.tmp);
    await DB.del('queue', item.tmp);
  }
  refreshStats(); linkState(queue.length ? T('st_sending') : T('st_ok'));
}

// ═══════════ Название земли ═══════════
function askName(){
  const mine = bunkers.filter(b=>b.owner===addr).length;
  if(mine < 3){ sheetInfo(T('noground'), T('noground2',{n:mine})); return; }
  sheetMode = 'name';
  document.getElementById('sheet-body').innerHTML = '';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'block';
  document.getElementById('sheet-in').value = names[addr] || '';
  sheet(T('nameland'), T('nameland2'));
  document.getElementById('sheet-ok').textContent = T('savename');
}
async function doName(){
  const label = document.getElementById('sheet-in').value.trim();
  closeSheet();
  try{
    const { data, error } = await sb.rpc('name_territory', { p_owner:addr, p_label:label });
    if(error || !data || !data.ok){ say(T('namebad'),'warn'); return; }
    names[addr] = label; await DB.put('kv', names, 'names');
    drawLabels(); say(T('named'),'good');
  }catch(e){ say(T('namelater'),'warn'); }
}

// ═══════════ Профиль ═══════════
let pushIsOn = false;
async function openProfile(){
  const turn = ++_sheetTurn;
  try{ pushIsOn = !!(await DB.get('kv','push')); }catch(e){ pushIsOn = false; }
  if(turn !== _sheetTurn) return;
  const mine = addr ? bunkers.filter(b=>b.owner===addr) : [];
  const area = myAreaM2();
  const first = mine.length ? new Date(Math.min(...mine.map(b=>+new Date(b.built_at)))) : null;
  const syncedAt = await DB.get('kv','syncedAt');
  let quota = '—';
  if(navigator.storage && navigator.storage.estimate){
    try{ const q = await navigator.storage.estimate();
      quota = T('pf_mb',{n:(q.usage/1048576).toFixed(1)}); }catch(e){}
  }
  const today = mine.filter(b => new Date(b.built_at).toDateString() === new Date().toDateString());

  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-p').textContent = '';
  sheetMode = 'info';
  document.getElementById('sheet-ok').textContent = T('backmap');

  document.getElementById('sheet-body').innerHTML =
    '<div class="pf-grid">'
    + cell(mine.length, T('pf_held'))
    + cell(area >= 1000000 ? (area/1000000).toFixed(2)+' km²' : Math.round(area).toLocaleString()+' m²', T('pf_area'))
    + cell(Math.max(0, cfg.earth_per_day - today.length - queue.length), T('pf_left'))
    + cell(bunkers.length, T('pf_onmap'))
    + '</div>'
    + '<div class="pf-sec">'+T('pf_land')+'</div>'
    + line(T('pf_name'), names[addr] ? esc(names[addr]) : T('pf_noname'))
    + line(T('pf_first'), first ? first.toISOString().slice(0,10) : '—')
    + line(T('pf_player'), esc(addr))
    + line(T('pf_wallet'), T('pf_walno'))
    + '<div class="pf-sec">'+T('pf_phone')+'</div>'
    + line(T('pf_stored'), T('pf_bunk',{n:bunkers.length}))
    + line(T('pf_queue'), queue.length)
    + line(T('pf_space'), quota)
    + line(T('pf_sync'), syncedAt ? new Date(syncedAt).toLocaleTimeString() : T('pf_never'))
    + line(T('pf_off'), T('pf_offyes'))
    + '<div class="pf-sec">'+T('pf_rules')+'</div>'
    + line(T('pf_free'), cfg.earth_per_day)
    + line(T('pf_at'), cfg.max_earth_alive)
    + line(T('pf_dist'), cfg.min_distance_m + ' m')
    + line(T('pf_ring'), cfg.radius_earth_m + ' m')
    + line(T('pf_sig'), T('pf_better',{n:cfg.max_accuracy_m}))
    + '<div class="pf-sec">'+T('pf_lang')+'</div>'
    + '<div class="lang-row">'
    + Object.keys(LANG).map(function(k){
        var NAMES={en:'English',uk:'Українська',ru:'Русский',pl:'Polski',zh:'中文',es:'Español',de:'Deutsch',tr:'Türkçe'};
        return '<button class="lang-btn'+(k===lang?' on':'')+'" translate="no" onclick="setLang(\''+k+'\')">'+(NAMES[k]||k.toUpperCase())+'</button>';
      }).join('')
    + '</div>'
    + '<div class="row" style="margin:18px 0 0;">'
    + '<button class="btn-ghost" onclick="window.open(\'https://opengate.bond\',\'_blank\')">'+esc(T('pf_og'))+'</button>'
    + '<button class="btn-ghost" onclick="sync();closeSheet()">'+esc(T('pf_sync2'))+'</button>'
    + '</div>'
    + '<div class="row" style="margin:10px 0 0;">'
    + '<button class="btn-ghost" onclick="showMove()">'+esc(T('mv_btn'))+'</button>'
    + '</div>'
    + '<div class="row" style="margin:8px 0 0;">'
    + '<button class="btn-buy" style="flex:1;padding:11px" onclick="openShop()">'+esc(T('sh_title'))+'</button>'
    + '<button class="btn-ghost" onclick="openClan()">'+esc(T('cl_title'))+'</button>'
    + '</div>'
    + '<div class="row" style="margin:8px 0 0;">'
    + '<button class="btn-ghost" onclick="pushToggle()">'
    +   esc(T(pushIsOn ? 'nt_btn_off' : 'nt_btn_on')) + '</button>'
    + '</div>';
  document.getElementById('sheet-t').textContent = T('pf_title');
  document.getElementById('veil').classList.add('on');
}
async function setLang(k){
  lang = k;
  try{ await DB.put('kv', k, 'lang'); }catch(e){}
  applyLang(); openProfile();
}
function cell(v,l){ return '<div class="pf-cell"><div class="pf-v">'+v+'</div><div class="pf-l">'+l+'</div></div>'; }
function line(l,v){ return '<div class="pf-line"><span>'+l+'</span><b>'+v+'</b></div>'; }

// ═══════════ Мелочи ═══════════
function say(t, cls){ const m = document.getElementById('msg'); m.textContent = t; m.className = cls||''; }
function sheet(title, text){
  document.getElementById('sheet-t').textContent = title;
  document.getElementById('sheet-p').textContent = text;
  document.getElementById('veil').classList.add('on');
}
function sheetInfo(t, p){
  sheetMode = 'info';
  document.getElementById('sheet-body').innerHTML = '';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-ok').textContent = T('gotit');
  sheet(t, p);
}
function closeSheet(){
  _sheetTurn++;
  stopChat(); document.getElementById('veil').classList.remove('on'); }
function sheetOk(){
  if(sheetMode === 'plant') doPlant();
  else if(sheetMode === 'bunker') doAttack();
  else if(sheetMode === 'gun') doGun();
  else if(sheetMode === 'name') doName();
  else closeSheet();
}
function esc(s){ return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

// Постоянного соединения нет намеренно. Оно присылало КАЖДУЮ постройку
// на планете каждому телефону: 500 тысяч построек в сутки на 50 тысяч
// подключённых — 25 миллиардов сообщений в сутки при включённых
// пяти миллионах в месяц. Вместо него редкий опрос своего района,
// и только пока игра на экране.
let _poll = null, _lastSync = 0, _lastPing = 0, _lastPingAt = null, _movedAt = 0;
// Идёшь — спрашиваем раз в 3 минуты. Стоишь — раз в 10.
// Человек на диване не должен стоить столько же, сколько идущий по городу.
function pollEvery(){ return (Date.now() - _movedAt < 5*60000) ? 180000 : 600000; }
function tick(){
  if(document.hidden || !navigator.onLine) return;
  const now = Date.now();
  if(now - _lastSync >= pollEvery()){ _lastSync = now; sync(); }
  // «Кто рядом» — только если сдвинулся на 100 м или прошло 10 минут
  const far = here && _lastPingAt
      ? metersBetween(_lastPingAt[0], _lastPingAt[1], here[0], here[1]) : 1e9;
  if(here && (far > 100 || now - _lastPing >= 600000)){
    _lastPing = now; _lastPingAt = here.slice(); pingNearby();
  }
}
function startPoll(){
  if(_poll) return;
  _poll = setInterval(tick, 60000);
}
function stopPoll(){ if(_poll){ clearInterval(_poll); _poll = null; } }

// Кто рядом. Наружу уходит КЛЕТКА карты, а не точка, и обратно —
// только число. Ни имён, ни чужих координат. Раз в две минуты.
async function pingNearby(){
  if(!addr || !here || !navigator.onLine || document.hidden) return;
  try{
    const { data } = await sb.rpc('territory_ping', { p:{ wallet:addr, lat:here[0], lng:here[1] } });
    if(data && data.ok) document.getElementById('s-players').textContent = data.nearby;
  }catch(e){}
}
setTimeout(tick, 8000);

// Ссылку переноса могли открыть, когда игра уже запущена — тогда
// страница не перезагружается, меняется только хвост адреса.
window.addEventListener('hashchange', function(){ checkMoveLink(); });

window.addEventListener('online',  () => { linkState(T('st_back')); sync(); });
window.addEventListener('offline', () => linkState(T('st_offline'),'off'));

// Заставку снимаем ОБЯЗАТЕЛЬНО. Раньше она пряталась в конце запуска,
// и если что-то по дороге падало — человек видел чёрный экран навсегда.
function hideSplash(){
  var sp = document.getElementById('splash');
  if(!sp) return;
  sp.className = 'gone';
  setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 500);
}
setTimeout(hideSplash, 6000);        // страховка на случай любой поломки

(async function start(){
  // Регистрируем первым делом и отдельно: если споткнётся что-то ниже,
  // приложение не должно остаться без работы вне сети.
  if('serviceWorker' in navigator){
    try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
  }
  initMap();
  try{ await DB.open(); }catch(e){}
  try{ await ensureId(); }catch(e){}
  try{ if(await checkMoveLink()) return; }catch(e){}
  ensureKey();
  await loadLangPack();
  try{ lang = pickLang(await DB.get('kv','lang')); }catch(e){ lang = pickLang(); }
  applyLang();
  try{ await loadLocal(); }catch(e){ linkState(T('st_nolocal'),'off'); }
  bunkers.forEach(b => haveIds.add(b.id));
  try{
    units = (await DB.all('units')) || [];
    units.forEach(u => haveUnitIds.add(u.id));
  }catch(e){ units = []; }
  // Список «найденного» из времён тумана больше не нужен: чистим,
  // чтобы он не занимал место в телефоне у тех, кто уже играл.
  try{ await DB.put('kv', null, 'seenIds'); }catch(e){}
  paintGunBtn(); paintBagBtn(); Sprites.refresh(); drawRing();
  watchMe();
  startPoll();
  sync();
  hideSplash();
})();
</script>
