<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8"/>
<meta name="google" content="notranslate"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<title>Gate Territory</title>
<meta name="theme-color" content="#12140F"/>
<link rel="manifest" href="manifest.json"/>
<meta name="description" content="Come to the spot. Plant a bunker. Hold the ground."/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Gate Territory"/>
<meta property="og:description" content="Come to the spot. Plant a bunker. Hold the ground."/>
<meta property="og:image" content="share-1200x630.jpg"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="share-1200x630.jpg"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{
  --field:#12140F; --field-2:#1B1E16; --line:#2E332A;
  --sand:#E8E2D0; --sand-dim:#9AA08C;
  --amber:#E0A32E; --rust:#B4462F; --ok:#7FA65C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--field);
  color:var(--sand);font-family:'Space Mono',ui-monospace,monospace;overflow-wrap:break-word;}
#map{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--field);}
/* Значки бункеров и пушек. Отдельный холст поверх карты: один рисунок
   штампуется сколько угодно раз, элементов страницы не создаётся. */
.ogt-sprites{position:absolute;top:0;left:0;right:0;bottom:0;z-index:450;pointer-events:none;}
.mv-warn{font-size:12px;line-height:1.5;color:#C9A227;margin:8px 0 10px;}
.mv-link{font-family:'Space Mono',monospace;font-size:10px;line-height:1.45;word-break:break-all;
  background:rgba(0,0,0,.35);border:1px solid rgba(224,163,46,.28);border-radius:8px;padding:9px;
  color:#D8D3C4;user-select:all;-webkit-user-select:all;}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9000;background:#12140F;display:flex;
  align-items:center;justify-content:center;flex-direction:column;
  transition:opacity .45s ease;}
#splash.gone{opacity:0;pointer-events:none;}
#splash img{width:min(76vw,340px);height:auto;border-radius:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.6);}
#splash-bar{width:min(76vw,340px);height:3px;margin-top:18px;border-radius:3px;
  background:rgba(224,163,46,.18);overflow:hidden;}
#splash-bar i{display:block;height:100%;width:35%;border-radius:3px;background:#E0A32E;
  animation:sweep 1.1s ease-in-out infinite;}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
.leaflet-tile-pane{filter:grayscale(1) brightness(.42) contrast(1.15);}
.leaflet-container{background:var(--field);}
.leaflet-control-attribution{background:rgba(18,20,15,.82)!important;color:var(--sand-dim)!important;font-size:9px!important;}
.leaflet-control-attribution a{color:var(--sand-dim)!important;}

#hud{position:absolute;top:0;left:0;right:0;z-index:600;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  background:linear-gradient(180deg,rgba(18,20,15,.94),rgba(18,20,15,0));pointer-events:none;}
#hud-row{display:flex;align-items:center;gap:8px;}
#brand{font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;letter-spacing:.09em;
  text-transform:uppercase;}
#brand em{font-style:normal;color:var(--amber);}
.chip{pointer-events:auto;border:1px solid var(--line);border-radius:100px;padding:5px 10px;
  background:rgba(27,30,22,.92);color:var(--sand-dim);font-size:10.5px;font-family:'Space Mono',monospace;
  cursor:pointer;}
#who{margin-left:auto;}
#stats{display:flex;gap:14px;margin-top:8px;font-size:10px;color:var(--sand-dim);letter-spacing:.05em;}
#stats b{color:var(--sand);font-size:13px;font-weight:700;display:block;font-family:'Oswald',sans-serif;}

/* Полоса состояния связи — видно, что игра идёт с телефона */
#link{position:absolute;top:calc(env(safe-area-inset-top) + 74px);left:12px;z-index:600;
  font-size:9.5px;letter-spacing:.08em;color:var(--sand-dim);pointer-events:none;}
#link.off{color:var(--rust);}
#link.queued{color:var(--amber);}

#retic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:500;
  pointer-events:none;width:132px;height:132px;}
#retic svg{width:100%;height:100%;overflow:visible;}
#retic .ring{fill:none;stroke:var(--rust);stroke-width:1.5;opacity:.85;
  transition:stroke .5s ease, r .8s cubic-bezier(.2,.8,.2,1);}
#retic .tick{stroke:var(--rust);stroke-width:2;transition:stroke .5s ease;}
#retic.lock .ring,#retic.lock .tick{stroke:var(--amber);}
#retic .spin{transform-origin:50% 50%;animation:spin 9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#retic.lock .spin{animation-duration:3.5s;}
@media (prefers-reduced-motion:reduce){#retic .spin{animation:none;}}
#acc{position:absolute;left:50%;top:calc(50% + 78px);transform:translateX(-50%);z-index:500;
  font-size:10px;letter-spacing:.1em;color:var(--rust);pointer-events:none;text-align:center;}
#retic.lock ~ #acc{color:var(--amber);}

#dock{position:absolute;left:0;right:0;bottom:0;z-index:600;
  padding:14px 12px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(0deg,rgba(18,20,15,.96) 55%,rgba(18,20,15,0));}
#msg{font-size:11.5px;line-height:1.55;color:var(--sand-dim);margin-bottom:10px;min-height:32px;}
#msg.warn{color:var(--rust);}
#msg.good{color:var(--ok);}
.btn{width:100%;border:none;border-radius:4px;padding:16px;font-family:'Oswald',sans-serif;
  font-size:16px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;}
#plant{background:var(--amber);color:#12140F;}
#plant:disabled{background:var(--field-2);color:var(--sand-dim);border:1px solid var(--line);cursor:not-allowed;}
.row{display:flex;gap:8px;margin-top:8px;}
.btn-ghost{flex:1;background:var(--field-2);border:1px solid var(--line);color:var(--sand);
  border-radius:4px;padding:11px;font-family:'Oswald',sans-serif;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;cursor:pointer;}

.place-pin{font-size:15px;color:#7FA65C;text-shadow:0 1px 4px #000;white-space:nowrap;
  transform:translate(-50%,-50%);}
.place-pin span{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;margin-left:5px;}
.ad-box{position:relative;background:var(--field-2);border:1px solid var(--line);
  border-radius:5px;padding:11px 12px;margin-bottom:10px;cursor:pointer;}
.ad-box b{display:block;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.04em;}
.ad-box span:not(.ad-tag){display:block;font-size:11px;color:var(--sand-dim);margin-top:3px;line-height:1.5;}
.ad-box img{width:100%;border-radius:3px;margin-bottom:7px;}
.ad-tag{position:absolute;top:7px;right:8px;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--sand-dim);border:1px solid var(--line);
  border-radius:2px;padding:1px 4px;}
.terr-label{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 12px #000;}
.terr-mine{color:var(--amber);} .terr-them{color:var(--rust);}

#veil{position:fixed;top:0;left:0;right:0;bottom:0;z-index:900;background:rgba(9,10,7,.92);display:none;
  align-items:flex-end;justify-content:center;}
#veil.on{display:flex;}
#sheet{background:var(--field-2);border-top:1px solid var(--line);border-radius:10px 10px 0 0;
  padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;}
#sheet h2{font-family:'Oswald',sans-serif;font-size:19px;letter-spacing:.08em;text-transform:uppercase;
  margin:0 0 12px;}
#sheet p{font-size:12.5px;line-height:1.7;color:var(--sand-dim);margin:0 0 14px;}
#sheet input{width:100%;background:var(--field);border:1px solid var(--line);color:var(--sand);
  border-radius:4px;padding:13px;font-family:'Space Mono',monospace;font-size:15px;margin-bottom:12px;}
#shot{width:100%;border-radius:4px;border:1px solid var(--line);margin-bottom:12px;display:none;}

/* Профиль */
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.pf-cell{background:var(--field);border:1px solid var(--line);border-radius:5px;padding:12px;}
.pf-v{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--amber);line-height:1.1;}
.pf-l{font-size:9.5px;color:var(--sand-dim);letter-spacing:.07em;text-transform:uppercase;margin-top:4px;}
.pf-sec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sand-dim);
  border-bottom:1px solid var(--line);padding-bottom:6px;margin:18px 0 10px;}
.pf-line{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;
  color:var(--sand-dim);padding:6px 0;}
.pf-line b{color:var(--sand);font-weight:400;text-align:right;word-break:break-all;}
.lang-row{display:flex;flex-wrap:wrap;gap:6px;}
.btn-gun{width:100%;margin-top:8px;border-color:rgba(224,163,46,.45);}
#ring-badge{position:absolute;left:12px;top:96px;z-index:600;max-width:64vw;
  background:rgba(18,20,15,.9);border:1px solid rgba(201,162,39,.5);border-radius:9px;
  padding:7px 10px;font-size:11.5px;line-height:1.35;color:#C9A227;pointer-events:none;}
#ring-badge.broken{border-color:rgba(178,58,46,.7);color:#E27A5F;}
#why{margin:0 0 8px;border-radius:9px;padding:8px 11px;
  font-size:12.5px;line-height:1.35;text-align:center;}
#why.bad{background:rgba(180,70,47,.92);color:#fff;}
#why.okz{background:rgba(127,191,106,.9);color:#12140F;font-weight:700;}
#mode-row{margin-top:8px;}
.mode{flex:1;}
.mode.on{background:rgba(224,163,46,.18);border-color:#E0A32E;color:#E0A32E;}
/* Круглые кнопки: занимают меньше места, карты видно больше */
.btn, .btn-ghost { border-radius:999px !important; }
.chip { border-radius:999px !important; }
#dock { padding:8px 10px 10px !important; }
#dock .btn { padding:12px !important; font-size:15px; }
#dock .btn-ghost { padding:9px !important; font-size:12.5px; }
#mode-row { margin-top:6px; }
#why { margin:0 0 6px; padding:7px 11px; border-radius:999px; }
.hp-list{margin:9px 0 4px;}
.hp{display:flex;align-items:center;gap:8px;padding:5px 8px;margin:3px 0;
  border-radius:999px;background:rgba(255,255,255,.05);border:1px solid transparent;}
.hp.sel{border-color:#E0A32E;background:rgba(224,163,46,.14);}
.hp-n{font-size:11px;color:#9A9585;width:58px;flex:none;}
.hp-bar{flex:1;height:9px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;}
.hp-bar i{display:block;height:100%;border-radius:99px;background:#C9A227;
  transition:width .35s ease;}
.hp.gun .hp-bar i{background:#7FBF6A;}
.hp-v{font:700 12px/1 ui-monospace,Menlo,monospace;color:#E8E3D5;width:34px;
  text-align:right;flex:none;font-variant-numeric:tabular-nums;}
.sg-sub.warn{color:#E27A5F;}
.sg-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
#siege-box{padding:9px 12px;}
#siege-box .sg-time{font-size:22px;}
#siege-box .sg-top{font-size:10px;}
#siege-box .sg-row{margin-top:7px;}
#siege-box .btn-ghost{padding:7px !important;font-size:12px;}
#bag-btn{position:absolute;right:10px;top:96px;z-index:600;width:46px;height:46px;
  border-radius:999px;background:rgba(18,20,15,.92);border:1px solid rgba(224,163,46,.55);
  color:#E0A32E;font-size:20px;display:none;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.4);}
#bag-btn i{position:absolute;right:-3px;top:-3px;min-width:18px;height:18px;padding:0 4px;
  border-radius:999px;background:#B23A2E;color:#fff;font:700 11px/18px ui-monospace,monospace;
  font-style:normal;text-align:center;}
#aim-bar{position:fixed;left:12px;right:12px;top:96px;z-index:900;display:none;
  padding:11px 14px;border-radius:12px;text-align:center;font-size:13px;
  background:rgba(224,163,46,.92);color:#141610;font-weight:700;}
.chip-hot{background:rgba(224,163,46,.16);border-color:#E0A32E;color:#E0A32E;font-weight:700;}
#btn-profile{background:rgba(224,163,46,.16);border-color:#E0A32E;color:#E0A32E;font-weight:700;}
.wallet-row{display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;border-radius:10px;background:rgba(224,163,46,.12);
  border:1px solid rgba(224,163,46,.35);}
.wallet-row span{font-size:12px;color:#9A9585;}
.pf-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.pf-row span{flex:1;min-width:0;}
.pf-row b{flex:none;text-align:right;}
.wallet-row b{font-size:20px;color:#E0A32E;font-variant-numeric:tabular-nums;}
.card{display:flex;gap:10px;margin:8px 0;padding:8px;border-radius:11px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);}
.card img{width:84px;height:84px;border-radius:8px;object-fit:cover;flex:none;background:#1B1E16;}
.card-b{flex:1;min-width:0;}
.card-t{font-size:14px;font-weight:700;}
.card-t i{font-style:normal;font-size:12px;color:#C9A227;}
.card-d{font-size:11.5px;color:#9A9585;line-height:1.4;margin-top:2px;}
.card-r{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:8px;}
.price{font:700 15px/1 ui-monospace,Menlo,monospace;color:#C9A227;}
.btn-buy{padding:7px 14px;border-radius:8px;border:1px solid #E0A32E;
  background:#E0A32E;color:#12140F;font-weight:700;font-size:12.5px;}
.btn-buy.off{background:transparent;color:#9A9585;border-color:#3A3F33;}
.shop-wait{padding:20px;text-align:center;color:#6E7566;}
.sum-box{display:flex;align-items:center;gap:10px;margin-top:6px;}
.sum-pm{width:52px;height:52px;border-radius:12px;border:1px solid rgba(224,163,46,.45);
  background:transparent;color:#E0A32E;font-size:26px;font-weight:700;flex:none;}
.sum-mid{flex:1;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.35);
  border:1px solid rgba(224,163,46,.35);border-radius:12px;padding:8px 12px;}
.sum-mid span{font-size:22px;color:#C9A227;font-weight:700;}
.sum-mid input{flex:1;width:100%;background:transparent;border:0;color:#E8E3D5;
  font:700 26px/1 ui-monospace,Menlo,monospace;outline:none;}
.sum-hint{margin-top:7px;font-size:12px;color:#9A9585;text-align:center;}
.sum-hint.bad{color:#E27A5F;}
.btn-help{width:34px;height:34px;border-radius:8px;border:1px solid rgba(224,163,46,.45);
  background:transparent;color:#E0A32E;font-weight:700;font-size:16px;flex:none;}
.help-img{width:100%;border-radius:12px;margin-bottom:4px;}
.help-p{font-size:13.5px;line-height:1.55;color:#D8D3C4;white-space:pre-line;margin:6px 0 10px;}
#chat-list{max-height:46vh;overflow-y:auto;margin:4px 0 8px;}
.chat-m{padding:6px 9px;margin:4px 0;border-radius:9px;background:rgba(255,255,255,.05);}
.chat-m.me{background:rgba(224,163,46,.14);}
.chat-m b{font-size:11px;color:#C9A227;margin-right:6px;font-family:'Space Mono',monospace;}
.chat-m i{font-size:10px;color:#6E7566;font-style:normal;}
.chat-m span{display:block;font-size:13.5px;margin-top:2px;word-break:break-word;}
.chat-empty{padding:14px;text-align:center;color:#6E7566;font-size:12.5px;}
.chat-send{display:flex;gap:8px;}
.chat-send input{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(224,163,46,.3);
  border-radius:9px;padding:9px 11px;color:#E8E3D5;font-size:14px;}
#siege-box{position:absolute;left:12px;right:12px;top:96px;z-index:620;
  background:rgba(18,20,15,.94);border:1px solid rgba(178,58,46,.65);border-radius:12px;
  padding:11px 13px;color:#E8E3D5;}
#siege-box.defend{border-color:rgba(127,191,106,.6);}
.sg-top{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#B23A2E;font-weight:700;}
#siege-box.defend .sg-top{color:#7FBF6A;}
.sg-time{font-size:27px;font-weight:700;line-height:1.1;margin-top:1px;
  font-variant-numeric:tabular-nums;}
.sg-sub{font-size:11.5px;color:#9A9585;margin-top:2px;}
.sg-bar{height:6px;border-radius:3px;background:#2A2E24;margin-top:9px;overflow:hidden;}
.sg-bar i{display:block;height:100%;background:#B23A2E;border-radius:3px;}
#siege-box.defend .sg-bar i{background:#7FBF6A;}
.sg-row{display:flex;gap:8px;margin-top:9px;}
.sg-row .btn-ghost{flex:1;}
#shell-warn{margin-top:9px;border-radius:10px;padding:9px 12px;
  text-align:center;font-size:13px;letter-spacing:.03em;}
#shell-warn.hot{background:rgba(178,58,46,.94);color:#fff;}
#shell-warn.safe{background:rgba(18,20,15,.9);border:1px solid rgba(178,58,46,.5);color:#E27A5F;}
#shell-warn b{display:block;font-weight:700;}
#shell-warn i{display:block;font-style:normal;font-weight:400;font-size:11px;opacity:.9;margin-top:2px;}
.btn-gun[disabled]{opacity:.4;}
.lang-btn{background:var(--field);border:1px solid var(--line);color:var(--sand-dim);
  border-radius:4px;padding:8px 12px;font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;}
.lang-btn.on{border-color:var(--amber);color:var(--amber);}
</style>
</head>
<body>
<div id="splash"><img src="splash-1080.webp" alt="Gate Territory" fetchpriority="high"/><div id="splash-bar"><i></i></div></div>

<div id="map"></div>

<div id="retic">
  <svg viewBox="0 0 132 132">
    <g class="spin"><circle class="ring" cx="66" cy="66" r="52" stroke-dasharray="6 12"/></g>
    <circle class="ring" id="acc-ring" cx="66" cy="66" r="30"/>
    <line class="tick" x1="66" y1="44" x2="66" y2="56"/>
    <line class="tick" x1="66" y1="76" x2="66" y2="88"/>
    <line class="tick" x1="44" y1="66" x2="56" y2="66"/>
    <line class="tick" x1="76" y1="66" x2="88" y2="66"/>
  </svg>
</div>
<div id="acc">looking for satellites</div>

<div id="hud">
  <div id="hud-row">
    <div id="brand"><em>Gate</em> Territory</div>
    <button class="chip" id="btn-profile" onclick="openProfile()">profile</button>
    <button class="chip chip-hot" id="who" onclick="openProfile()">guest</button>
  </div>
  <div id="stats">
    <div><span id="lbl-yours">YOURS</span><b id="s-mine">—</b></div>
    <div><span id="lbl-near">NEARBY</span><b id="s-near">—</b></div>
    <div><span id="lbl-today">TODAY</span><b id="s-left">—</b></div>
    <div><span id="lbl-players">NEAR YOU</span><b id="s-players">—</b></div>
  </div>
</div>
<div id="ring-badge" style="display:none"></div>
<button id="bag-btn" onclick="openBag()" style="display:none" title="bag">✦</button>
<div id="siege-box" style="display:none"></div>
<div id="shell-warn" style="display:none"></div>
<div id="link"><span id="link-pre">on device</span> · <span id="link-txt">starting</span></div>

<div id="dock">
  <div class="ad-box" id="ad-dock" style="display:none"></div>
  <div id="msg">Stand where you want your bunker. The ring locks when the signal is good enough.</div>
  <div id="build-block">
  <div id="why" style="display:none"></div>
  <button class="btn" id="plant" onclick="placeMode==='gun'?askGun():plant()" disabled>Plant bunker</button>
  <div class="row" id="mode-row">
    <button class="btn-ghost mode on" id="m-bunker" onclick="setMode('bunker')">Bunker</button>
    <button class="btn-ghost mode" id="m-gun" onclick="setMode('gun')">Cannon</button>
  </div>
  </div>

function mergePack(d){
  for(const l in d){
    LANG[l] = Object.assign({}, LANG[l] || {}, d[l]);
  }
  // у английского вшитые слова всегда добивают пропуски
  LANG.en = Object.assign({}, d.en || {}, EN_BUILTIN, d.en || {});
  for(const k in EN_BUILTIN) if(LANG.en[k] === undefined) LANG.en[k] = EN_BUILTIN[k];
}

async function loadLangPack(){
  try{
    const p = await DB.get('kv','langpack');
    if(p && p.v === LANG_V && p.d){ mergePack(p.d); return true; }
  }catch(e){}
  try{
    // Номер издания в адресе — иначе телефон отдаёт старый файл из кэша
    // и новые слова не приезжают никогда.
    let r = await fetch('lang.json?v=' + LANG_V, { cache:'no-cache' });
    if(!r.ok) r = await fetch('lang.json');
    if(!r.ok) return false;
    const d = await r.json();
    mergePack(d);
    try{ await DB.put('kv', { v:LANG_V, d:d }, 'langpack'); }catch(e){}

  }catch(e){ return false; }
}

// Склонение числительных. По-русски «1 бункер», «2 бункера»,
// «5 бункеров» — без этого игра выглядит машинным переводом.
// В строке пишем [[бункер|бункера|бункеров]], подставляется по числу n.
function plural(n, forms){
  n = Math.abs(Number(n)) || 0;
  var slav = ['ru','uk','pl','be'].indexOf(lang) >= 0;
  if(slav){
    var h = n % 100, t = n % 10;
    if(h > 10 && h < 20) return forms[2] || forms[1] || forms[0];
    if(t === 1) return forms[0];
    if(t >= 2 && t <= 4) return forms[1] || forms[0];
    return forms[2] || forms[1] || forms[0];
  }
  return n === 1 ? forms[0] : (forms[1] || forms[0]);
}
function T(k, vars){
  var d = LANG[lang] || LANG.en;

  if(vars) Object.keys(vars).forEach(function(n){ s = s.split('{'+n+'}').join(vars[n]); });
  var n = vars && vars.n;
  s = s.replace(/\[\[([^\]]+)\]\]/g, function(_, body){
    return plural(n, body.split('|'));
  });
  return s;
}

// ═══════════ Хранилище в телефоне ═══════════
const DB = (function(){
  let db = null;
  function open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('ogt', 2);
      r.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains('bunkers')) d.createObjectStore('bunkers', { keyPath:'id' });
        if(!d.objectStoreNames.contains('kv'))      d.createObjectStore('kv');
        if(!d.objectStoreNames.contains('queue'))   d.createObjectStore('queue', { keyPath:'tmp' });
        // Снимки живут ТОЛЬКО здесь. В базу уходит один отпечаток:
        // год игры это 19 МБ вместо 21 ГБ, и карта не тяжелеет.
        if(!d.objectStoreNames.contains('photos'))  d.createObjectStore('photos');
        if(!d.objectStoreNames.contains('units'))   d.createObjectStore('units', { keyPath:'id' });
      };
      r.onsuccess = e => { db = e.target.result; res(db); };
      r.onerror = () => rej(r.error);
    });
  }
  function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
  function all(store){
    return new Promise(res => { const q = tx(store,'readonly').getAll(); q.onsuccess = () => res(q.result||[]); q.onerror = () => res([]); });
  }
  function put(store, val, key){
    return new Promise(res => { const q = key !== undefined ? tx(store,'readwrite').put(val,key) : tx(store,'readwrite').put(val); q.onsuccess = () => res(true); q.onerror = () => res(false); });
  }
  function del(store, key){
    return new Promise(res => { const q = tx(store,'readwrite').delete(key); q.onsuccess = () => res(true); q.onerror = () => res(false); });
  }
  function get(store, key){
    return new Promise(res => { const q = tx(store,'readonly').get(key); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); });
  }
  return { open, all, put, del, get };
})();

// Отпечаток снимка. Считает сам телефон, наружу уходят 64 знака.
// Если когда-нибудь дойдёт до разбирательства, телефон предъявит фото,
// а отпечаток докажет, что его не подменили.
async function photoHash(dataUrl){
  try{
    const bin = atob(dataUrl.split(',')[1]);
    const buf = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }
}

// ═══════════ Расстояние — считает телефон ═══════════
// Формула гаверсинуса: по дуге, а не по прямой. На плоскости
// ошибка растёт с широтой, а игра рассчитана на весь мир.
function metersBetween(a, b, c, d){
  const R = 6371000, t = Math.PI/180;
  const s1 = Math.sin((c-a)*t/2), s2 = Math.sin((d-b)*t/2);
  return 2*R*Math.asin(Math.sqrt(s1*s1 + Math.cos(a*t)*Math.cos(c*t)*s2*s2));
}

// У пушек своё расстояние: 200 м, вдвое меньше бункерного. Внутри
// круга радиусом 250 м это даёт ровно 7 мест — одно в центре и шесть
// кольцом. Соты, которые красиво ложатся на карту.
function nearestUnit(lat, lng, list){
  let bestD = Infinity;
  for(const u of (list||[])){
    const d = metersBetween(lat, lng, u.lat, u.lng);
    if(d < bestD) bestD = d;
  }
  return bestD;
}

function nearestBunker(lat, lng){
  let best = null, bestD = Infinity;
  for(const b of bunkers){
    if(Math.abs(b.lat-lat) > 0.01 || Math.abs(b.lng-lng) > 0.01) continue;
    const d = metersBetween(lat, lng, b.lat, b.lng);
    if(d < bestD){ bestD = d; best = b; }
  }
  return { b: best, d: bestD };
}

// Площадь владений: сетка 10×10 м по своим кругам. Считает процессор
// телефона, наружу не уходит ничего.
function myAreaM2(){
  const mine = bunkers.filter(b => addr && b.owner === addr);
  if(!mine.length) return 0;
  const R = cfg.radius_earth_m, step = 10;
  let minLat=90, maxLat=-90, minLng=180, maxLng=-180;
  const dLat = R/111320;
  for(const b of mine){
    const dLng = R/(111320*Math.cos(b.lat*Math.PI/180));
    minLat=Math.min(minLat,b.lat-dLat); maxLat=Math.max(maxLat,b.lat+dLat);
    minLng=Math.min(minLng,b.lng-dLng); maxLng=Math.max(maxLng,b.lng+dLng);
  }
  const latStep = step/111320;
  const lngStep = step/(111320*Math.cos(((minLat+maxLat)/2)*Math.PI/180));
  let cells = 0, guard = 0;
  for(let la=minLat; la<=maxLat && guard<400000; la+=latStep){
    for(let ln=minLng; ln<=maxLng && guard<400000; ln+=lngStep){
      guard++;
      for(const b of mine){
        if(metersBetween(la, ln, b.lat, b.lng) <= R){ cells++; break; }
      }
    }
  }
  return cells * step * step;
}


// ═══════════ Значки на карте ═══════════
// Каждый значок рисуется ОДИН раз в отдельную картинку и потом
// штампуется. Раньше на каждый бункер создавался свой кружок-элемент:
// на трёхстах штуках телефон начинал тормозить и греться.
const GOLD='#C9A227', DOOR='#1E7A4A', DGREEN='#2C4327', STONE='#9A968A',
      STEEL='#6E7480', DARKI='#22261D', FOE='#B23A2E';
const _spriteCache = new Map();

function sprite(kind, px, foe){
  const key = kind+'|'+px+'|'+(foe?1:0);
  if(_spriteCache.has(key)) return _spriteCache.get(key);
  const s = document.createElement('canvas');
  const r = Math.min(window.devicePixelRatio || 1, 2);
  s.width = s.height = Math.round(px*r);
  const c = s.getContext('2d'); c.scale(r,r);
  const m = px/32, C = px/2, line = foe ? FOE : GOLD;
  c.lineJoin = c.lineCap = 'round';
  function poly(n, rad, rot, fill, stroke, lw){
    c.beginPath();
    for(let i=0;i<n;i++){
      const a = rot + i*2*Math.PI/n;
      const x = C + Math.cos(a)*rad, y = C + Math.sin(a)*rad;
      i ? c.lineTo(x,y) : c.moveTo(x,y);
    }
    c.closePath();
    if(fill){ c.fillStyle=fill; c.fill(); }
    if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw*m; c.stroke(); }
  }
  if(kind==='concrete'){
    poly(6, 13*m, Math.PI/6, STONE, line, 2.2);
    c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(C-9*m, C-1.2*m, 18*m, 2.4*m);
    c.fillStyle=DOOR; c.fillRect(C-3.2*m, C-4*m, 6.4*m, 8*m);
    c.strokeStyle=GOLD; c.lineWidth=1.1*m; c.strokeRect(C-3.2*m, C-4*m, 6.4*m, 8*m);
  } else if(kind==='steel'){
    poly(8, 13.5*m, Math.PI/8, STEEL, line, 2.4);
    c.fillStyle='rgba(255,255,255,.35)';
    for(let i=0;i<8;i++){ const a=Math.PI/8+i*Math.PI/4;
      c.beginPath(); c.arc(C+Math.cos(a)*10*m, C+Math.sin(a)*10*m, 1.3*m,0,7); c.fill(); }
    c.fillStyle=DOOR; c.beginPath(); c.arc(C,C,4.6*m,0,7); c.fill();
    c.strokeStyle=GOLD; c.lineWidth=1.3*m; c.stroke();
  } else if(kind==='fort'){
    c.beginPath();
    for(let i=0;i<12;i++){ const a=i*Math.PI/6, rad=(i%2? 9.5:15)*m;
      const x=C+Math.cos(a)*rad, y=C+Math.sin(a)*rad; i?c.lineTo(x,y):c.moveTo(x,y); }
    c.closePath(); c.fillStyle=STONE; c.fill();
    c.strokeStyle=line; c.lineWidth=2.4*m; c.stroke();
    c.fillStyle=DGREEN; c.beginPath(); c.arc(C,C,6*m,0,7); c.fill();
    c.fillStyle=GOLD; c.beginPath(); c.arc(C,C,2.4*m,0,7); c.fill();
  } else if(kind==='gun'||kind==='heavy'||kind==='rocket'){
    const base = kind==='rocket'? 9.5*m : kind==='heavy'? 9*m : 7.5*m;
    c.fillStyle = kind==='gun'? DGREEN : kind==='heavy'? '#3E4A33' : '#43382B';
    c.beginPath(); c.arc(C,C,base,0,7); c.fill();
    c.strokeStyle=line; c.lineWidth=2*m; c.stroke();
    if(kind==='rocket'){
      c.strokeStyle=GOLD; c.lineWidth=2.2*m;
      [[-2.6,-11],[2.6,-11]].forEach(function(q){
        c.beginPath(); c.moveTo(C+q[0]*m, C-2*m); c.lineTo(C+q[0]*m, C+q[1]*m); c.stroke(); });
    } else {
      c.strokeStyle=DARKI; c.lineWidth = kind==='heavy'? 4*m : 3*m;
      c.beginPath(); c.moveTo(C,C); c.lineTo(C, C-13*m); c.stroke();
    }
  } else if(kind==='radar'){
    c.fillStyle=DGREEN; c.beginPath(); c.arc(C,C,7.5*m,0,7); c.fill();
    c.strokeStyle=line; c.lineWidth=2*m; c.stroke();
    c.strokeStyle=GOLD; c.lineWidth=1.6*m;
    for(let i=1;i<=3;i++){ c.beginPath(); c.arc(C,C,(7+i*3.2)*m, -Math.PI*0.78, -Math.PI*0.22); c.stroke(); }
  } else {                                   // земляной — насыпь с мешками
    poly(8, 13*m, Math.PI/8, DGREEN, line, 2);
    c.fillStyle='rgba(255,255,255,.18)';
    for(let i=0;i<6;i++){ const a=i*Math.PI/3;
      c.beginPath(); c.arc(C+Math.cos(a)*8*m, C+Math.sin(a)*8*m, 2.4*m, 0, 7); c.fill(); }
    c.fillStyle=DOOR; c.fillRect(C-2.6*m, C-3*m, 5.2*m, 6*m);
  }
  _spriteCache.set(key, s);
  return s;
}

// Прочность живых целей: id → сколько осталось и сколько всего.
// Полоски рисуются НАД строениями на карте, как в обычных играх.
const HP = new Map();
function hpSet(key, now, max){ if(max > 0) HP.set(key, { hp: now, max: max, t: Date.now() }); }
// Полоски рисуются по ВСЕМ живым осадам района, а не только по той,
// в которой я стою. Раньше HP наполнялся исключительно из своего
// siege_tick: стоило хозяину нажать «уйти», тики прекращались и полоса
// пропадала — хотя точку продолжали грызть. Теперь источник данных
// один и тот же для всех: список sieges, который и так приходит.
function hpFromSieges(){
  HP.clear();
  for(const s of (sieges || [])){
    const max = Number(s.total_hp) || 0;
    if(max <= 0) continue;
    hpSet('b' + s.bunker_id, Math.max(0, max - (Number(s.damage) || 0)), max);
  }
}
function hpDrop(key){ HP.delete(key); }
function drawHpBar(ctx, x, y, w, hp, max, mine, sel){
  const pct = Math.max(0, Math.min(1, hp / max));
  const h = 5;
  const yy = y - 4;
  ctx.fillStyle = 'rgba(10,12,8,.75)';
  ctx.fillRect(x - w/2 - 1, yy - h/2 - 1, w + 2, h + 2);
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.fillRect(x - w/2, yy - h/2, w, h);
  // зелёный → жёлтый → красный по мере потерь
  const col = pct > 0.6 ? '#7FBF6A' : pct > 0.3 ? '#E0C13A' : '#D9503C';
  ctx.fillStyle = col;
  ctx.fillRect(x - w/2, yy - h/2, w * pct, h);
  if(sel){
    ctx.strokeStyle = '#FFD67A'; ctx.lineWidth = 1.5;
    ctx.strokeRect(x - w/2 - 2, yy - h/2 - 2, w + 4, h + 4);
  }
}

// Один холст на все значки. Далеко отъехал — значки не рисуем вовсе:
// на мелком масштабе они всё равно слились бы в кашу, а телефон грелся.
const Sprites = (function(){
  let cv = null, ctx = null, need = false;
  function sizeFor(z){ return z>=18?32 : z===17?28 : z===16?22 : z===15?16 : 0; }
  function attach(){
    cv = document.createElement('canvas'); cv.className = 'ogt-sprites';
    ctx = cv.getContext('2d');
    map.getContainer().appendChild(cv);
    map.on('move zoom moveend zoomend resize viewreset', ask);
    ask();
  }
  function fit(){
    const r = Math.min(window.devicePixelRatio || 1, 2);
    const w = map.getSize().x, h = map.getSize().y;
    if(cv.width !== Math.round(w*r) || cv.height !== Math.round(h*r)){
      cv.width = Math.round(w*r); cv.height = Math.round(h*r);
      cv.style.width = w+'px'; cv.style.height = h+'px';
    }
    ctx.setTransform(r,0,0,r,0,0);
  }
  function draw(){
    need = false;
    if(!cv) return;
    fit();
    const w = map.getSize().x, h = map.getSize().y;
    ctx.clearRect(0,0,w,h);
    const px = sizeFor(map.getZoom());
    // Эффекты рисуем ВСЕГДА, даже когда значки скрыты на мелком
    // масштабе: иначе вспышка боя пропадает при отдалении карты.
    if(!px){ try{ FX.paint(ctx, map, w, h); }catch(e){} return; }
    const pad = px, half = px/2;
    let drawn = 0;
    for(let i=0;i<bunkers.length && drawn<400;i++){
      const b = bunkers[i];
      const p = map.latLngToContainerPoint([b.lat, b.lng]);
      if(p.x < -pad || p.y < -pad || p.x > w+pad || p.y > h+pad) continue;
      if(fogHides(b.lat, b.lng, b.owner, 'b'+b.id)) continue;
      ctx.drawImage(sprite(b.kind||'earth', px, !(addr && b.owner===addr)),
                    p.x-half, p.y-half, px, px);
      const hb = HP.get('b'+b.id);
      if(hb) drawHpBar(ctx, p.x, p.y - half, Math.max(30, px*1.15), hb.hp, hb.max,
                       addr && b.owner===addr,
                       siege && String(siege.target)==='bunker' && siege.bunker_id===b.id);
      drawn++;
    }
    // Пушки мельче бункеров: на карте сразу видно, что главное, а что охрана
    const gp = Math.round(px*0.7), gh = gp/2;
    void gp;
    for(let i=0;i<units.length && drawn<800;i++){
      const u = units[i];
      if(u.alive === false) continue;
      const p = map.latLngToContainerPoint([u.lat, u.lng]);
      if(p.x < -pad || p.y < -pad || p.x > w+pad || p.y > h+pad) continue;
      if(fogHides(u.lat, u.lng, u.owner, 'u'+u.id)) continue;
      ctx.drawImage(sprite(u.code||'gun', gp, !(addr && u.owner===addr)),
                    p.x-gh, p.y-gh, gp, gp);
      const hu = HP.get('u'+u.id);
      if(hu) drawHpBar(ctx, p.x, p.y - gh, Math.max(24, gp*1.2), hu.hp, hu.max,
                       addr && u.owner===addr,
                       siege && String(siege.target)===String(u.id));
      drawn++;
    }
    try{ FX.paint(ctx, map, w, h); }catch(e){}
  }
  function ask(){ if(need) return; need = true; requestAnimationFrame(draw); }
  return { attach, refresh: ask };
})();

let followed = false;
let _watchId = null, _lastCell = null;
function watchMe(){
  if(!navigator.geolocation){ say(T('nogeo'),'warn'); return; }
  if(_watchId !== null) return;
  _watchId = navigator.geolocation.watchPosition(p => {
    const nlat = p.coords.latitude, nlng = p.coords.longitude;
    const nacc = p.coords.accuracy;
    if(typeof p.coords.speed === 'number' && !isNaN(p.coords.speed)) _lastSpeed = p.coords.speed;
    // Перерисовываем, только если сдвинулись заметно или точность
    // изменилась. Раньше карта перерисовывалась на каждую засечку —
    // раз в две секунды, круглые сутки.
    const moved = !here || metersBetween(here[0], here[1], nlat, nlng) > 5;
    const accCh = acc == null || Math.abs(nacc - acc) > 3;
    here = [nlat, nlng]; acc = nacc;
    if(!followed){ map.setView(here, 17); followed = true; _lastCell = cellKey(nlat,nlng); sync(); }
    // Ушёл в соседнюю клетку — подтянуть её бункеры.
    const ck = cellKey(nlat, nlng);
    if(ck !== _lastCell){ _lastCell = ck; sync(); }
    if(moved) _movedAt = Date.now();
    if(moved || accCh){ paintMe(); paintReticle(); Sprites.refresh(); }
  }, err => {
    say(err.code === 1
      ? T('blocked') : T('nosignal'), 'warn');
  }, { enableHighAccuracy:true, maximumAge:5000, timeout:20000 });
}
function stopWatch(){
  if(_watchId !== null){ navigator.geolocation.clearWatch(_watchId); _watchId = null; }
}

// Свернули игру — глушим спутники, опрос и сеть. Это самая большая
// экономия батареи: свёрнутой игра бывает дольше, чем открытой.
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ stopWatch(); stopPoll(); stopSiegeLoop(); stopChat(); }
  else { watchMe(); startPoll(); _lastSync = Date.now(); sync(); if(siege) startSiegeLoop(); }
});

function paintMe(){
  if(!here) return;
  if(!meDot){
    meHalo = L.circle(here, { radius:acc||30, color:'#E0A32E', weight:1, opacity:.35,
                              fillColor:'#E0A32E', fillOpacity:.06 }).addTo(map);

function paintReticle(){
  const r   = document.getElementById('retic');
  const ring= document.getElementById('acc-ring');
  const txt = document.getElementById('acc');
  const btn = document.getElementById('plant');
  const el  = document.getElementById('why');

  // ── прицел и точность: было в старой версии, чуть не потерял
  if(acc == null){
    if(txt) txt.textContent = T('sat');
    if(btn) btn.disabled = true;
    if(el) el.style.display = 'none';
    return;
  }
  const good = acc <= (cfg.max_accuracy_m || 40);
  if(ring) ring.setAttribute('r', Math.max(14, Math.min(52, 14 + (acc-8)*0.4)).toFixed(0));
  if(r) r.classList.toggle('lock', good);
  if(txt) txt.textContent = good
      ? '± '+Math.round(acc)+' м · '+T('locked')
      : '± '+Math.round(acc)+' м · '+T('need')+' '+(cfg.max_accuracy_m||40)+' м';

  // ── что мешает встать здесь: живое число, а не «нельзя»
  const blk = (here && good && !siege) ? whyBlocked(here[0], here[1]) : null;
  if(el){
    if(!good || siege){ el.style.display = 'none'; }
    else if(blk && blk.kind === 'near'){
      el.style.display = 'block'; el.className = 'bad';
      el.textContent = T(blk.mine ? 'why_mine' : 'why_foreign',
                         { d: blk.d, n: blk.need, m: blk.need - blk.d });
    } else if(blk && blk.kind === 'far'){
      el.style.display = 'block'; el.className = 'bad';
      el.textContent = T('why_far', { d: blk.d, n: blk.need, m: blk.d - blk.need });
    } else {
      el.style.display = 'block'; el.className = 'okz';
      el.textContent = T(placeMode === 'gun' ? 'why_ok_gun' : 'why_ok');
    }
  }
  if(btn){
    btn.disabled = !good || !!blk;
    btn.textContent = T(placeMode === 'gun' ? 'gun_btn' : 'plant');
  }
}

// ═══════════ Кто ты ═══════════
// Кошелёк для игры не нужен. Телефон один раз делает себе постоянный
// номер и держит его у себя. Вид номера такой же, как у адреса кошелька
// (0x и 40 знаков) — чтобы потом, когда появятся покупки, тот же столбец
// в базе принял настоящий адрес без переделки схемы.
async function ensureId(){
  let a = null;
  try{ a = await DB.get('kv','addr'); }catch(e){}
  if(!a || !/^0x[0-9a-f]{40}$/.test(a)){
    const r = new Uint8Array(20);
    (window.crypto || self.crypto).getRandomValues(r);
    a = '0x' + Array.from(r).map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');
    try{ await DB.put('kv', a, 'addr'); }catch(e){}
  }
  addr = a;
  const w = document.getElementById('who');
  if(w) w.textContent = a.slice(0,6)+'…'+a.slice(-4);
  return a;
}




// ═══════════ Видимость ═══════════
// Тумана войны в игре больше нет. Карта показывает всё, что пришло

// нарочно: их зовут из десятка мест, и пусть лучше они честно ничего
// не делают, чем каждый вызов оброс проверкой «а есть ли туман».

// ═══════════ Пушки ═══════════
// Пушка охраняет точку: ставится внутри круга своего бункера,
// не ближе 200 м до любой другой. Снимок для неё не нужен — деньги
// в ней не лежат, а место подтверждают те же спутники.
let units = [];
const haveUnitIds = new Set();

function gunsLeftToday(){
  const day = 24*3600*1000, now = Date.now();
  const mine = units.filter(u => u.owner === addr &&
                                 (now - new Date(u.built_at).getTime()) < day);
  return Math.max(0, (cfg.unit_gun_per_day || 10) - mine.length);
}
function myBunkerNear(lat, lng){
  let best = null, bd = 1e9;
  for(const b of bunkers){
    if(b.owner !== addr) continue;
    const d = metersBetween(b.lat, b.lng, lat, lng);
    if(d < bd){ bd = d; best = b; }
  }
  return { b: best, d: bd };
}
function nearestUnit(lat, lng){
  let bd = 1e9;
  for(const u of units){
    const d = metersBetween(u.lat, u.lng, lat, lng);
    if(d < bd) bd = d;
  }
  return bd;
}
// Те же проверки, что в базе. Здесь — чтобы не гонять телефон
// в сеть ради заведомого отказа.
function preCheckGun(){
  if(!here || acc == null) return 'nogps';
  if(acc > (cfg.unit_accuracy_max_m || 40)) return 'weak';
  if(gunsLeftToday() <= 0) return 'daily';
  const n = myBunkerNear(here[0], here[1]);
  if(!n.b || n.d > (cfg.unit_influence_m || 250)) return 'nobunker';
  const onIt = units.filter(u => u.bunker_id === n.b.id).length;
  if(onIt >= (cfg.unit_max_per_bunker || 7)) return 'full';
  const nu = nearestUnit(here[0], here[1]);
  if(nu < (cfg.unit_step_m || 200)) return 'close:'+Math.round(nu);
  return null;
}
function askGun(){
  const bad = preCheckGun();
  if(bad === 'nogps' || bad === 'weak'){ say(T('weak'),'warn'); return; }
  if(bad === 'daily'){ say(T('gun_daily'),'warn'); return; }
  if(bad === 'nobunker'){ say(T('gun_nobunker',{n:cfg.unit_influence_m||250}),'warn'); return; }
  if(bad === 'full'){ say(T('gun_full',{n:cfg.unit_max_per_bunker||7}),'warn'); return; }
  if(bad && bad.startsWith('close:')){
    say(T('gun_close',{d:bad.split(':')[1], n:cfg.unit_step_m||200}),'warn'); return;
  }
  sheetMode = 'gun';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-body').innerHTML = '';
  document.getElementById('sheet-t').textContent = T('gun_place');
  document.getElementById('sheet-p').textContent =
      T('gun_place2', { r: cfg.unit_step_m || 200, n: gunsLeftToday() });
  document.getElementById('sheet-ok').textContent = T('gun_place');
  document.getElementById('veil').classList.add('on');
}
async function doGun(){
  closeSheet();
  if(!navigator.onLine){ say(T('gun_neednet'),'warn'); return; }
  say(T('planting'));
  try{
    const { data, error } = await sb.rpc('place_unit_v1', { p:{
      owner: addr, code:'gun',
      lat: here[0], lng: here[1], accuracy: acc,
      proof: collectProof()
    }});
    if(error) throw error;
    if(!data || !data.ok){
      const e = data && data.error;
      if(e === 'daily_limit')   return say(T('gun_daily'),'warn');
      if(e === 'no_bunker_near')return say(T('gun_nobunker',{n:data.need}),'warn');
      if(e === 'bunker_full')   return say(T('gun_full',{n:data.limit}),'warn');
      if(e === 'too_close')     return say(T('gun_close',{d:data.got, n:data.need}),'warn');
      if(e === 'weak_gps')      return say(T('weaksig',{n:data.got}),'warn');
      if(e === 'fake_location') return say(T('fake'),'warn');
      return say(T('failed'),'warn');
    }
    const u = { id:data.id, owner:addr, bunker_id:data.bunker_id, code:'gun',
                lat:here[0], lng:here[1], hp_left:data.hp, alive:true,
                built_at:new Date().toISOString() };
    haveUnitIds.add(u.id);
    try{ FX.place('gun', u.lat, u.lng); }catch(e){}
    units.push(u);
    await DB.put('units', u);
    Sprites.refresh(); refreshStats(); paintGunBtn(); drawRing();
    say(T('gun_ok') + ' · ' + T('gun_left', { n: data.left_today }), 'good');
  }catch(e){
    const m = (e && (e.message || e.hint || e.details)) ? String(e.message || e.hint || e.details) : '';
    say(m ? (T('failed') + ' · ' + m.slice(0, 90)) : T('gun_neednet'), 'warn');
  }
}
function paintGunBtn(){
  const b = document.getElementById('btn-gun');
  if(!b) return;
  const left = gunsLeftToday();
  b.textContent = T('gun_btn') + ' · ' + left;
  b.disabled = left <= 0;
}



// ═══════════ Где можно ставить ═══════════
// Раньше игрок ездил и угадывал. Теперь запрет видно глазами:
// красным закрашено то, куда нельзя, и написано, скольких метров
// не хватает. Числа берутся из тех же настроек, что и проверка,
// поэтому картинка не может разойтись с правилом.
let zoneLayer = null;
let placeMode = 'bunker';        // bunker | gun

function zoneRules(){
  return placeMode === 'gun'
    ? { block: cfg.min_cannon_distance_m || cfg.unit_step_m || 170,
        need:  cfg.unit_influence_m || 250 }
    : { block: cfg.min_distance_m || 350, need: null };
}

// Что мешает встать здесь и на сколько метров
function whyBlocked(lat, lng){
  const r = zoneRules();
  let best = null;
  const scan = (arr, mine) => {
    for(const o of arr){
      if(o.alive === false) continue;
      const d = metersBetween(o.lat, o.lng, lat, lng);
      if(d < r.block && (!best || d < best.d))
        best = { d: Math.round(d), need: r.block, mine: o.owner === addr, kind: 'near' };
    }
  };
  if(placeMode === 'gun') scan(units); else scan(bunkers);
  if(best) return best;
  if(placeMode === 'gun'){
    let bd = 1e9;
    for(const b of bunkers){
      if(b.owner !== addr || b.alive === false) continue;
      const d = metersBetween(b.lat, b.lng, lat, lng);
      if(d < bd) bd = d;
    }
    if(bd > r.need) return { d: Math.round(bd), need: r.need, kind: 'far' };
  }
  return null;
}

function drawZones(){
  if(zoneLayer){ map.removeLayer(zoneLayer); zoneLayer = null; }
  if(!map) return;
  const r = zoneRules();
  const g = L.layerGroup();
  // красные круги — куда нельзя
  const src = placeMode === 'gun' ? units : bunkers;
  let n = 0;
  for(const o of src){
    if(o.alive === false || n > 120) continue;
    if(fogHides(o.lat, o.lng, o.owner, (placeMode==='gun'?'u':'b')+o.id)) continue;
    L.circle([o.lat, o.lng], { radius: r.block, color:'#B4462F', weight:1,
      opacity:.55, fillColor:'#B4462F', fillOpacity:.13, dashArray:'4 5' }).addTo(g);
    n++;
  }
  // для пушки — зелёные круги вокруг СВОИХ бункеров: только там можно
  if(placeMode === 'gun'){
    for(const b of bunkers){
      if(b.owner !== addr || b.alive === false) continue;
      L.circle([b.lat, b.lng], { radius: r.need, color:'#7FBF6A', weight:2,
        opacity:.8, fillColor:'#7FBF6A', fillOpacity:.07 }).addTo(g);
    }
  }
  g.addTo(map); zoneLayer = g;
}


function setMode(m){
  placeMode = m;
  const mb=document.getElementById('m-bunker'), mg=document.getElementById('m-gun');
  if(mb) mb.className = 'btn-ghost mode' + (m==='bunker' ? ' on' : '');
  if(mg) mg.className = 'btn-ghost mode' + (m==='gun' ? ' on' : '');
  drawZones(); paintReticle(); paintGunBtn();
}

// ═══════════ Замкнутая территория ═══════════
// Кольцо смыкается по перекрытию кругов влияния:
//   бункер даёт 250 м, пушка 100 м. Значит
//   пушка—пушка   до 200 м   (ровно шаг расстановки)
//   пушка—бункер  до 350 м
//   бункер—бункер до 500 м
// Считает телефон: у него уже есть все точки района, сервер не нужен.
let ring = null;              // { pts:[[lat,lng]…], area:м², at:время }
let ringLostAt = 0;           // когда кольцо разорвалось

function linkR(o){ return o.kind ? (cfg.unit_influence_m || 250) : (cfg.unit_link_m || 100); }

// Мои живые точки: бункеры и пушки вперемешку
function myNodes(){
  const out = [];
  for(const b of bunkers) if(b.owner === addr && b.alive !== false)
    out.push({ id:'b'+b.id, lat:b.lat, lng:b.lng, kind:b.kind||'earth' });
  for(const u of units) if(u.owner === addr && u.alive !== false)
    out.push({ id:'u'+u.id, lat:u.lat, lng:u.lng, kind:null });
  return out;
}

// Площадь многоугольника в квадратных метрах
function polyArea(pts){
  if(pts.length < 3) return 0;
  const lat0 = pts[0][0] * Math.PI/180;
  const mx = 111320 * Math.cos(lat0), my = 110540;
  let s = 0;
  for(let i=0;i<pts.length;i++){
    const a = pts[i], b = pts[(i+1)%pts.length];
    s += (a[1]*mx)*(b[0]*my) - (b[1]*mx)*(a[0]*my);
  }
  return Math.abs(s/2);
}
// Сама себя пересекающая фигура кольцом не считается
function selfCrosses(pts){
  const n = pts.length;
  const cross = (o,a,b) => (a[1]-o[1])*(b[0]-o[0]) - (a[0]-o[0])*(b[1]-o[1]);
  const hit = (p1,p2,p3,p4) => {
    const d1=cross(p3,p4,p1), d2=cross(p3,p4,p2), d3=cross(p1,p2,p3), d4=cross(p1,p2,p4);
    return ((d1>0)!==(d2>0)) && ((d3>0)!==(d4>0));
  };
  for(let i=0;i<n;i++)
    for(let j=i+2;j<n;j++){
      if(i===0 && j===n-1) continue;
      if(hit(pts[i], pts[(i+1)%n], pts[j], pts[(j+1)%n])) return true;
    }
  return false;
}

// Находим кольцо. Сначала отсекаем «хвосты» — точки, у которых меньше
// двух соседей: они не могут быть частью замкнутой линии. Что осталось,
// то и есть кольцо.
function findRing(){
  const nodes = myNodes();
  if(nodes.length < 3) return null;
  // Дальше идёт перебор связей — при сотне своих точек это уже заметно
  // на слабом телефоне. Кольцо из сотни звеньев никто не строит,
  // поэтому просто не считаем такие.
  if(nodes.length > 60) return ring;
  const link = [];
  for(let i=0;i<nodes.length;i++){
    link[i] = [];
    for(let j=0;j<nodes.length;j++){
      if(i===j) continue;
      const d = metersBetween(nodes[i].lat, nodes[i].lng, nodes[j].lat, nodes[j].lng);
      if(d <= linkR(nodes[i]) + linkR(nodes[j])) link[i].push(j);
    }
  }
  // отсекаем хвосты, пока отсекается
  const alive = nodes.map(() => true);
  let cut = true;
  while(cut){
    cut = false;
    for(let i=0;i<nodes.length;i++){
      if(!alive[i]) continue;
      if(link[i].filter(j => alive[j]).length < 2){ alive[i] = false; cut = true; }
    }
  }
  const core = [];
  for(let i=0;i<nodes.length;i++) if(alive[i]) core.push(i);
  if(core.length < 3) return null;
  const bunks = core.filter(i => nodes[i].kind).length;
  if(bunks < 2) return null;                    // минимум два бункера

  // обходим кольцо: из каждой точки идём в ещё не пройденного соседа
  const order = [core[0]];
  const used = new Set([core[0]]);
  let cur = core[0], guard = 0;
  while(guard++ < 500){
    const next = link[cur].filter(j => alive[j] && !used.has(j));
    if(!next.length) break;
    // держимся ближайшего — так линия не петляет
    next.sort((a,b) =>
      metersBetween(nodes[cur].lat,nodes[cur].lng,nodes[a].lat,nodes[a].lng) -
      metersBetween(nodes[cur].lat,nodes[cur].lng,nodes[b].lat,nodes[b].lng));
    cur = next[0]; used.add(cur); order.push(cur);
  }
  if(order.length < 3) return null;
  // линия должна вернуться к началу
  const first = nodes[order[0]], last = nodes[order[order.length-1]];
  const back = metersBetween(first.lat, first.lng, last.lat, last.lng);
  if(back > linkR(first) + linkR(last)) return null;

  const pts = order.map(i => [nodes[i].lat, nodes[i].lng]);
  if(selfCrosses(pts)) return null;
  return { pts: pts, area: polyArea(pts), nodes: order.length, bunkers: bunks };
}

let ringLayer = null;
function drawRing(){
  const found = findRing();
  if(found) { ring = found; ringLostAt = 0; }
  else if(ring && !ringLostAt) { ringLostAt = Date.now(); }

  const grace = (cfg.ring_grace_min || 20) * 60000;
  const broken = ringLostAt && (Date.now() - ringLostAt) < grace;
  if(!found && !broken) ring = null;

  if(ringLayer){ map.removeLayer(ringLayer); ringLayer = null; }
  if(!ring) { paintRingBadge(); return; }
  ringLayer = L.polygon(ring.pts, {
    color: broken ? '#B23A2E' : '#C9A227',
    weight: broken ? 2 : 3,
    dashArray: broken ? '6 6' : null,
    fillColor: '#C9A227',
    fillOpacity: broken ? 0.06 : 0.16
  }).addTo(map);
  paintRingBadge(broken);
}
function paintRingBadge(broken){
  const el = document.getElementById('ring-badge');
  if(!el) return;
  if(!ring){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  const ha = (ring.area/10000).toFixed(ring.area < 100000 ? 2 : 1);
  if(broken){
    const left = Math.max(0, Math.ceil(((cfg.ring_grace_min||20)*60000 - (Date.now()-ringLostAt))/60000));
    el.className = 'broken';
    el.textContent = T('ring_broken', { n: left });
  } else {
    el.className = '';
    el.textContent = T('ring_ok', { n: ha, k: ring.nodes });
  }
}



// ═══════════ Уведомления ═══════════
// Чтобы хозяин узнал о нападении с закрытой игрой.
// Android: работает из обычного браузера.
// iPhone: только если значок вынесен на экран — иначе система
// уведомления сайту не даст вообще.
const VAPID_PUB = 'BChuzqwCk3YSUlgEzGM9mccWw3QMAAUchakW58di03TqsfwIx1YseGauUmw9PxFObO1HttqgX3pVLXmHQM1NIYY';

function b64ToBytes(s){
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g,'+').replace(/_/g,'/'));
  const out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}
function pushState(){
  if(!('Notification' in window) || !('serviceWorker' in navigator)) return 'no';
  return Notification.permission;                 // default | granted | denied
}
async function pushOn(){
  if(pushState() === 'no'){ say(T('nt_no'),'warn'); return false; }
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ say(T('nt_denied'),'warn'); return false; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: b64ToBytes(VAPID_PUB)
      });
    }
    const j = sub.toJSON();
    await sb.rpc('push_save_v1', { p:{
      wallet: addr, endpoint: sub.endpoint,
      p256dh: j.keys.p256dh, auth: j.keys.auth, lang: lang,
      quiet_from: 0, quiet_to: 7
    }});
    await DB.put('kv', true, 'push');
    say(T('nt_ok'),'good');
    return true;
  }catch(e){ say(T('nt_fail'),'warn'); return false; }
}
async function pushOff(){
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await sb.rpc('push_drop_v1', { p:{ endpoint: sub.endpoint } });
      await sub.unsubscribe();
    }
  }catch(e){}
  await DB.put('kv', false, 'push');
  say(T('nt_off'));
}
async function pushToggle(){
  const on = await DB.get('kv','push');
  if(on) await pushOff(); else await pushOn();
  openProfile();
}

// ═══════════ Эффекты боя ═══════════
// Рисуются на том же холсте, что и значки. Никаких библиотек:
// браузер умеет это сам, а лишний вес грел бы телефон.
// Работают ТОЛЬКО во время осады и глохнут, когда игра свёрнута.
const FX = (function(){
  let items = [];            // живые эффекты
  let raf = null;
  let shake = 0;             // дрожание экрана, пикселей

  function add(o){ o.t0 = performance.now(); items.push(o); run(); }

  // Прицеливание: круг, который сжимается к моменту удара
  function aim(lat, lng, r, ms){ add({ kind:'aim', lat, lng, r, ms }); }
  // Удар: вспышка и расходящаяся волна
  function blast(lat, lng, r, hit){
    add({ kind:'blast', lat, lng, r, ms:700, hit });
    if(hit){
      shake = 9;
      try{ if(navigator.vibrate) navigator.vibrate([40, 60, 90]); }catch(e){}
    }
  }
  // Пушка пала: разлёт осколков
  function burst(lat, lng){
    const bits = [];
    for(let i=0;i<20;i++){
      const a = Math.random()*Math.PI*2, v = 34 + Math.random()*72;
      bits.push({ dx:Math.cos(a)*v, dy:Math.sin(a)*v, s:2.4+Math.random()*3.4 });
    }
    add({ kind:'burst', lat, lng, ms:900, bits });
    try{ if(navigator.vibrate) navigator.vibrate(70); }catch(e){}
  }
  // Цифра урона, уплывающая вверх
  function num(lat, lng, text, color){ add({ kind:'num', lat, lng, ms:1100, text, color }); }

  // Ракета летит от точки к точке, оставляя след
  function rocket(fromLat, fromLng, toLat, toLng, ms){
    add({ kind:'rocket', lat:fromLat, lng:fromLng, toLat, toLng, ms: ms || 6000, trail:[] });
  }
  // Снаряд летит от пушки к цели — короткая быстрая трасса
  function tracer(fromLat, fromLng, toLat, toLng, ms, colour){
    add({ kind:'tracer', lat:fromLat, lng:fromLng, toLat, toLng,
          ms: ms || 900, col: colour || '#FFC46A' });
  }
  // Боевой заход дрона: летит от пускающего к цели, сбрасывает бомбу,
  // бомба падает с высоты и рвётся. Один эффект на весь полёт —
  // так его видно целиком, а не рывками.
  function drone(fromLat, fromLng, toLat, toLng, ms){
    add({ kind:'droneRun', lat:fromLat, lng:fromLng, toLat, toLng,
          ms: ms || 3500, trail:[] });
    try{ if(navigator.vibrate) navigator.vibrate(20); }catch(e){}
  }
  // Залп: все живые пушки точки бьют по одному месту вразнобой,
  // иначе шесть одинаковых трасс выглядят как одна толстая.
  function volley(guns, toLat, toLng){
    if(!Array.isArray(guns) || !guns.length) return;
    guns.slice(0, 8).forEach((g, i) => {
      if(g.lat == null || g.lng == null) return;
      setTimeout(() => {
        tracer(g.lat, g.lng, toLat, toLng, 620, '#FFC46A');
        setTimeout(() => {
          add({ kind:'spark', lat:toLat, lng:toLng, ms:420 });
        }, 620);
      }, i * 130 + Math.random() * 90);
    });
    try{ if(navigator.vibrate) navigator.vibrate([15, 40, 15]); }catch(e){}
  }
  // Подрыв заряда: то же, что удар, но крупнее и с осколками
  function charge(lat, lng, r){
    blast(lat, lng, r || 26, false);
    burst(lat, lng);
    setTimeout(() => blast(lat, lng, (r || 26) * 1.5, false), 160);
    try{ if(navigator.vibrate) navigator.vibrate([60, 50, 120]); }catch(e){}
  }
  // Бункер укреплён: расходящееся золотое кольцо и искры
  function upgrade(lat, lng){
    add({ kind:'upgrade', lat, lng, ms:1400 });
    try{ if(navigator.vibrate) navigator.vibrate([25,40,25]); }catch(e){}
  }

  // ── Бункер пал: обвал. Самое крупное событие в игре, поэтому и
  //    показываем его крупно: столб пыли, каменные обломки, тряска.
  function collapse(lat, lng, mine){
    const bits = [];
    for(let i=0;i<26;i++){
      const a = Math.random()*Math.PI*2, v = 30 + Math.random()*90;
      bits.push({ dx:Math.cos(a)*v, dy:Math.sin(a)*v - 20 - Math.random()*40,
                  s:3 + Math.random()*6, rot:Math.random()*6.3,
                  spin:(Math.random()-0.5)*0.5 });
    }
    const dust = [];
    for(let i=0;i<16;i++){
      const a = Math.random()*Math.PI*2;
      dust.push({ dx:Math.cos(a)*(10+Math.random()*70), dy:Math.sin(a)*(8+Math.random()*40),
                  r:14 + Math.random()*26, t0:Math.random()*0.3 });
    }
    add({ kind:'collapse', lat, lng, ms:2200, bits, dust, mine });
    shake = 16;
    try{ if(navigator.vibrate) navigator.vibrate(mine ? [120,70,120,70,200] : [90,50,140]); }catch(e){}
  }

  // Территория перешла: волна по кругу влияния
  function claim(lat, lng, r){ add({ kind:'claim', lat, lng, r: r||250, ms:1600 }); }

  // Дым над повреждённой точкой: тихо тлеет, пока идёт осада
  function smoke(lat, lng){ add({ kind:'smoke', lat, lng, ms:2600, seed:Math.random()*10 }); }

  // Каждая вещь при установке даёт свой знак
  function place(kind, lat, lng){
    add({ kind:'place', lat, lng, ms:1100, what:kind });
    try{ if(navigator.vibrate) navigator.vibrate(30); }catch(e){}
  }

  function run(){
    if(raf) return;
    const step = () => {
      raf = null;
      if(shake > 0) shake = Math.max(0, shake - 0.6);
      Sprites.refresh();
      if(items.length || shake > 0) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  // Рисование: зовётся из Sprites на каждом кадре
  function paint(ctx, map, w, h){
    const now = performance.now();
    items = items.filter(o => now - o.t0 < o.ms);
    if(shake > 0){
      ctx.save();
      ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
    }
    for(const o of items){
      const k = (now - o.t0) / o.ms;                 // от 0 до 1
      const p = map.latLngToContainerPoint([o.lat, o.lng]);
      if(p.x < -80 || p.y < -80 || p.x > w+80 || p.y > h+80) continue;
      const mPerPx = metersPerPixel();
      if(o.kind === 'aim'){
        const base = Math.max(30, o.r / mPerPx);
        const rr = base * (1 - k*0.45);
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(8, rr), 0, 7);
        ctx.strokeStyle = 'rgba(178,58,46,' + (0.5 + 0.5*Math.sin(now/90)) + ')';
        ctx.lineWidth = 2.5; ctx.setLineDash([6,5]); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(178,58,46,.13)'; ctx.fill();
        // сжимающаяся дуга — сколько осталось до удара
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(8, rr) + 7, -Math.PI/2, -Math.PI/2 + (1-k)*Math.PI*2);
        ctx.strokeStyle = '#FFD67A'; ctx.lineWidth = 3; ctx.stroke();
      }
      if(o.kind === 'blast'){
        const base = Math.max(34, o.r / mPerPx);
        // две волны подряд — так удар читается даже краем глаза
        for(const [d, wmul] of [[0, 1], [0.18, 0.62]]){
          const kk = Math.max(0, Math.min(1, (k - d) / (1 - d)));
          if(kk <= 0) continue;
          ctx.beginPath(); ctx.arc(p.x, p.y, base * (0.35 + kk*2.1) * wmul + 4, 0, 7);
          ctx.strokeStyle = 'rgba(226,122,95,' + (1-kk)*0.9 + ')';
          ctx.lineWidth = 6*(1-kk) + 1; ctx.stroke();
        }
        if(k < 0.35){
          const f = 1 - k/0.35;
          const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, base*1.1*f + 10);
          gr.addColorStop(0, 'rgba(255,246,214,' + (0.95*f) + ')');
          gr.addColorStop(0.5, 'rgba(255,196,90,' + (0.6*f) + ')');
          gr.addColorStop(1, 'rgba(178,58,46,0)');
          ctx.beginPath(); ctx.arc(p.x, p.y, base*1.1*f + 10, 0, 7);
          ctx.fillStyle = gr; ctx.fill();
        }
      }
      if(o.kind === 'burst'){
        for(const b of o.bits){
          const x = p.x + b.dx*k, y = p.y + b.dy*k + 30*k*k;
          ctx.beginPath(); ctx.arc(x, y, b.s*(1-k*0.7), 0, 7);
          ctx.fillStyle = 'rgba(255,190,110,' + (1-k) + ')'; ctx.fill();
        }
        if(k < 0.3){
          const f = 1 - k/0.3;
          const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 46*f + 6);
          gr.addColorStop(0, 'rgba(255,248,222,' + f + ')');
          gr.addColorStop(1, 'rgba(255,150,60,0)');
          ctx.beginPath(); ctx.arc(p.x, p.y, 46*f + 6, 0, 7);
          ctx.fillStyle = gr; ctx.fill();
        }
      }
      if(o.kind === 'tracer'){
        const q = map.latLngToContainerPoint([o.toLat, o.toLng]);
        const head = Math.min(1, k*1.15);
        const tail = Math.max(0, head - 0.22);
        const x1 = p.x + (q.x-p.x)*tail, y1 = p.y + (q.y-p.y)*tail;
        const x2 = p.x + (q.x-p.x)*head, y2 = p.y + (q.y-p.y)*head;
        const g2 = ctx.createLinearGradient(x1,y1,x2,y2);
        g2.addColorStop(0, 'rgba(255,196,106,0)');
        g2.addColorStop(1, o.col);
        ctx.strokeStyle = g2; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        ctx.beginPath(); ctx.arc(x2, y2, 3.5, 0, 7);
        ctx.fillStyle = '#FFF3D0'; ctx.fill();
        // вспышка у ствола в начале
        if(k < 0.14){
          const f = 1 - k/0.14;
          ctx.beginPath(); ctx.arc(p.x, p.y, 9*f + 3, 0, 7);
          ctx.fillStyle = 'rgba(255,214,122,' + (0.9*f) + ')'; ctx.fill();
        }
      }
      if(o.kind === 'rocket'){
        const q = map.latLngToContainerPoint([o.toLat, o.toLng]);
        const ease = k*k*0.55 + k*0.45;                 // разгон и подлёт
        const x = p.x + (q.x - p.x)*ease;
        const y = p.y + (q.y - p.y)*ease - Math.sin(Math.PI*ease)*46;   // дуга
        o.trail.push([x,y]); if(o.trail.length > 26) o.trail.shift();
        // след
        for(let i=0;i<o.trail.length;i++){
          const t = i/o.trail.length;
          ctx.beginPath(); ctx.arc(o.trail[i][0], o.trail[i][1], 1.5 + t*3.5, 0, 7);
          ctx.fillStyle = 'rgba(226,150,95,' + (t*0.55) + ')'; ctx.fill();
        }
        if(k < 0.98){
          const ang = Math.atan2(q.y-p.y, q.x-p.x);
          ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
          ctx.fillStyle = '#FFD67A';
          ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-6,4); ctx.lineTo(-6,-4); ctx.closePath(); ctx.fill();
          ctx.fillStyle = 'rgba(255,150,60,.9)';
          ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-15-Math.random()*8,0);
          ctx.lineTo(-6,3); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }
      if(o.kind === 'droneRun'){
        const q = map.latLngToContainerPoint([o.toLat, o.toLng]);
        // 0 → .74 полёт, .74 → .93 падение бомбы, дальше огонь
        const fly  = Math.min(1, k / 0.74);
        const ease = fly < 0.5 ? 2*fly*fly : 1 - Math.pow(-2*fly + 2, 2) / 2;
        const x = p.x + (q.x - p.x) * ease;
        const lift = Math.sin(Math.PI * ease) * 34;      // набрал высоту и снизился
        const y = p.y + (q.y - p.y) * ease - lift;

        // след из выхлопа
        if(fly < 1){
          o.trail.push([x, y]);
          if(o.trail.length > 22) o.trail.shift();
        }
        for(let i = 0; i < o.trail.length; i++){
          const t = i / o.trail.length;
          ctx.beginPath(); ctx.arc(o.trail[i][0], o.trail[i][1], 1 + t*2.4, 0, 7);
          ctx.fillStyle = 'rgba(201,162,39,' + (t*0.35) + ')'; ctx.fill();
        }

        // тень на земле — от неё читается высота
        if(fly < 1){
          ctx.beginPath();
          ctx.ellipse(x, y + lift, 7, 3, 0, 0, 7);
          ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fill();
        }

        if(fly < 1){
          const ang = Math.atan2(q.y - p.y, q.x - p.x);
          ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
          // корпус
          ctx.fillStyle = '#2C4327';
          ctx.beginPath(); ctx.ellipse(0, 0, 7, 4, 0, 0, 7); ctx.fill();
          ctx.strokeStyle = '#C9A227'; ctx.lineWidth = 1.4; ctx.stroke();
          // лучи и винты: винт рисуется отрезком, который крутится,
          // поэтому на глаз он сливается в диск
          const spin = now / 14;
          for(const [ox, oy] of [[-7,-6],[7,-6],[-7,6],[7,6]]){
            ctx.strokeStyle = 'rgba(201,162,39,.9)'; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ox, oy); ctx.stroke();
            ctx.save(); ctx.translate(ox, oy); ctx.rotate(spin);
            ctx.strokeStyle = 'rgba(232,227,213,.75)'; ctx.lineWidth = 1.1;
            ctx.beginPath(); ctx.moveTo(-4.5, 0); ctx.lineTo(4.5, 0); ctx.stroke();
            ctx.globalAlpha = .35;
            ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, 7); ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.restore();
          }
          ctx.restore();
        }

        // бомба: отделяется над целью и падает с ускорением
        if(k >= 0.74 && k < 0.94){
          const f  = (k - 0.74) / 0.20;
          const bx = q.x;
          const by = q.y - 34 * (1 - f*f);
          ctx.save(); ctx.translate(bx, by);
          ctx.fillStyle = '#E8E3D5';
          ctx.beginPath(); ctx.ellipse(0, 0, 2.6, 5.2, 0, 0, 7); ctx.fill();
          ctx.fillStyle = '#B23A2E';
          ctx.beginPath(); ctx.moveTo(-2.6,-4); ctx.lineTo(2.6,-4);
          ctx.lineTo(0,-7.5); ctx.closePath(); ctx.fill();
          ctx.restore();
          // круг под падающей бомбой: видно, куда именно прилетит
          ctx.beginPath(); ctx.arc(q.x, q.y, 10 + 14*(1-f), 0, 7);
          ctx.strokeStyle = 'rgba(178,58,46,' + (0.35 + 0.5*f) + ')';
          ctx.lineWidth = 2; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
        }
      }
      if(o.kind === 'spark'){
        // попадание пули: короткая яркая искра
        const f = 1 - k;
        ctx.beginPath(); ctx.arc(p.x, p.y, 4 + 7*k, 0, 7);
        ctx.strokeStyle = 'rgba(255,214,122,' + f + ')';
        ctx.lineWidth = 2*f + 0.6; ctx.stroke();
        ctx.beginPath(); ctx.arc(p.x, p.y, 2.2*f + 0.8, 0, 7);
        ctx.fillStyle = 'rgba(255,248,222,' + f + ')'; ctx.fill();
      }
      if(o.kind === 'place'){
        // у каждой вещи свой знак: бункер — квадрат, пушка — луч,
        // радар — дуги, дрон — винты, раскраска — цветное кольцо
        const c1 = o.what === 'radar' ? '#7FBF6A'
                 : o.what === 'skin'  ? '#9FD3E8'
                 : o.what === 'bunker'? '#C9A227' : '#E0A32E';
        ctx.strokeStyle = c1; ctx.lineWidth = 3*(1-k) + 1;
        if(o.what === 'bunker'){
          const sz = 16 + k*30;
          ctx.globalAlpha = 1-k;
          ctx.strokeRect(p.x-sz/2, p.y-sz/2, sz, sz);
          ctx.globalAlpha = 1;
        } else if(o.what === 'radar'){
          for(let i=1;i<=3;i++){
            ctx.beginPath();
            ctx.arc(p.x, p.y, (10+i*11)*(0.5+k), -Math.PI*0.8, -Math.PI*0.2);
            ctx.globalAlpha = (1-k)*0.9; ctx.stroke(); ctx.globalAlpha = 1;
          }
        } else if(o.what === 'skin'){
          const cols = ['#C9A227','#1E7A4A','#B23A2E','#9FD3E8','#BFE0A8'];
          for(let i=0;i<cols.length;i++){
            const a = i*2*Math.PI/cols.length + k*3;
            ctx.beginPath();
            ctx.arc(p.x + Math.cos(a)*(14+k*26), p.y + Math.sin(a)*(14+k*26), 4*(1-k)+1, 0, 7);
            ctx.fillStyle = cols[i]; ctx.globalAlpha = 1-k; ctx.fill(); ctx.globalAlpha = 1;
          }
        } else {
          for(let i=0;i<6;i++){
            const a = i*Math.PI/3;
            ctx.beginPath();
            ctx.moveTo(p.x + Math.cos(a)*(8+k*18), p.y + Math.sin(a)*(8+k*18));
            ctx.lineTo(p.x + Math.cos(a)*(16+k*34), p.y + Math.sin(a)*(16+k*34));
            ctx.globalAlpha = 1-k; ctx.stroke(); ctx.globalAlpha = 1;
          }
        }
        ctx.beginPath(); ctx.arc(p.x, p.y, 8 + k*40, 0, 7);
        ctx.strokeStyle = c1; ctx.globalAlpha = (1-k)*0.8;
        ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
      }
      if(o.kind === 'num'){
        ctx.font = '700 20px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.globalAlpha = 1 - k;
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(18,20,15,.85)';
        ctx.strokeText(o.text, p.x, p.y - 14 - 46*k);
        ctx.fillStyle = o.color || '#E27A5F';
        ctx.fillText(o.text, p.x, p.y - 14 - 46*k);
        ctx.globalAlpha = 1;
      }
    }
    if(shake > 0) ctx.restore();
  }
  function stop(){ items = []; shake = 0; }
  return { aim, blast, burst, num, rocket, drone, upgrade, tracer, volley, charge,
           collapse, claim, smoke, place, paint, stop,
           get busy(){ return items.length > 0; } };
})();

// Сколько метров в одной точке экрана — нужно, чтобы круги эффектов
// совпадали с настоящими метрами на карте
function metersPerPixel(){
  if(!map || !here) return 1;
  const c = map.latLngToContainerPoint([here[0], here[1]]);
  const d = map.latLngToContainerPoint([here[0] + 0.001, here[1]]);
  const px = Math.max(1, Math.abs(c.y - d.y));
  return 111.0 / px;                                  // 0.001° ≈ 111 м
}




// ═══════════ Рюкзак: применение купленного ═══════════
// До этого купленное просто лежало: в игре не было ни одной кнопки
// применения. Теперь у каждой вещи свой способ пустить её в дело,
// а решает всё сервер — телефон только рисует и подсказывает.
//
//   own   — подойти к СВОЕЙ точке ближе 100 м (укрепления, радар, окраска)
//   place — поставить на своём месте прямо сейчас (тяжёлая и ракетная пушка)
//   siege — работает только в бою, по текущей цели (заряды)
//   aim   — ткнуть в цель на карте (дрон, дальняя ракета)
const ITEM_USE = {
  reinforce:'own', steel:'own', fort:'own', radar:'own', skin:'own',
  heavy:'place', rocket:'place',
  charge:'siege', hcharge:'siege',
  longrocket:'aim', drone:'aim'
};

let aimMode = null;          // код вещи, которой целимся
let _aimTimer = null;
let _useBusy = false;

function bagCount(code){ return Number(bag[code] || 0); }
function bagTotal(){
  let n = 0;
  for(const it of SHOP_LIST) n += bagCount(it.code);
  return n;
}
function droneCharges(){ return bagCount('drone'); }

// ── Кнопка рюкзака и его список ──────────────────────────────────
function paintBagBtn(){
  const b = document.getElementById('bag-btn');
  if(!b) return;
  const n = bagTotal();
  b.style.display = n > 0 ? 'flex' : 'none';
  b.innerHTML = '\u2726<i>' + n + '</i>';
}
function openBag(){
  const n = bagTotal();
  sheetMode = 'info';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-p').textContent = '';
  document.getElementById('sheet-ok').textContent = T('closebtn');
  document.getElementById('sheet-t').textContent = T('bg_title');
  const box = document.getElementById('sheet-body');
  if(!n){
    box.innerHTML = '<div class="mv-warn">' + esc(T('bg_empty')) + '</div>'
      + '<button class="btn-buy" style="width:100%;margin-top:10px;padding:12px" '
      + 'onclick="openShop()">' + esc(T('sh_title')) + '</button>';
  } else {
    let html = '<div class="mv-warn">' + esc(T('bg_how')) + '</div>';
    for(const it of SHOP_LIST){
      const have = bagCount(it.code);
      if(have <= 0) continue;
      const mode = ITEM_USE[it.code] || 'own';
      html += '<div class="card">'
        + '<img loading="lazy" src="item-' + it.code + '.webp" alt="" '
        +      'onclick="itemHelp(\'' + it.code + '\')"/>'
        + '<div class="card-b">'
        +   '<div class="card-t">' + esc(T('it_' + it.code)) + ' <i>\u00d7 ' + have + '</i></div>'
        +   '<div class="card-d">' + esc(T('bgw_' + mode)) + '</div>'
        +   '<div class="card-r">'
        +     '<span class="row" style="gap:6px">'
        +       '<button class="btn-help" onclick="itemHelp(\'' + it.code + '\')">?</button>'
        +       '<button class="btn-buy" onclick="useItem(\'' + it.code + '\')">'
        +         esc(T('bg_use')) + '</button>'
        +     '</span>'
        +   '</div>'
        + '</div></div>';
    }
    box.innerHTML = html;
  }
  document.getElementById('veil').classList.add('on');
}

// ── Один вход на всё: разводит вещь по способу применения ────────
function useItem(code){
  const mode = ITEM_USE[code] || 'own';
  if(bagCount(code) <= 0){ say(T('bg_none'), 'warn'); return; }
  if(mode === 'aim'){ aimStart(code); return; }
  if(mode === 'siege'){
    if(!siege || siege.side === 'defend'){ say(T('bg_needsiege'), 'warn'); return; }
    closeSheet(); applyItem(code, {}); return;
  }
  if(!here){ say(T('dr_nogps'), 'warn'); return; }
  closeSheet();
  applyItem(code, {});
}

// ── Прицел ───────────────────────────────────────────────────────
function aimStart(code){
  if(!here){ say(T('dr_nogps'), 'warn'); return; }
  closeSheet();
  aimMode = code;
  paintAim();
  say(code === 'drone' ? T('dr_aim') : T('lr_aim'));
  clearTimeout(_aimTimer);
  // Прицел гаснет сам: иначе человек уходит из игры с включённым
  // режимом и потом случайным тычком тратит вещь.
  _aimTimer = setTimeout(() => { if(aimMode) aimCancel(); }, 45000);
}
function aimCancel(){
  aimMode = null; clearTimeout(_aimTimer); _aimTimer = null;
  paintAim(); say(T('dr_cancel'));
}
function paintAim(){
  let el = document.getElementById('aim-bar');
  if(!el){
    el = document.createElement('div');
    el.id = 'aim-bar';
    document.body.appendChild(el);
    el.onclick = aimCancel;
  }
  if(aimMode){
    el.style.display = 'block';
    el.textContent = (aimMode === 'drone' ? T('dr_aim') : T('lr_aim')) + ' \u00b7 ' + T('dr_cancel');
  } else {
    el.style.display = 'none';
  }
}
// Ткнули в цель, пока висел прицел
function aimFire(t, kind){
  const code = aimMode;
  if(!code) return;
  if(t.owner === addr){ say(T('dr_own'), 'warn'); return; }
  if(code === 'longrocket' && kind !== 'unit'){ say(T('lr_gunonly'), 'warn'); return; }
  aimMode = null; clearTimeout(_aimTimer); paintAim();
  applyItem(code, { kind: (kind === 'unit' ? 'unit' : 'bunker'), target_id: t.id,
                    _lat: t.lat, _lng: t.lng });
}

// ── Собственно применение. Все проверки — на сервере ─────────────
async function applyItem(code, extra){
  if(_useBusy){ say(T('bg_busy'), 'warn'); return; }
  _useBusy = true;
  try{
    const body = Object.assign({
      wallet: addr, code: code,
      lat: here ? here[0] : null, lng: here ? here[1] : null,
      accuracy: acc, siege_id: siege ? siege.id : null,
      target: siegeTarget || null
    }, extra);
    delete body._lat; delete body._lng;
    const { data } = await sb.rpc('use_item_v1', { p: body });
    if(!data || !data.ok){ sayUseError(data && data.error, data); return; }
    await showItemResult(code, data, extra);
  }catch(e){
    say(T('gun_neednet'), 'warn');
  }finally{
    _useBusy = false;
  }
}

function sayUseError(e, d){
  d = d || {};
  const m = {
    no_item:        () => T('bg_none'),

// ── Что человек видит, когда вещь сработала ──────────────────────
async function showItemResult(code, data, extra){
  extra = extra || {};
  const tLat = extra._lat, tLng = extra._lng;
  bag[code] = Math.max(0, bagCount(code) - 1);
  if(data.charges_left != null) bag[code] = data.charges_left;
  try{ await DB.put('kv', bag, 'bag'); }catch(e){}
  paintBagBtn();

  // ── Дрон: заход, сброс, разрыв
  if(code === 'drone'){
    const fx  = (data.from_lat != null) ? [data.from_lat, data.from_lng] : here;
    const fly = 3500;
    say(T('dr_flying'));
    try{ FX.drone(fx[0], fx[1], tLat, tLng, fly); }catch(e){}
    setTimeout(() => finishHit(code, data, tLat, tLng, extra), fly * 0.94);
    return;
  }
  // ── Дальняя ракета: летит долго и видна всем
  if(code === 'longrocket'){
    const fly = (cfg.siege_warn_sec || 15) * 4 * 1000;
    say(T('lr_flying', { n: Math.round(fly / 1000) }));
    try{ FX.rocket(here[0], here[1], tLat, tLng, fly); }catch(e){}
    setTimeout(() => finishHit(code, data, tLat, tLng, extra), fly);
    return;
  }
  // ── Заряды в осаде: рвутся сразу по текущей цели
  if(code === 'charge' || code === 'hcharge'){
    const lat = data.target_lat != null ? data.target_lat : (here ? here[0] : null);
    const lng = data.target_lng != null ? data.target_lng : (here ? here[1] : null);
    if(lat != null){
      try{ FX.charge(lat, lng, code === 'hcharge' ? 34 : 24); }catch(e){}
    }
    finishHit(code, data, lat, lng, extra);
    return;
  }
  // ── Укрепления, радар, окраска, платные пушки
  const lat = data.lat != null ? data.lat : (here ? here[0] : null);
  const lng = data.lng != null ? data.lng : (here ? here[1] : null);
  if(lat != null){
    try{
      if(code === 'radar')      FX.place('radar', lat, lng);
      else if(code === 'skin')  FX.place('skin', lat, lng);
      else if(code === 'heavy' || code === 'rocket'){
        FX.place('gun', lat, lng);
        // новая пушка сразу даёт залп — видно, что она живая
        setTimeout(() => { try{ FX.volley([{ lat, lng }], lat, lng); }catch(e){} }, 400);
      }
      else { FX.upgrade(lat, lng); FX.place('bunker', lat, lng); }
    }catch(e){}
  }
  // карта могла измениться: новая пушка, новый вид бункера
  if(data.unit_id){
    const u = { id:data.unit_id, owner:addr, bunker_id:data.bunker_id, code:code,
                lat:lat, lng:lng, hp_left:data.hp, alive:true,
                built_at:new Date().toISOString() };
    haveUnitIds.add(u.id); units.push(u);
    try{ await DB.put('units', u); }catch(e){}
  }
  if(data.kind && data.bunker_id){
    const b = bunkerById(data.bunker_id);
    if(b){ b.kind = data.kind; try{ await DB.put('bunkers', b); }catch(e){} }
  }
  Sprites.refresh(); drawRing(); refreshStats();
  say(T('bg_done', { n: T('it_' + code) }), 'good');
}

// Общий хвост для всего, что наносит урон
function finishHit(code, data, lat, lng, extra){
  try{
    if(lat != null){
      FX.blast(lat, lng, cfg.siege_blast_m || 20, false);
      if(data.damage) FX.num(lat, lng, '\u2212' + data.damage, '#FFD67A');
    }
    if(data.killed && extra.kind === 'unit'){
      const u = units.find(x => x.id === extra.target_id);
      if(u){ u.alive = false; FX.burst(u.lat, u.lng); }
    }
  }catch(e){}
  say(data.killed ? T('dr_kill', { k: data.charges_left != null ? data.charges_left : bagCount(code) })
                  : T('dr_hit', { n: data.damage,
                                  k: data.charges_left != null ? data.charges_left : bagCount(code) }),
      'good');
  sync(); Sprites.refresh();
}

async function loadMoney(){

// Дальняя ракета: летит с моего места в цель. Пока лавка не умеет

function fireLongRocket(targetLat, targetLng){

function itemFx(code, lat, lng){
  try{
    if(code === 'reinforce' || code === 'steel' || code === 'fort'){
      FX.upgrade(lat, lng); FX.place('bunker', lat, lng);
    } else if(code === 'radar'){
      FX.place('radar', lat, lng);
