<style>
:root{
  --field:#12140F; --field-2:#1B1E16; --line:#2E332A;
  --sand:#E8E2D0; --sand-dim:#9AA08C;
  --amber:#E0A32E; --rust:#B4462F; --ok:#7FA65C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--field);
  color:var(--sand);font-family:'Space Mono',ui-monospace,monospace;overflow-wrap:break-word;}
#map{position:absolute;inset:0;background:var(--field);}
/* Значки бункеров и пушек. Отдельный холст поверх карты: один рисунок
   штампуется сколько угодно раз, элементов страницы не создаётся. */
.ogt-sprites{position:absolute;inset:0;z-index:450;pointer-events:none;}
.mv-warn{font-size:12px;line-height:1.5;color:#C9A227;margin:8px 0 10px;}
.mv-link{font-family:'Space Mono',monospace;font-size:10px;line-height:1.45;word-break:break-all;
  background:rgba(0,0,0,.35);border:1px solid rgba(224,163,46,.28);border-radius:8px;padding:9px;
  color:#D8D3C4;user-select:all;-webkit-user-select:all;}
#splash{position:fixed;inset:0;z-index:9000;background:#12140F;display:flex;
  align-items:center;justify-content:center;flex-direction:column;
  transition:opacity .45s ease;}
#splash.gone{opacity:0;pointer-events:none;}
#splash img{width:min(76vw,340px);height:auto;border-radius:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.6);}
#splash-bar{width:min(76vw,340px);height:3px;margin-top:18px;border-radius:3px;
  background:rgba(224,163,46,.18);overflow:hidden;}
#splash-bar i{display:block;height:100%;width:35%;border-radius:3px;background:#E0A32E;
  animation:sweep 1.1s ease-in-out infinite;}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
.leaflet-tile-pane{filter:grayscale(1) brightness(.42) contrast(1.15);}
.leaflet-container{background:var(--field);}
.leaflet-control-attribution{background:rgba(18,20,15,.82)!important;color:var(--sand-dim)!important;font-size:9px!important;}
.leaflet-control-attribution a{color:var(--sand-dim)!important;}

#hud{position:absolute;top:0;left:0;right:0;z-index:600;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  background:linear-gradient(180deg,rgba(18,20,15,.94),rgba(18,20,15,0));pointer-events:none;}
#hud-row{display:flex;align-items:center;gap:8px;}
#brand{font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;letter-spacing:.09em;
  text-transform:uppercase;}
#brand em{font-style:normal;color:var(--amber);}
.chip{pointer-events:auto;border:1px solid var(--line);border-radius:100px;padding:5px 10px;
  background:rgba(27,30,22,.92);color:var(--sand-dim);font-size:10.5px;font-family:'Space Mono',monospace;
  cursor:pointer;}
#who{margin-left:auto;}
#stats{display:flex;gap:14px;margin-top:8px;font-size:10px;color:var(--sand-dim);letter-spacing:.05em;}
#stats b{color:var(--sand);font-size:13px;font-weight:700;display:block;font-family:'Oswald',sans-serif;}

/* Полоса состояния связи — видно, что игра идёт с телефона */
#link{position:absolute;top:calc(env(safe-area-inset-top) + 74px);left:12px;z-index:600;
  font-size:9.5px;letter-spacing:.08em;color:var(--sand-dim);pointer-events:none;}
#link.off{color:var(--rust);}
#link.queued{color:var(--amber);}

#retic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:500;
  pointer-events:none;width:132px;height:132px;}
#retic svg{width:100%;height:100%;overflow:visible;}
#retic .ring{fill:none;stroke:var(--rust);stroke-width:1.5;opacity:.85;
  transition:stroke .5s ease, r .8s cubic-bezier(.2,.8,.2,1);}
#retic .tick{stroke:var(--rust);stroke-width:2;transition:stroke .5s ease;}
#retic.lock .ring,#retic.lock .tick{stroke:var(--amber);}
#retic .spin{transform-origin:50% 50%;animation:spin 9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#retic.lock .spin{animation-duration:3.5s;}
@media (prefers-reduced-motion:reduce){#retic .spin{animation:none;}}
#acc{position:absolute;left:50%;top:calc(50% + 78px);transform:translateX(-50%);z-index:500;
  font-size:10px;letter-spacing:.1em;color:var(--rust);pointer-events:none;text-align:center;}
#retic.lock ~ #acc{color:var(--amber);}

#dock{position:absolute;left:0;right:0;bottom:0;z-index:600;
  padding:14px 12px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(0deg,rgba(18,20,15,.96) 55%,rgba(18,20,15,0));}
#msg{font-size:11.5px;line-height:1.55;color:var(--sand-dim);margin-bottom:10px;min-height:32px;}
#msg.warn{color:var(--rust);}
#msg.good{color:var(--ok);}
.btn{width:100%;border:none;border-radius:4px;padding:16px;font-family:'Oswald',sans-serif;
  font-size:16px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;}
#plant{background:var(--amber);color:#12140F;}
#plant:disabled{background:var(--field-2);color:var(--sand-dim);border:1px solid var(--line);cursor:not-allowed;}
.row{display:flex;gap:8px;margin-top:8px;}
.btn-ghost{flex:1;background:var(--field-2);border:1px solid var(--line);color:var(--sand);
  border-radius:4px;padding:11px;font-family:'Oswald',sans-serif;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;cursor:pointer;}

.place-pin{font-size:15px;color:#7FA65C;text-shadow:0 1px 4px #000;white-space:nowrap;
  transform:translate(-50%,-50%);}
.place-pin span{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;margin-left:5px;}
.ad-box{position:relative;background:var(--field-2);border:1px solid var(--line);
  border-radius:5px;padding:11px 12px;margin-bottom:10px;cursor:pointer;}
.ad-box b{display:block;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.04em;}
.ad-box span:not(.ad-tag){display:block;font-size:11px;color:var(--sand-dim);margin-top:3px;line-height:1.5;}
.ad-box img{width:100%;border-radius:3px;margin-bottom:7px;}
.ad-tag{position:absolute;top:7px;right:8px;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--sand-dim);border:1px solid var(--line);
  border-radius:2px;padding:1px 4px;}
.terr-label{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 12px #000;}
.terr-mine{color:var(--amber);} .terr-them{color:var(--rust);}

#veil{position:fixed;inset:0;z-index:900;background:rgba(9,10,7,.92);display:none;
  align-items:flex-end;justify-content:center;}
#veil.on{display:flex;}
#sheet{background:var(--field-2);border-top:1px solid var(--line);border-radius:10px 10px 0 0;
  padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;}
#sheet h2{font-family:'Oswald',sans-serif;font-size:19px;letter-spacing:.08em;text-transform:uppercase;
  margin:0 0 12px;}
#sheet p{font-size:12.5px;line-height:1.7;color:var(--sand-dim);margin:0 0 14px;}
#sheet input{width:100%;background:var(--field);border:1px solid var(--line);color:var(--sand);
  border-radius:4px;padding:13px;font-family:'Space Mono',monospace;font-size:15px;margin-bottom:12px;}
#shot{width:100%;border-radius:4px;border:1px solid var(--line);margin-bottom:12px;display:none;}

/* Профиль */
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.pf-cell{background:var(--field);border:1px solid var(--line);border-radius:5px;padding:12px;}
.pf-v{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--amber);line-height:1.1;}
.pf-l{font-size:9.5px;color:var(--sand-dim);letter-spacing:.07em;text-transform:uppercase;margin-top:4px;}
.pf-sec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sand-dim);
  border-bottom:1px solid var(--line);padding-bottom:6px;margin:18px 0 10px;}
.pf-line{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;
  color:var(--sand-dim);padding:6px 0;}
.pf-line b{color:var(--sand);font-weight:400;text-align:right;word-break:break-all;}
.lang-row{display:flex;flex-wrap:wrap;gap:6px;}
.btn-gun{width:100%;margin-top:8px;border-color:rgba(224,163,46,.45);}
.btn-gun[disabled]{opacity:.4;}
.lang-btn{background:var(--field);border:1px solid var(--line);color:var(--sand-dim);
  border-radius:4px;padding:8px 12px;font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;}
.lang-btn.on{border-color:var(--amber);color:var(--amber);}
</style>
</head>
<body>
<div id="splash"><img src="splash-1080.webp" alt="Gate Territory" fetchpriority="high"/><div id="splash-bar"><i></i></div></div>

<div id="map"></div>

  <svg viewBox="0 0 132 132">
    <g class="spin"><circle class="ring" cx="66" cy="66" r="52" stroke-dasharray="6 12"/></g>
    <circle class="ring" id="acc-ring" cx="66" cy="66" r="30"/>

    <p id="sheet-p">—</p>
    <img id="shot" alt=""/>
    <input id="sheet-in" style="display:none" maxlength="24" placeholder="Northside"/>
    <button class="btn" id="sheet-ok" onclick="sheetOk()">OK</button>
    <div class="row"><button class="btn-ghost" onclick="closeSheet()">Close</button></div>
  </div>
</div>

<input type="file" id="cam" accept="image/*" capture="environment" style="display:none"/>

<script>
// ═══════════════════════════════════════════════════════════════════
//  Gate Territory — шаг 1
//
//  ЧТО СЧИТАЕТ ТЕЛЕФОН (без интернета):
//    • хранит все бункеры у себя (IndexedDB) — карта открывается мгновенно
//    • рисует территории, считает площадь, ведёт профиль
//    • меряет расстояния и проверяет правила ДО обращения наружу
//    • держит плитки карты — район работает без сети
//    • при отсутствии связи копит постройки и отправляет позже
//
//  ЧТО ОСТАЁТСЯ СНАРУЖИ (и почему):
//    только «кто занял точку первым». Двое могут встать на одно место
//    в один момент; решить это может лишь общий судья. Уходит один
//    короткий вопрос, ответ «да» или «нет».
// ═══════════════════════════════════════════════════════════════════

const SB_URL = 'https://hgzthbidfdqomuotdocb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnenRoYmlkZmRxb211b3Rkb2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTI2NjEsImV4cCI6MjA5NjU4ODY2MX0.otgk-jq2k0COrIE3cUEnRBPYKGnzAHRi3LEIQhE7khA';
// Если файл базы не загрузился (нет сети, старый кэш, сбой у поставщика),
// приложение обязано открыться и работать по памяти телефона. Раньше
// здесь падала вся игра: ни карты, ни своих бункеров, ни профиля.
const sb = (window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(SB_URL, SB_KEY)
  : (function(){
      const dead = { data:null, error:{ message:'offline' } };
      function q(){ const o = {}; ['select','eq','gt','gte','lte','order','in','neq','limit']
        .forEach(k => o[k] = function(){ return o; });
        o.then = function(res){ return Promise.resolve(dead).then(res); };
        return o; }
      return { from: q, rpc: function(){ return Promise.resolve(dead); },
               channel: function(){ return { on: function(){ return this; },
                                             subscribe: function(){ return this; } }; } };
    })();

let map, meDot, meHalo;
let addr = null, here = null, acc = null;
let cfg = { max_accuracy_m:40, radius_earth_m:100, min_distance_m:100, earth_per_day:1, max_earth_alive:5 };
let layers = new Map(), labels = new Map();
let bunkers = [], names = {}, places = [], ads = [];
let pendingPhoto = null, sheetMode = null;
let queue = [];
let _lastSpeed = null, _steps = null;


// ═══════════ ЯЗЫКИ ═══════════
// Игра мировая: реклама может идти в Китае, США, Украине. Язык берётся
// из телефона сам, менять можно в профиле. Неизвестный язык — английский.
var LANG = { en:{"plant": "Plant bunker", "center": "Center on me", "name": "Name land", "profile": "profile", "stand": "Stand where you want your bunker. The ring locks when the signal is good enough.", "yours": "YOURS", "near": "NEARBY", "today": "TODAY", "players": "NEAR YOU", "locked": "locked", "need": "need", "sat": "looking for satellites", "planted": "Planted. This ground is yours.", "weak": "Signal is too weak right now.", "daily": "You have used your free bunker for today.", "close": "Another bunker is {d} m away. You need {n} m of clear ground.", "maxb": "You hold the maximum of {n} bunkers.", "saved": "Saved on your phone. It will reach the map when you get signal.", "nearby": "Someone just planted nearby.", "fake": "This device reports a faked location.", "st_offline": "offline", "st_noserver": "no server", "st_back": "back online", "st_nolocal": "no phone storage", "st_device": "from device", "st_first": "first run", "st_ok": "up to date", "st_sending": "sending", "st_wait": "waiting", "st_new": "{n} new", "nogeo": "This phone has no location service.", "blocked": "Location is blocked. Allow it in settings, then reopen.", "nosignal": "No signal yet. Step outside — walls block satellites.", "planthere": "Plant here?", "planting": "Planting…", "noconn": "No connection. Saved on your phone and will be sent later.", "taken": "Someone got there first — a bunker is {d} m away.", "weaksig": "Signal was too weak: ± {n} m.", "failed": "Could not plant here.", "noground": "Not enough ground", "noground2": "Name your land once you hold three bunkers. You have {n}.", "nameland": "Name your land", "namebad": "That name was not accepted.", "named": "Named.", "namelater": "No connection — try naming again later.", "gotit": "Got it", "backmap": "Back to map", "back": "Back", "closebtn": "Close", "pf_title": "Profile", "pf_held": "Bunkers held", "pf_area": "Ground covered", "pf_left": "Free left today", "pf_onmap": "Bunkers on your map", "pf_land": "Your land", "pf_name": "Name", "pf_noname": "not named yet", "pf_first": "First planted", "pf_player": "Player", "pf_wallet": "Wallet", "pf_walno": "not needed yet — only for buying", "pf_phone": "On this phone", "pf_stored": "Stored locally", "pf_bunk": "{n} bunkers", "pf_queue": "Waiting to send", "pf_space": "Storage used", "pf_mb": "{n} MB on this phone", "pf_sync": "Last sync", "pf_never": "never", "pf_off": "Map works offline", "pf_offyes": "yes, for places you have visited", "pf_rules": "Rules right now", "pf_free": "Free bunkers a day", "pf_at": "Bunkers at once", "pf_dist": "Distance between bunkers", "pf_ring": "Ring around a bunker", "pf_sig": "Signal needed", "pf_better": "better than ± {n} m", "pf_lang": "Language", "pf_og": "Open OpenGate", "pf_sync2": "Sync now", "mv_btn": "Play on another phone", "mv_title": "Same player, two phones", "mv_head": "Move player to another phone", "mv_warn": "Send this link to yourself and open it on the other phone. Anyone who gets this link becomes you — never post it publicly.", "mv_copy": "Copy link", "mv_send": "Send", "mv_copied": "Link copied.", "mv_manual": "Hold the link and copy it by hand.", "mv_bad": "Link is broken", "mv_bad2": "That transfer link could not be read.", "mv_ask": "Become player {p} on this phone?\n\nThe player now on this phone will be replaced. Its bunkers stay on the map but stop being yours here.", "planthere2": "This spot becomes yours with a {r} m ring around it. Earth bunkers are free — one a day.", "nameland2": "Everyone on the map will see it. Up to 24 characters.", "plantit": "Plant it", "savename": "Save name", "gun_btn": "Cannon", "gun_place": "Place cannon?", "gun_place2": "It guards the point and fires {r} m around. Free — {n} left today.", "gun_ok": "Cannon placed.", "gun_left": "{n} left today", "gun_daily": "No free cannons left today.", "gun_nobunker": "Stand inside your own bunker ring — within {n} m of it.", "gun_full": "This bunker already has {n} cannons — the most that fit.", "gun_close": "Another cannon is {d} m away. You need {n} m of clear ground.", "gun_neednet": "Cannons need a connection — the 200 m rule is checked on the server."} };
// Остальные языки лежат в отдельном файле lang.json: телефон берёт его
// ОДИН раз за всю жизнь и держит у себя. Так добавление нового языка —
// правка одного файла, а не всей игры, и никто не качает 23 словаря,
// которых никогда не увидит.
var LANG_V = 2;
async function loadLangPack(){
  try{
    const p = await DB.get('kv','langpack');
    if(p && p.v === LANG_V && p.d){ Object.assign(LANG, p.d); return true; }
  }catch(e){}
  try{
    const r = await fetch('lang.json', { cache:'force-cache' });
    if(!r.ok) return false;
    const d = await r.json();
    Object.assign(LANG, d);
    try{ await DB.put('kv', { v:LANG_V, d:d }, 'langpack'); }catch(e){}
    return true;
  }catch(e){ return false; }
}
var lang = 'en';
function T(k, vars){
  var d = LANG[lang] || LANG.en;
  var s = d[k] || LANG.en[k] || k;
  if(vars) Object.keys(vars).forEach(function(n){ s = s.split('{'+n+'}').join(vars[n]); });
  return s;
}
function pickLang(saved){
  if(saved && LANG[saved]) return saved;
  var c = (navigator.language || 'en').slice(0,2).toLowerCase();
  return LANG[c] ? c : 'en';
}
function applyLang(){
  var set = function(id, t){ var e = document.getElementById(id); if(e) e.textContent = t; };
  set('lbl-yours', T('yours')); set('lbl-near', T('near'));
  set('lbl-today', T('today')); set('lbl-players', T('players'));
  var w = document.getElementById('btn-profile'); if(w) w.textContent = T('profile');
  var c = document.getElementById('btn-center'); if(c) c.textContent = T('center');
  var n = document.getElementById('btn-name');   if(n) n.textContent = T('name');
  var k = document.getElementById('sheet-ok'); if(k) k.textContent = T('closebtn');
  var b = document.getElementById('plant'); if(b) b.textContent = T('plant');
  if(typeof paintGunBtn === 'function') paintGunBtn();
  if(!addr) say(T('stand'));
  paintReticle();
}

// ═══════════ Хранилище в телефоне ═══════════
const DB = (function(){
  let db = null;
  function open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('ogt', 2);
      r.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains('bunkers')) d.createObjectStore('bunkers', { keyPath:'id' });
        if(!d.objectStoreNames.contains('kv'))      d.createObjectStore('kv');
        if(!d.objectStoreNames.contains('queue'))   d.createObjectStore('queue', { keyPath:'tmp' });
        // Снимки живут ТОЛЬКО здесь. В базу уходит один отпечаток:
        // год игры это 19 МБ вместо 21 ГБ, и карта не тяжелеет.
        if(!d.objectStoreNames.contains('photos'))  d.createObjectStore('photos');
        if(!d.objectStoreNames.contains('units'))   d.createObjectStore('units', { keyPath:'id' });
      };
      r.onsuccess = e => { db = e.target.result; res(db); };
      r.onerror = () => rej(r.error);
    });
  }
  function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
  function all(store){
    return new Promise(res => { const q = tx(store,'readonly').getAll(); q.onsuccess = () => res(q.result||[]); q.onerror = () => res([]); });
  }
  function put(store, val, key){
    return new Promise(res => { const q = key !== undefined ? tx(store,'readwrite').put(val,key) : tx(store,'readwrite').put(val); q.onsuccess = () => res(true); q.onerror = () => res(false); });
  }
  function del(store, key){
    return new Promise(res => { const q = tx(store,'readwrite').delete(key); q.onsuccess = () => res(true); q.onerror = () => res(false); });
  }
  function get(store, key){
    return new Promise(res => { const q = tx(store,'readonly').get(key); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); });
  }
  return { open, all, put, del, get };
})();

// Отпечаток снимка. Считает сам телефон, наружу уходят 64 знака.
// Если когда-нибудь дойдёт до разбирательства, телефон предъявит фото,
// а отпечаток докажет, что его не подменили.
async function photoHash(dataUrl){
  try{
    const bin = atob(dataUrl.split(',')[1]);
    const buf = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }
}

// ═══════════ Расстояние — считает телефон ═══════════
// Формула гаверсинуса: по дуге, а не по прямой. На плоскости
// ошибка растёт с широтой, а игра рассчитана на весь мир.
function metersBetween(a, b, c, d){
  const R = 6371000, t = Math.PI/180;
  const s1 = Math.sin((c-a)*t/2), s2 = Math.sin((d-b)*t/2);
  return 2*R*Math.asin(Math.sqrt(s1*s1 + Math.cos(a*t)*Math.cos(c*t)*s2*s2));
}

// У пушек своё расстояние: 200 м, вдвое меньше бункерного. Внутри
// круга радиусом 250 м это даёт ровно 7 мест — одно в центре и шесть
// кольцом. Соты, которые красиво ложатся на карту.
function nearestUnit(lat, lng, list){
  let bestD = Infinity;
  for(const u of (list||[])){
    const d = metersBetween(lat, lng, u.lat, u.lng);
    if(d < bestD) bestD = d;
  }
  return bestD;
}

function nearestBunker(lat, lng){
  let best = null, bestD = Infinity;
  for(const b of bunkers){
    if(Math.abs(b.lat-lat) > 0.01 || Math.abs(b.lng-lng) > 0.01) continue;
    const d = metersBetween(lat, lng, b.lat, b.lng);
    if(d < bestD){ bestD = d; best = b; }
  }
  return { b: best, d: bestD };
}

// Площадь владений: сетка 10×10 м по своим кругам. Считает процессор
// телефона, наружу не уходит ничего.
function myAreaM2(){
  const mine = bunkers.filter(b => addr && b.owner === addr);
  if(!mine.length) return 0;
  const R = cfg.radius_earth_m, step = 10;
  let minLat=90, maxLat=-90, minLng=180, maxLng=-180;
  const dLat = R/111320;
  for(const b of mine){
    const dLng = R/(111320*Math.cos(b.lat*Math.PI/180));
    minLat=Math.min(minLat,b.lat-dLat); maxLat=Math.max(maxLat,b.lat+dLat);
    minLng=Math.min(minLng,b.lng-dLng); maxLng=Math.max(maxLng,b.lng+dLng);
  }
  const latStep = step/111320;
  const lngStep = step/(111320*Math.cos(((minLat+maxLat)/2)*Math.PI/180));
  let cells = 0, guard = 0;
  for(let la=minLat; la<=maxLat && guard<400000; la+=latStep){
    for(let ln=minLng; ln<=maxLng && guard<400000; ln+=lngStep){
      guard++;
      for(const b of mine){
        if(metersBetween(la, ln, b.lat, b.lng) <= R){ cells++; break; }
      }
    }
  }
  return cells * step * step;
}


// ═══════════ Значки на карте ═══════════
// Каждый значок рисуется ОДИН раз в отдельную картинку и потом
// штампуется. Раньше на каждый бункер создавался свой кружок-элемент:
// на трёхстах штуках телефон начинал тормозить и греться.
const GOLD='#C9A227', DOOR='#1E7A4A', DGREEN='#2C4327', STONE='#9A968A',
      STEEL='#6E7480', DARKI='#22261D', FOE='#B23A2E';
const _spriteCache = new Map();

function sprite(kind, px, foe){
  const key = kind+'|'+px+'|'+(foe?1:0);
  if(_spriteCache.has(key)) return _spriteCache.get(key);
  const s = document.createElement('canvas');
  const r = Math.min(window.devicePixelRatio || 1, 2);
  s.width = s.height = Math.round(px*r);
  const c = s.getContext('2d'); c.scale(r,r);
  const m = px/32, C = px/2, line = foe ? FOE : GOLD;
  c.lineJoin = c.lineCap = 'round';
  function poly(n, rad, rot, fill, stroke, lw){
    c.beginPath();
    for(let i=0;i<n;i++){
      const a = rot + i*2*Math.PI/n;
      const x = C + Math.cos(a)*rad, y = C + Math.sin(a)*rad;
      i ? c.lineTo(x,y) : c.moveTo(x,y);
    }
    c.closePath();
    if(fill){ c.fillStyle=fill; c.fill(); }
    if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw*m; c.stroke(); }
  }
  if(kind==='concrete'){
    poly(6, 13*m, Math.PI/6, STONE, line, 2.2);
    c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(C-9*m, C-1.2*m, 18*m, 2.4*m);
    c.fillStyle=DOOR; c.fillRect(C-3.2*m, C-4*m, 6.4*m, 8*m);
    c.strokeStyle=GOLD; c.lineWidth=1.1*m; c.strokeRect(C-3.2*m, C-4*m, 6.4*m, 8*m);
  } else if(kind==='steel'){
    poly(8, 13.5*m, Math.PI/8, STEEL, line, 2.4);
    c.fillStyle='rgba(255,255,255,.35)';
    for(let i=0;i<8;i++){ const a=Math.PI/8+i*Math.PI/4;
      c.beginPath(); c.arc(C+Math.cos(a)*10*m, C+Math.sin(a)*10*m, 1.3*m,0,7); c.fill(); }
    c.fillStyle=DOOR; c.beginPath(); c.arc(C,C,4.6*m,0,7); c.fill();
    c.strokeStyle=GOLD; c.lineWidth=1.3*m; c.stroke();
  } else if(kind==='fort'){
    c.beginPath();
    for(let i=0;i<12;i++){ const a=i*Math.PI/6, rad=(i%2? 9.5:15)*m;
      const x=C+Math.cos(a)*rad, y=C+Math.sin(a)*rad; i?c.lineTo(x,y):c.moveTo(x,y); }
    c.closePath(); c.fillStyle=STONE; c.fill();
    c.strokeStyle=line; c.lineWidth=2.4*m; c.stroke();
    c.fillStyle=DGREEN; c.beginPath(); c.arc(C,C,6*m,0,7); c.fill();
    c.fillStyle=GOLD; c.beginPath(); c.arc(C,C,2.4*m,0,7); c.fill();
  } else if(kind==='gun'||kind==='heavy'||kind==='rocket'){
    const base = kind==='rocket'? 9.5*m : kind==='heavy'? 9*m : 7.5*m;
    c.fillStyle = kind==='gun'? DGREEN : kind==='heavy'? '#3E4A33' : '#43382B';
    c.beginPath(); c.arc(C,C,base,0,7); c.fill();
    c.strokeStyle=line; c.lineWidth=2*m; c.stroke();
    if(kind==='rocket'){
      c.strokeStyle=GOLD; c.lineWidth=2.2*m;
      [[-2.6,-11],[2.6,-11]].forEach(function(q){
        c.beginPath(); c.moveTo(C+q[0]*m, C-2*m); c.lineTo(C+q[0]*m, C+q[1]*m); c.stroke(); });
    } else {
      c.strokeStyle=DARKI; c.lineWidth = kind==='heavy'? 4*m : 3*m;
      c.beginPath(); c.moveTo(C,C); c.lineTo(C, C-13*m); c.stroke();
    }
  } else if(kind==='radar'){
    c.fillStyle=DGREEN; c.beginPath(); c.arc(C,C,7.5*m,0,7); c.fill();
    c.strokeStyle=line; c.lineWidth=2*m; c.stroke();
    c.strokeStyle=GOLD; c.lineWidth=1.6*m;
    for(let i=1;i<=3;i++){ c.beginPath(); c.arc(C,C,(7+i*3.2)*m, -Math.PI*0.78, -Math.PI*0.22); c.stroke(); }
  } else {                                   // земляной — насыпь с мешками
    poly(8, 13*m, Math.PI/8, DGREEN, line, 2);
    c.fillStyle='rgba(255,255,255,.18)';
    for(let i=0;i<6;i++){ const a=i*Math.PI/3;
      c.beginPath(); c.arc(C+Math.cos(a)*8*m, C+Math.sin(a)*8*m, 2.4*m, 0, 7); c.fill(); }
    c.fillStyle=DOOR; c.fillRect(C-2.6*m, C-3*m, 5.2*m, 6*m);
  }
  _spriteCache.set(key, s);
  return s;
}

// Один холст на все значки. Далеко отъехал — значки не рисуем вовсе:
// на мелком масштабе они всё равно слились бы в кашу, а телефон грелся.
const Sprites = (function(){
  let cv = null, ctx = null, need = false;
  function sizeFor(z){ return z>=18?32 : z===17?28 : z===16?22 : z===15?16 : 0; }
  function attach(){
    cv = document.createElement('canvas'); cv.className = 'ogt-sprites';
    ctx = cv.getContext('2d');
    map.getContainer().appendChild(cv);
    map.on('move zoom moveend zoomend resize viewreset', ask);
    ask();
  }
  function fit(){
    const r = Math.min(window.devicePixelRatio || 1, 2);
    const w = map.getSize().x, h = map.getSize().y;
    if(cv.width !== Math.round(w*r) || cv.height !== Math.round(h*r)){
      cv.width = Math.round(w*r); cv.height = Math.round(h*r);
      cv.style.width = w+'px'; cv.style.height = h+'px';
    }
    ctx.setTransform(r,0,0,r,0,0);
  }
  function draw(){
    need = false;
    if(!cv) return;
    fit();
    const w = map.getSize().x, h = map.getSize().y;
    ctx.clearRect(0,0,w,h);
    const px = sizeFor(map.getZoom());
    if(!px) return;
    const pad = px, half = px/2;
    let drawn = 0;
    for(let i=0;i<bunkers.length && drawn<400;i++){
      const b = bunkers[i];
      const p = map.latLngToContainerPoint([b.lat, b.lng]);
      if(p.x < -pad || p.y < -pad || p.x > w+pad || p.y > h+pad) continue;
      if(fogHides(b.lat, b.lng, b.owner)) continue;
      ctx.drawImage(sprite(b.kind||'earth', px, !(addr && b.owner===addr)),
                    p.x-half, p.y-half, px, px);
      drawn++;
    }
    // Пушки мельче бункеров: на карте сразу видно, что главное, а что охрана
    const gp = Math.round(px*0.7), gh = gp/2;
    for(let i=0;i<units.length && drawn<800;i++){
      const u = units[i];
      if(u.alive === false) continue;
      const p = map.latLngToContainerPoint([u.lat, u.lng]);
      if(p.x < -pad || p.y < -pad || p.x > w+pad || p.y > h+pad) continue;
      if(fogHides(u.lat, u.lng, u.owner)) continue;
      ctx.drawImage(sprite(u.code||'gun', gp, !(addr && u.owner===addr)),
                    p.x-gh, p.y-gh, gp, gp);
      drawn++;
    }
  }
  function ask(){ if(need) return; need = true; requestAnimationFrame(draw); }
  return { attach, refresh: ask };
})();

// ═══════════ Карта ═══════════
function initMap(){
  map = L.map('map', { zoomControl:false, preferCanvas:true,
    renderer: L.canvas({ padding:0.3 }) }).setView([50.4501, 30.5234], 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
  map.on('moveend', drawLabels);
  Sprites.attach();
}

let followed = false;
let _watchId = null, _lastCell = null;
function watchMe(){
  if(!navigator.geolocation){ say(T('nogeo'),'warn'); return; }
  if(_watchId !== null) return;
  _watchId = navigator.geolocation.watchPosition(p => {
    const nlat = p.coords.latitude, nlng = p.coords.longitude;
    const nacc = p.coords.accuracy;
    if(typeof p.coords.speed === 'number' && !isNaN(p.coords.speed)) _lastSpeed = p.coords.speed;
    // Перерисовываем, только если сдвинулись заметно или точность
    // изменилась. Раньше карта перерисовывалась на каждую засечку —
    // раз в две секунды, круглые сутки.
    const moved = !here || metersBetween(here[0], here[1], nlat, nlng) > 5;
    const accCh = acc == null || Math.abs(nacc - acc) > 3;
    here = [nlat, nlng]; acc = nacc;
    if(!followed){ map.setView(here, 17); followed = true; _lastCell = cellKey(nlat,nlng); sync(); }
    // Ушёл в соседнюю клетку — подтянуть её бункеры.
    const ck = cellKey(nlat, nlng);
    if(ck !== _lastCell){ _lastCell = ck; sync(); }
    if(moved) _movedAt = Date.now();
    if(markSeen(nlat, nlng)){ if(Number(cfg.fog_on)) drawAll(); saveSeen(); }
    if(moved || accCh){ paintMe(); paintReticle(); Sprites.refresh(); }
  }, err => {
    say(err.code === 1
      ? 'Location is blocked. Allow it in your settings, then reopen.'
      : 'No signal yet. Step outside — walls block satellites.','warn');
  }, { enableHighAccuracy:true, maximumAge:5000, timeout:20000 });
}
function stopWatch(){
  if(_watchId !== null){ navigator.geolocation.clearWatch(_watchId); _watchId = null; }
}

// Свернули игру — глушим спутники, опрос и сеть. Это самая большая
// экономия батареи: свёрнутой игра бывает дольше, чем открытой.
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ stopWatch(); stopPoll(); saveSeen(); }
  else { watchMe(); startPoll(); _lastSync = Date.now(); sync(); }
});

function paintMe(){
  if(!here) return;
  if(!meDot){
    meHalo = L.circle(here, { radius:acc||30, color:'#E0A32E', weight:1, opacity:.35,
                              fillColor:'#E0A32E', fillOpacity:.06 }).addTo(map);
    meDot  = L.circleMarker(here, { radius:6, color:'#12140F', weight:2,
                                    fillColor:'#E0A32E', fillOpacity:1 }).addTo(map);
  } else { meDot.setLatLng(here); meHalo.setLatLng(here); meHalo.setRadius(acc||30); }
}

function paintReticle(){
  const r = document.getElementById('retic');
  const ring = document.getElementById('acc-ring');
  const txt = document.getElementById('acc');
  const btn = document.getElementById('plant');
  if(acc == null){ txt.textContent = T('sat'); return; }
  const good = acc <= cfg.max_accuracy_m;
  ring.setAttribute('r', Math.max(14, Math.min(52, 14 + (acc-8)*0.4)).toFixed(0));
  r.classList.toggle('lock', good);
  txt.textContent = good ? '± '+Math.round(acc)+' m · '+T('locked')
                         : '± '+Math.round(acc)+' m · '+T('need')+' '+cfg.max_accuracy_m+' m';
  btn.disabled = !good;
  btn.textContent = T('plant');
}

function recenter(){ if(here) map.setView(here, 17); }

// ═══════════ Кто ты ═══════════
// Кошелёк для игры не нужен. Телефон один раз делает себе постоянный
// номер и держит его у себя. Вид номера такой же, как у адреса кошелька
// (0x и 40 знаков) — чтобы потом, когда появятся покупки, тот же столбец
// в базе принял настоящий адрес без переделки схемы.
async function ensureId(){
  let a = null;
  try{ a = await DB.get('kv','addr'); }catch(e){}
  if(!a || !/^0x[0-9a-f]{40}$/.test(a)){
    const r = new Uint8Array(20);
    (window.crypto || self.crypto).getRandomValues(r);
    a = '0x' + Array.from(r).map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');
    try{ await DB.put('kv', a, 'addr'); }catch(e){}
  }
  addr = a;
  const w = document.getElementById('who');
  if(w) w.textContent = a.slice(0,6)+'…'+a.slice(-4);
  return a;
}




// ═══════════ Туман войны ═══════════
// Выключен. Включается одним числом в базе (fog_on = 1), по городам,
// без выкладки новой версии игры. Клетки, где человек побывал ногами,
// телефон помнит ВСЕГДА — значит в день включения тумана история уже
// накоплена и карта не обнулится.
let seenCells = new Set();
let seenDirty = false;
function fogCell(lat, lng){
  const step = cfg.fog_cell || 0.004;              // примерно 440 м
  return Math.floor(lat/step) + ':' + Math.floor(lng/step);
}
function markSeen(lat, lng){
  const k = fogCell(lat, lng);
  if(seenCells.has(k)) return false;
  seenCells.add(k); seenDirty = true;
  return true;                                      // клетка новая
}
async function saveSeen(){
  if(!seenDirty) return;
  seenDirty = false;
  try{ await DB.put('kv', Array.from(seenCells).slice(-4000), 'seen'); }catch(e){}
}
// Скрыто ли это от меня прямо сейчас
function fogHides(lat, lng, owner){
  if(!Number(cfg.fog_on)) return false;
  if(addr && owner === addr) return false;
  return !seenCells.has(fogCell(lat, lng));
}

// ═══════════ Пушки ═══════════
// Пушка охраняет точку: ставится внутри круга своего бункера,
// не ближе 200 м до любой другой. Снимок для неё не нужен — деньги
// в ней не лежат, а место подтверждают те же спутники.
let units = [];
const haveUnitIds = new Set();

function gunsLeftToday(){
  const day = 24*3600*1000, now = Date.now();
  const mine = units.filter(u => u.owner === addr &&
                                 (now - new Date(u.built_at).getTime()) < day);
  return Math.max(0, (cfg.unit_gun_per_day || 10) - mine.length);
}
function myBunkerNear(lat, lng){
  let best = null, bd = 1e9;
  for(const b of bunkers){
    if(b.owner !== addr) continue;
    const d = metersBetween(b.lat, b.lng, lat, lng);
    if(d < bd){ bd = d; best = b; }
  }
  return { b: best, d: bd };
}
function nearestUnit(lat, lng){
  let bd = 1e9;
  for(const u of units){
    const d = metersBetween(u.lat, u.lng, lat, lng);
    if(d < bd) bd = d;
  }
  return bd;
}
// Те же проверки, что в базе. Здесь — чтобы не гонять телефон
// в сеть ради заведомого отказа.
function preCheckGun(){
  if(!here || acc == null) return 'nogps';
  if(acc > (cfg.unit_accuracy_max_m || 40)) return 'weak';
  if(gunsLeftToday() <= 0) return 'daily';
  const n = myBunkerNear(here[0], here[1]);
  if(!n.b || n.d > (cfg.unit_influence_m || 250)) return 'nobunker';
  const onIt = units.filter(u => u.bunker_id === n.b.id).length;
  if(onIt >= (cfg.unit_max_per_bunker || 7)) return 'full';
  const nu = nearestUnit(here[0], here[1]);
  if(nu < (cfg.unit_step_m || 200)) return 'close:'+Math.round(nu);
  return null;
}
function askGun(){
  const bad = preCheckGun();
  if(bad === 'nogps' || bad === 'weak'){ say(T('weak'),'warn'); return; }
  if(bad === 'daily'){ say(T('gun_daily'),'warn'); return; }
  if(bad === 'nobunker'){ say(T('gun_nobunker',{n:cfg.unit_influence_m||250}),'warn'); return; }
  if(bad === 'full'){ say(T('gun_full',{n:cfg.unit_max_per_bunker||7}),'warn'); return; }
  if(bad && bad.startsWith('close:')){
    say(T('gun_close',{d:bad.split(':')[1], n:cfg.unit_step_m||200}),'warn'); return;
  }
  sheetMode = 'gun';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-body').innerHTML = '';
  document.getElementById('sheet-t').textContent = T('gun_place');
  document.getElementById('sheet-p').textContent =
      T('gun_place2', { r: cfg.unit_step_m || 200, n: gunsLeftToday() });
  document.getElementById('sheet-ok').textContent = T('gun_place');
  document.getElementById('veil').classList.add('on');
}
async function doGun(){
  closeSheet();
  if(!navigator.onLine){ say(T('gun_neednet'),'warn'); return; }
  say(T('planting'));
  try{
    const { data, error } = await sb.rpc('place_unit_v1', { p:{
      owner: addr, code:'gun',
      lat: here[0], lng: here[1], accuracy: acc,
      proof: collectProof()
    }});
    if(error) throw error;
    if(!data || !data.ok){
      const e = data && data.error;
      if(e === 'daily_limit')   return say(T('gun_daily'),'warn');
      if(e === 'no_bunker_near')return say(T('gun_nobunker',{n:data.need}),'warn');
      if(e === 'bunker_full')   return say(T('gun_full',{n:data.limit}),'warn');
      if(e === 'too_close')     return say(T('gun_close',{d:data.got, n:data.need}),'warn');
      if(e === 'weak_gps')      return say(T('weaksig',{n:data.got}),'warn');
      if(e === 'fake_location') return say(T('fake'),'warn');
      return say(T('failed'),'warn');
    }
    const u = { id:data.id, owner:addr, bunker_id:data.bunker_id, code:'gun',
                lat:here[0], lng:here[1], hp_left:data.hp, alive:true,
                built_at:new Date().toISOString() };
    haveUnitIds.add(u.id);
    units.push(u);
    await DB.put('units', u);
    Sprites.refresh(); refreshStats(); paintGunBtn();
    say(T('gun_ok') + ' · ' + T('gun_left', { n: data.left_today }), 'good');
  }catch(e){ say(T('gun_neednet'),'warn'); }
}
function paintGunBtn(){
  const b = document.getElementById('btn-gun');
  if(!b) return;
  const left = gunsLeftToday();
  b.textContent = T('gun_btn') + ' · ' + left;
  b.disabled = left <= 0;
}

// ═══════════ Ключ устройства ═══════════
// Номер игрока сам по себе ничего не доказывает — это просто строка.
// Поэтому телефон заводит себе настоящий ключ. Делает его сам браузер,
// ни одной скачанной библиотеки. Пока ключ только хранится; когда
// появятся деньги, каждая отправка будет им подписана, и подделать
// чужое имя станет нельзя.
async function ensureKey(){
  try{
    let k = await DB.get('kv','key');
    if(k && k.priv) return k;
    if(!(window.crypto && crypto.subtle)) return null;
    const kp = await crypto.subtle.generateKey({ name:'ECDSA', namedCurve:'P-256' },
                                               true, ['sign','verify']);
    k = { priv: await crypto.subtle.exportKey('jwk', kp.privateKey),
          pub:  await crypto.subtle.exportKey('jwk', kp.publicKey) };
    await DB.put('kv', k, 'key');
    return k;
  }catch(e){ return null; }
}

// ═══════════ Перенос игрока на другой телефон ═══════════
// Без кошелька каждый телефон — отдельный игрок. Чтобы играть с двух,
// первый отдаёт ссылку, второй её открывает и становится тем же игроком.
function b64u(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(str){ str = str.replace(/-/g,'+').replace(/_/g,'/'); return decodeURIComponent(escape(atob(str))); }

async function moveLink(){
  const k = await DB.get('kv','key');
  const payload = JSON.stringify({ v:1, a:addr, k:k||null });
  return location.origin + location.pathname + '#move=' + b64u(payload);
}

// Открыли ссылку переноса — спрашиваем и заменяем игрока на этом телефоне.
async function checkMoveLink(){
  const m = (location.hash||'').match(/move=([A-Za-z0-9\-_]+)/);
  if(!m) return false;
  history.replaceState(null,'',location.pathname);
  let data = null;
  try{ data = JSON.parse(unb64u(m[1])); }catch(e){}
  if(!data || !/^0x[0-9a-f]{40}$/.test(data.a||'')){
    sheetInfo(T('mv_bad'), T('mv_bad2')); return false;
  }
  if(data.a === addr) return false;
  const ok = confirm(T('mv_ask', { p: data.a.slice(0,6)+'…'+data.a.slice(-4) }));
  if(!ok) return false;
  await DB.put('kv', data.a, 'addr');
  if(data.k) await DB.put('kv', data.k, 'key');
  // Бункеры в памяти телефона трогать не надо: чей круг золотой, а чей
  // красный, считается при отрисовке по новому номеру игрока.
  location.reload();
  return true;
}

// ═══════════ Синхронизация: только то, чего нет в телефоне ═══════════
async function loadLocal(){
  bunkers = await DB.all('bunkers');
  queue   = await DB.all('queue');
  const c = await DB.get('kv','cfg');   if(c) cfg = Object.assign(cfg, c);

  const pl = await DB.get('kv','places'); if(pl){ places = pl; }

// Мир нарезан на клетки по 0,02° — это примерно 2,2 км. Телефон берёт
// свою клетку и восемь соседних, и ничего больше. Раньше он тянул все
// бункеры планеты: на 15 миллионах это 1,8 ГБ на телефон.
const CELL = 0.02;
function cellKey(lat,lng){ return 'box:'+Math.floor(lat/CELL)+':'+Math.floor(lng/CELL); }
function boxAround(lat,lng){
  const i = Math.floor(lat/CELL), j = Math.floor(lng/CELL);
  return { latMin:(i-1)*CELL, latMax:(i+2)*CELL, lngMin:(j-1)*CELL, lngMax:(j+2)*CELL };
}
const haveIds = new Set();
const namesAsked = new Set();

// Пора ли снова спрашивать редкие вещи
async function staleFor(key, ms){
  try{
    const t = await DB.get('kv', key + 'At');
    return !t || (Date.now() - t) > ms;
  }catch(e){ return true; }
}

async function sync(){
  if(!navigator.onLine){ linkState(T('st_offline'), 'off'); return; }
  try{
    let added = 0;
    if(here){
      const box = boxAround(here[0], here[1]);
      const key = cellKey(here[0], here[1]);
      // Первый приход в клетку — берём её целиком. Дальше только новое.
      let lastId = (await DB.get('kv', key)) || 0;
      let q = sb.from('territory_bunkers')
        .select('id,owner,lat,lng,kind,built_at')
        .eq('alive', true)
        .gte('lat', box.latMin).lte('lat', box.latMax)
        .gte('lng', box.lngMin).lte('lng', box.lngMax);
      if(lastId) q = q.gt('id', lastId);
      const { data, error } = await q.order('id', { ascending:true }).limit(2000);
      if(error) throw error;
      for(const b of (data||[])){
        if(b.id > lastId) lastId = b.id;
        if(haveIds.has(b.id)) continue;
        haveIds.add(b.id);
        await DB.put('bunkers', b);
        bunkers.push(b); drawOne(b); added++;
      }
      await DB.put('kv', lastId, key);

      // Пушки того же района. Отдельная отметка, чтобы бункеры и
      // пушки не мешали друг другу догоняться.
      const ukey = 'ubox:' + key.slice(4);
      let uLast = (await DB.get('kv', ukey)) || 0;
      let uq = sb.from('territory_units')
        .select('id,owner,bunker_id,code,lat,lng,hp_left,alive,built_at')
        .eq('alive', true)
        .gte('lat', box.latMin).lte('lat', box.latMax)
        .gte('lng', box.lngMin).lte('lng', box.lngMax);
      if(uLast) uq = uq.gt('id', uLast);
      const { data:ud } = await uq.order('id', { ascending:true }).limit(2000);
      for(const u of (ud||[])){
        if(u.id > uLast) uLast = u.id;
        if(haveUnitIds.has(u.id)) continue;
        haveUnitIds.add(u.id);
        await DB.put('units', u);
        units.push(u); added++;
      }
      await DB.put('kv', uLast, ukey);
      Sprites.refresh(); paintGunBtn();
    }

    // Правила, отметки заведений и реклама меняются раз в недели, а не
    // раз в три минуты. Спрашиваем их РЕДКО и держим в телефоне.
    // Раньше на каждую проверку уходило шесть запросов вместо двух.
    if(await staleFor('slow', 6*3600*1000)){
      const { data:cf } = await sb.from('territory_config').select('key,value');
      if(cf){ const o={}; cf.forEach(r=>o[r.key]=Number(r.value)); cfg=Object.assign(cfg,o); await DB.put('kv',o,'cfg'); }

      const box2 = here ? boxAround(here[0], here[1]) : null;
      let pq = sb.from('territory_places')
        .select('id,kind,title,subtitle,lat,lng,radius_m,icon,color,perks')
        .eq('visible', true);
      if(box2) pq = pq.gte('lat',box2.latMin).lte('lat',box2.latMax)
                      .gte('lng',box2.lngMin).lte('lng',box2.lngMax);
      const { data:pl } = await pq.limit(200);
      if(pl){ places = pl; await DB.put('kv', pl, 'places'); drawPlaces(); }

      const { data:ad } = await sb.from('territory_ads')
        .select('id,slot,title,body,image_url,link_url,lat,lng,radius_m,weight')
        .eq('active', true).limit(200);
      if(ad){ ads = ad; await DB.put('kv', ad, 'ads'); showAd('dock'); }

      // Запоминаем «спросили» только если сервер правда ответил.
      // Иначе одна пустая выдача заморозила бы правила на шесть часов.
      if(cf && cf.length) await DB.put('kv', Date.now(), 'slowAt');
    }

    // Названия спрашиваем только для тех хозяев, чьё имя нам ещё
    // неизвестно. У кого уже знаем — второй раз не тревожим.
    const fresh = Array.from(new Set(bunkers.map(b=>b.owner)))
                       .filter(o => o && !(o in names) && !namesAsked.has(o))
                       .slice(0, 200);
    if(fresh.length){
      fresh.forEach(o => namesAsked.add(o));
      const { data:nm } = await sb.from('territory_names')
        .select('owner,label').in('owner', fresh);
      if(nm){ nm.forEach(r=>names[r.owner]=r.label); await DB.put('kv',names,'names'); }
    }

    await DB.put('kv', Date.now(), 'syncedAt');
    drawLabels(); refreshStats();
    linkState(added ? T('st_new',{n:added}) : T('st_ok'));
    flushQueue();
  }catch(e){ linkState(T('st_noserver'), 'off'); }
}

function linkState(t, cls){
  document.getElementById('link-txt').textContent = t + (queue.length ? ' · '+queue.length+' '+T('st_wait') : '');
  document.getElementById('link').className = queue.length ? 'queued' : (cls||'');
}

// ═══════════ Отрисовка ═══════════
function drawAll(){
  layers.forEach(l => map.removeLayer(l)); layers.clear();
  bunkers.forEach(drawOne);
  Sprites.refresh();
}
function drawOne(b){
  if(fogHides(b.lat, b.lng, b.owner)) return;
  if(layers.has(b.id)) return;
  const mine = addr && b.owner === addr;
  const col = mine ? '#E0A32E' : '#B4462F';
  const g = L.layerGroup();
  L.circle([b.lat,b.lng], { radius:cfg.radius_earth_m, color:col, weight:mine?2:1,
    opacity:mine?.9:.55, fillColor:col, fillOpacity:mine?.14:.07,
    dashArray:mine?null:'5 6' }).addTo(g);
  g.addTo(map); layers.set(b.id, g);
  Sprites.refresh();
}
function drawLabels(){
  labels.forEach(l => map.removeLayer(l)); labels.clear();
  const byOwner = {};
  bunkers.forEach(b => { (byOwner[b.owner] = byOwner[b.owner]||[]).push(b); });
  Object.keys(byOwner).forEach(owner => {
    const label = names[owner]; const list = byOwner[owner];
    if(!label || list.length < 3) return;
    const lat = list.reduce((s,b)=>s+b.lat,0)/list.length;
    const lng = list.reduce((s,b)=>s+b.lng,0)/list.length;
    const mine = addr && owner === addr;
    labels.set(owner, L.marker([lat,lng], { interactive:false, icon:L.divIcon({ className:'',
      html:'<div class="terr-label '+(mine?'terr-mine':'terr-them')+'">'+esc(label)+'</div>',
      iconSize:[0,0] })}).addTo(map));
  });
}
// Отметки заведений: кафе, спортзал, спонсор. Кружок другого рисунка,
// чтобы не путать с бункером, и подпись рядом.
let placeLayers = [];
function drawPlaces(){
  placeLayers.forEach(l => map.removeLayer(l)); placeLayers = [];
  places.forEach(pl => {
    const col = pl.color || '#7FA65C';
    const g = L.layerGroup();
    L.circle([pl.lat,pl.lng], { radius: pl.radius_m || 60, color: col, weight:1,
      opacity:.7, fillColor:col, fillOpacity:.10, dashArray:'2 5' }).addTo(g);
    L.marker([pl.lat,pl.lng], { interactive:false, icon: L.divIcon({ className:'',
      html:'<div class="place-pin">'+(pl.icon||'\u2691')+'<span>'+esc(pl.title)+'</span></div>',
      iconSize:[0,0] })}).addTo(g);
    g.addTo(map); placeLayers.push(g);
  });
}

// Реклама. Место показа — просто строка: dock, plant, siege, profile,
// win, splash, map_pin. Появится новое место — добавляется значение,
// таблицу и код загрузки менять не надо.
function pickAd(slot){
  const list = ads.filter(a => a.slot === slot).filter(a => {
    if(a.lat == null || !here) return true;
    return metersBetween(here[0], here[1], a.lat, a.lng) <= (a.radius_m || 50000);
  });
  if(!list.length) return null;
  let total = list.reduce((s,a)=>s+(a.weight||100), 0), r = Math.random()*total;
  for(const a of list){ r -= (a.weight||100); if(r <= 0) return a; }
  return list[0];
}
function showAd(slot){
  const box = document.getElementById('ad-'+slot);
  if(!box) return;
  const a = pickAd(slot);
  if(!a){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML = '<span class="ad-tag">ad</span>'
    + (a.image_url ? '<img src="'+esc(a.image_url)+'" alt=""/>' : '')
    + '<b>'+esc(a.title)+'</b>'
    + (a.body ? '<span>'+esc(a.body)+'</span>' : '');
  box.onclick = () => {
    if(a.link_url) window.open(a.link_url, '_blank', 'noopener');
    try{ sb.rpc('territory_ad_click', { p:{ id:a.id } }); }catch(e){}
  };
}

function refreshStats(){
  const mine = addr ? bunkers.filter(b=>b.owner===addr) : [];
  const today = mine.filter(b => new Date(b.built_at).toDateString() === new Date().toDateString());
  document.getElementById('s-mine').textContent = addr ? mine.length : '—';
  document.getElementById('s-near').textContent = bunkers.length;
  document.getElementById('s-left').textContent = addr
    ? Math.max(0, cfg.earth_per_day - today.length - queue.length) : '—';
}

// ═══════════ Постройка ═══════════
// Правила проверяем НА ТЕЛЕФОНЕ до отправки: отказ приходит мгновенно
// и без интернета. Наружу уходит только то, что прошло проверку.
function preCheck(){
  if(!here || acc == null) return 'nogps';
  if(acc > cfg.max_accuracy_m) return 'weak';
  const mine = bunkers.filter(b=>b.owner===addr);
  const today = mine.filter(b => new Date(b.built_at).toDateString() === new Date().toDateString());
  if(today.length + queue.length >= cfg.earth_per_day) return 'daily';
  if(mine.length + queue.length >= cfg.max_earth_alive) return 'max';
  const n = nearestBunker(here[0], here[1]);
  if(n.b && n.d < cfg.min_distance_m) return 'close:'+Math.round(n.d);
  return null;
}

// Показания телефона на момент постройки. Собираем что доступно:
// в лесу сетей нет и это нормально — тогда вес на остальном.
function collectProof(){
  const pr = { mocked:false, wifi:0, cells:0, device:{} };
  try{
    pr.device = { ua:navigator.userAgent.slice(0,120),
                  lang:navigator.language,
                  cores:navigator.hardwareConcurrency||0,
                  mem:navigator.deviceMemory||0 };
  }catch(e){}
  if(typeof _lastSpeed === 'number') pr.speed = _lastSpeed;
  if(typeof _steps === 'number') pr.steps = _steps;
  return pr;
}

function plant(){
  const bad = preCheck();
  if(bad === 'weak' || bad === 'nogps'){ say(T('weak'),'warn'); return; }
  if(bad === 'daily'){ say(T('daily'),'warn'); return; }
  if(bad === 'max'){ say(T('maxb',{n:cfg.max_earth_alive}),'warn'); return; }
  if(bad && bad.startsWith('close:')){
    say(T('close',{d:bad.split(':')[1], n:cfg.min_distance_m}),'warn'); return;
  }
  document.getElementById('cam').click();
}

document.getElementById('cam').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(!f) return;
  const fr = new FileReader(); fr.onload = () => stampPhoto(fr.result); fr.readAsDataURL(f);
});

function stampPhoto(dataUrl){
  const img = new Image();
  img.onload = function(){
    const side = 900, c = document.createElement('canvas');
    const scale = side/Math.max(img.width, img.height);
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0, c.width, c.height);
    x.fillStyle = 'rgba(18,20,15,.82)'; x.fillRect(0, c.height-54, c.width, 54);
    x.fillStyle = '#E8E2D0'; x.font = '13px monospace';
    x.fillText(here[0].toFixed(5)+', '+here[1].toFixed(5)+'  ±'+Math.round(acc)+'m', 10, c.height-32);
    x.fillText(new Date().toISOString().slice(0,19).replace('T',' ')+'  '+addr.slice(0,10), 10, c.height-12);
    pendingPhoto = c.toDataURL('image/jpeg', 0.6);
    sheetMode = 'plant';
    document.getElementById('sheet-body').innerHTML = '';
    document.getElementById('shot').src = pendingPhoto;
    document.getElementById('shot').style.display = 'block';
    document.getElementById('sheet-in').style.display = 'none';
    sheet(T('planthere'), T('planthere2', { r: cfg.radius_earth_m }));
    document.getElementById('sheet-ok').textContent = T('plantit');
  };
  img.src = dataUrl;
}

async function doPlant(){
  closeSheet();
  const tmp = 'q'+Date.now();
  const hash = await photoHash(pendingPhoto);
  // Снимок остаётся в телефоне. Наружу пойдёт только отпечаток.
  await DB.put('photos', pendingPhoto, tmp);
  const item = { tmp:tmp, owner:addr, lat:here[0], lng:here[1],
                 accuracy:acc, hash:hash, proof:collectProof(), at:Date.now() };
  pendingPhoto = null;

  if(!navigator.onLine){
    // В лесу связи нет — постройка ждёт в телефоне и уйдёт позже
    queue.push(item); await DB.put('queue', item);
    say(T('saved'),'good');
    refreshStats(); linkState(T('st_offline'),'off');
    return;
  }
  say(T('planting'));
  const ok = await sendOne(item);
  if(ok === 'network'){
    queue.push(item); await DB.put('queue', item);
    say(T('noconn'),'good');
    refreshStats(); linkState(T('st_offline'),'off');
  }
}

async function sendOne(item){
  try{
    // Один аргумент jsonb: новые поля можно добавлять сколько угодно,
    // подпись функции в базе от этого не меняется и обновлять её
    // вручную не придётся.
    const { data, error } = await sb.rpc('place_bunker_v2', { p: {
      owner: item.owner, lat: item.lat, lng: item.lng,
      accuracy: item.accuracy, photo_hash: item.hash,
      kind: 'earth', proof: item.proof || {}
    }});
    if(error) return 'network';
    if(!data || !data.ok){
      const e = data && data.error;
      if(e === 'too_close') say(T('taken',{d:data.got}),'warn');
      else if(e === 'daily_limit') say(T('daily'),'warn');
      else if(e === 'max_alive')   say(T('maxb',{n:data.limit}),'warn');
      else if(e === 'weak_gps')    say(T('weaksig',{n:data.got}),'warn');
      else if(e === 'fake_location') say(T('fake'),'warn');
      else say(T('failed'),'warn');
      try{ await DB.del('photos', item.tmp); }catch(_){}
      return 'rejected';
    }
    const b = { id:data.id, owner:item.owner, lat:item.lat, lng:item.lng,
                kind:'earth', built_at:new Date(item.at).toISOString() };
    bunkers.push(b); await DB.put('bunkers', b); drawOne(b);
    try{
      const ph = await DB.get('photos', item.tmp);
      if(ph){ await DB.put('photos', ph, 'b'+data.id); await DB.del('photos', item.tmp); }
    }catch(e){}
    haveIds.add(data.id);
    const ck = cellKey(item.lat, item.lng);
    const last = (await DB.get('kv', ck)) || 0;
    if(data.id > last) await DB.put('kv', data.id, ck);
    say(T('planted'),'good');
    refreshStats();
    return 'ok';
  }catch(e){ return 'network'; }
}

async function flushQueue(){
  if(!queue.length || !navigator.onLine) return;
  const list = queue.slice();
  for(const item of list){
    const r = await sendOne(item);
    if(r === 'network') break;
    queue = queue.filter(q => q.tmp !== item.tmp);
    await DB.del('queue', item.tmp);
  }
  refreshStats(); linkState(queue.length ? T('st_sending') : T('st_ok'));
}

// ═══════════ Название земли ═══════════
function askName(){
  const mine = bunkers.filter(b=>b.owner===addr).length;
  if(mine < 3){ sheetInfo(T('noground'), T('noground2',{n:mine})); return; }
  sheetMode = 'name';
  document.getElementById('sheet-body').innerHTML = '';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'block';
  document.getElementById('sheet-in').value = names[addr] || '';
  sheet(T('nameland'), T('nameland2'));
  document.getElementById('sheet-ok').textContent = T('savename');
}
async function doName(){
  const label = document.getElementById('sheet-in').value.trim();
  closeSheet();
  try{
    const { data, error } = await sb.rpc('name_territory', { p_owner:addr, p_label:label });
    if(error || !data || !data.ok){ say(T('namebad'),'warn'); return; }
    names[addr] = label; await DB.put('kv', names, 'names');
    drawLabels(); say(T('named'),'good');
  }catch(e){ say(T('namelater'),'warn'); }
}

// ═══════════ Профиль ═══════════
async function openProfile(){
  const mine = addr ? bunkers.filter(b=>b.owner===addr) : [];
  const area = myAreaM2();
  const first = mine.length ? new Date(Math.min(...mine.map(b=>+new Date(b.built_at)))) : null;
  const syncedAt = await DB.get('kv','syncedAt');
  let quota = '—';
  if(navigator.storage && navigator.storage.estimate){
    try{ const q = await navigator.storage.estimate();
      quota = (q.usage/1048576).toFixed(1)+' MB on this phone'; }catch(e){}
  }
  const today = mine.filter(b => new Date(b.built_at).toDateString() === new Date().toDateString());

  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-p').textContent = '';
  sheetMode = 'info';
  document.getElementById('sheet-ok').textContent = T('backmap');

  document.getElementById('sheet-body').innerHTML =
    '<div class="pf-grid">'
    + cell(mine.length, 'Bunkers held')
    + cell(area >= 1000000 ? (area/1000000).toFixed(2)+' km²' : Math.round(area).toLocaleString()+' m²', 'Ground covered')
    + cell(Math.max(0, cfg.earth_per_day - today.length - queue.length), 'Free left today')
    + cell(bunkers.length, 'Bunkers on your map')
    + '</div>'
    + '<div class="pf-sec">Your land</div>'
    + line(T('pf_name'), names[addr] ? esc(names[addr]) : 'not named yet')
    + line(T('pf_first'), first ? first.toISOString().slice(0,10) : '—')
    + line(T('pf_player'), esc(addr))
    + line(T('pf_wallet'), T('pf_walno'))
    + '<div class="pf-sec">On this phone</div>'
    + line(T('pf_stored'), bunkers.length + ' bunkers')
    + line(T('pf_queue'), queue.length)
    + line(T('pf_space'), quota)
    + line(T('pf_sync'), syncedAt ? new Date(syncedAt).toLocaleTimeString() : 'never')
    + line(T('pf_off'), 'yes, for places you have visited')
    + '<div class="pf-sec">Rules right now</div>'
    + line(T('pf_free'), cfg.earth_per_day)
    + line(T('pf_at'), cfg.max_earth_alive)
    + line(T('pf_dist'), cfg.min_distance_m + ' m')
    + line(T('pf_ring'), cfg.radius_earth_m + ' m')
    + line(T('pf_sig'), 'better than ± ' + cfg.max_accuracy_m + ' m')
    + '<div class="pf-sec">Language</div>'
    + '<div class="lang-row">'
    + Object.keys(LANG).map(function(k){
        return '<button class="lang-btn'+(k===lang?' on':'')+'" onclick="setLang(\''+k+'\')">'+k.toUpperCase()+'</button>';
      }).join('')
    + '</div>'
    + '<div class="row" style="margin:18px 0 0;">'
    + '<button class="btn-ghost" onclick="window.open(\'https://opengate.bond\',\'_blank\')">'+esc(T('pf_og'))+'</button>'
    + '<button class="btn-ghost" onclick="sync();closeSheet()">'+esc(T('pf_sync2'))+'</button>'
    + '</div>'
    + '<div class="row" style="margin:10px 0 0;">'
    + '<button class="btn-ghost" onclick="showMove()">'+esc(T('mv_btn'))+'</button>'
    + '</div>';
  document.getElementById('sheet-t').textContent = T('pf_title');
  document.getElementById('veil').classList.add('on');
}
async function setLang(k){
  lang = k;
  try{ await DB.put('kv', k, 'lang'); }catch(e){}
  applyLang(); openProfile();
}
function cell(v,l){ return '<div class="pf-cell"><div class="pf-v">'+v+'</div><div class="pf-l">'+l+'</div></div>'; }
function line(l,v){ return '<div class="pf-line"><span>'+l+'</span><b>'+v+'</b></div>'; }

// ═══════════ Мелочи ═══════════
function say(t, cls){ const m = document.getElementById('msg'); m.textContent = t; m.className = cls||''; }
function sheet(title, text){
  document.getElementById('sheet-t').textContent = title;
  document.getElementById('sheet-p').textContent = text;
  document.getElementById('veil').classList.add('on');
}
function sheetInfo(t, p){
  sheetMode = 'info';
  document.getElementById('sheet-body').innerHTML = '';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'none';
  document.getElementById('sheet-ok').textContent = T('gotit');
  sheet(t, p);
}
function closeSheet(){ document.getElementById('veil').classList.remove('on'); }
function sheetOk(){
  if(sheetMode === 'plant') doPlant();
  else if(sheetMode === 'gun') doGun();
  else if(sheetMode === 'name') doName();
  else closeSheet();
}
function esc(s){ return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

// Постоянного соединения нет намеренно. Оно присылало КАЖДУЮ постройку
// на планете каждому телефону: 500 тысяч построек в сутки на 50 тысяч
// подключённых — 25 миллиардов сообщений в сутки при включённых
// пяти миллионах в месяц. Вместо него редкий опрос своего района,
// и только пока игра на экране.
let _poll = null, _lastSync = 0, _lastPing = 0, _lastPingAt = null, _movedAt = 0;
// Идёшь — спрашиваем раз в 3 минуты. Стоишь — раз в 10.
// Человек на диване не должен стоить столько же, сколько идущий по городу.
function pollEvery(){ return (Date.now() - _movedAt < 5*60000) ? 180000 : 600000; }
function tick(){
  if(document.hidden || !navigator.onLine) return;
  const now = Date.now();
  if(now - _lastSync >= pollEvery()){ _lastSync = now; sync(); }
  // «Кто рядом» — только если сдвинулся на 100 м или прошло 10 минут
  const far = here && _lastPingAt
      ? metersBetween(_lastPingAt[0], _lastPingAt[1], here[0], here[1]) : 1e9;
  if(here && (far > 100 || now - _lastPing >= 600000)){
    _lastPing = now; _lastPingAt = here.slice(); pingNearby();
  }
}
function startPoll(){
  if(_poll) return;
  _poll = setInterval(tick, 60000);
}
function stopPoll(){ if(_poll){ clearInterval(_poll); _poll = null; } }

// Кто рядом. Наружу уходит КЛЕТКА карты, а не точка, и обратно —
// только число. Ни имён, ни чужих координат. Раз в две минуты.
async function pingNearby(){
  if(!addr || !here || !navigator.onLine || document.hidden) return;
  try{
    const { data } = await sb.rpc('territory_ping', { p:{ wallet:addr, lat:here[0], lng:here[1] } });
    if(data && data.ok) document.getElementById('s-players').textContent = data.nearby;
  }catch(e){}
}
setTimeout(tick, 8000);

// Ссылку переноса могли открыть, когда игра уже запущена — тогда
// страница не перезагружается, меняется только хвост адреса.
window.addEventListener('hashchange', function(){ checkMoveLink(); });

window.addEventListener('online',  () => { linkState(T('st_back')); sync(); });
window.addEventListener('offline', () => linkState(T('st_offline'),'off'));

(async function start(){
  // Регистрируем первым делом и отдельно: если споткнётся что-то ниже,
  // приложение не должно остаться без работы вне сети.
  if('serviceWorker' in navigator){
    try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
  }
  initMap();
  try{ await DB.open(); }catch(e){}
  try{ await ensureId(); }catch(e){}
  try{ if(await checkMoveLink()) return; }catch(e){}
  ensureKey();
  await loadLangPack();
  try{ lang = pickLang(await DB.get('kv','lang')); }catch(e){ lang = pickLang(); }
  applyLang();
  try{ await loadLocal(); }catch(e){ linkState(T('st_nolocal'),'off'); }
  bunkers.forEach(b => haveIds.add(b.id));
  try{
    units = (await DB.all('units')) || [];
    units.forEach(u => haveUnitIds.add(u.id));
  }catch(e){ units = []; }
  try{
    const sc = await DB.get('kv','seen');
    if(Array.isArray(sc)) seenCells = new Set(sc);
  }catch(e){}
  paintGunBtn(); Sprites.refresh();
  watchMe();
  startPoll();
  sync();
  const sp = document.getElementById('splash');
  if(sp){ setTimeout(() => { sp.classList.add('gone');
    setTimeout(() => sp.remove(), 500); }, 700); }
})();
</script>
