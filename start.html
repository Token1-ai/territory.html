<html lang="uk">
<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta property="og:image" content="share-1200x630.jpg">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Commissioner:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --ground:#0B0D07;
  --panel:#14170E;
  --ink:#EDEBDE;
  --soft:#8E9179;
  --faint:#63664F;
  --gold:#E0A32E;
  --gold-dim:#8A6415;
  --line:#262A1A;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'Commissioner',system-ui,-apple-system,sans-serif;
  font-size:16.5px;
  line-height:1.6;
  padding-left:18px;
  padding-right:18px;
  padding-block:0 64px;
  overflow-x:hidden;
}
.wrap{max-width:760px;margin:0 auto;}
a{color:var(--gold);}

/* ── выбор языка ─────────────────────────────────────── */
.lang{
  display:flex;justify-content:flex-end;
  padding-block:14px 0;margin-bottom:-6px;
}
.lang select{
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;
  color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:9px;
  padding:8px 30px 8px 12px;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23E0A32E' stroke-width='1.6' fill='none'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;
}
.lang select:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ── шапка ───────────────────────────────────────────── */
.hero{padding-block:26px 0;}
.badge{display:flex;gap:16px;align-items:center;margin-bottom:22px;}
.badge img{width:82px;height:82px;flex:none;border-radius:18px;background:#000;}
.badge h1{
  font-family:'Archivo',system-ui,sans-serif;
  font-weight:800;font-size:clamp(26px,6.4vw,38px);
  line-height:1.02;letter-spacing:-.02em;margin:0 0 5px;
  text-wrap:balance;
}
.badge .by{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--gold);margin:0;
}
.pitch{font-size:19.5px;line-height:1.45;margin:0 0 26px;max-width:32ch;font-weight:500;}
.pitch b{color:var(--gold);font-weight:600;}

/* ── кнопки ──────────────────────────────────────────── */
.get{display:grid;gap:10px;margin-bottom:14px;}
.btn{
  font-family:'Archivo',system-ui,sans-serif;
  font-weight:700;font-size:17px;letter-spacing:.01em;
  border:none;border-radius:12px;padding:17px 20px;width:100%;
  background:var(--gold);color:#100D03;
  cursor:pointer;text-align:center;text-decoration:none;display:block;
}
.btn:active{transform:translateY(1px);}
.btn.ghost{
  background:transparent;color:var(--ink);
  border:1px solid var(--line);font-weight:600;font-size:15.5px;padding:14px 20px;
}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
/* Метка телефона на кнопке: человек с первого взгляда видит, его это
   кнопка или соседняя. Ставим рядом с надписью, мелко и тускло — она
   подсказывает, а не кричит. */
.btn.two{display:flex;align-items:center;justify-content:center;gap:9px;}
.plat{
  font-family:var(--mono);font-weight:400;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;opacity:.5;
  white-space:nowrap;
}
.getnote{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--soft);margin:0 0 30px;}

/* ── полоска фактов ──────────────────────────────────── */
.facts{
  display:flex;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:12px;
  overflow:hidden;margin-bottom:38px;
}
.facts div{flex:1 1 33.333%;min-width:104px;padding:13px 14px;border-right:1px solid var(--line);}
.facts div:last-child{border-right:none;}
.facts dt{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin:0 0 3px;
}
.facts dd{margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;}

/* ── снимки ──────────────────────────────────────────── */
.shots{
  display:flex;gap:12px;overflow-x:auto;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding-bottom:10px;margin:0 -18px 8px;padding-left:18px;padding-right:18px;
}
.shots figure{margin:0;flex:none;scroll-snap-align:center;width:238px;}
.shots img{
  width:100%;height:auto;display:block;
  border:1px solid var(--line);border-radius:14px;background:var(--panel);
}
.shots figcaption{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:8px;line-height:1.45;}
.shots-note{font-family:var(--mono);font-size:11px;color:var(--faint);margin:0 0 40px;}

/* ── разделы ─────────────────────────────────────────── */
section{margin-bottom:40px;}
h2{
  font-family:'Archivo',system-ui,sans-serif;
  font-weight:600;font-size:12.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--faint);
  border-bottom:1px solid var(--line);padding-bottom:9px;margin:0 0 20px;
}
p{margin:0 0 15px;max-width:62ch;}
p:last-child{margin-bottom:0;}

.inside{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.inside div{background:var(--panel);padding:16px 18px;}
.inside h3{font-family:'Archivo',sans-serif;font-weight:600;font-size:16.5px;margin:0 0 5px;}
.inside p{color:var(--soft);font-size:15.5px;margin:0;}
@media (min-width:620px){ .inside{grid-template-columns:1fr 1fr;} }

.news{background:var(--panel);border-left:3px solid var(--gold);padding:18px 20px;border-radius:0 10px 10px 0;}
.news .ver{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;}
.news ul{margin:0;padding-left:17px;color:var(--soft);}
.news li{margin-bottom:6px;font-size:15.5px;}
.news li:last-child{margin-bottom:0;}
.news b{color:var(--ink);font-weight:600;}

.how{display:grid;gap:14px;}
.how article{border:1px solid var(--line);border-radius:12px;padding:17px 19px;}
.how h3{font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;margin:0 0 9px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;}
.how h3 span{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
.how ol{margin:0;padding-left:19px;color:var(--soft);font-size:15.5px;}
.how li{margin-bottom:5px;}
.how li:last-child{margin-bottom:0;}
@media (min-width:620px){ .how{grid-template-columns:1fr 1fr;} }

.privacy-lead{color:var(--soft);font-size:15.5px;margin-bottom:16px;}
.privacy-btn{border-color:var(--gold-dim);color:var(--gold);display:flex;align-items:center;justify-content:center;gap:8px;}

.about p{font-size:17px;}
.about .lead{font-size:18.5px;font-weight:500;color:var(--ink);}

footer{border-top:1px solid var(--line);padding-top:22px;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--faint);}
footer p{margin:0 0 8px;max-width:none;}
.warn{color:var(--soft);}

/* ── соседняя игра: боковой столбик ──────────────────────
   На телефоне это карточка в потоке, на широком экране —
   липкий столбик справа, который едет рядом со страницей.
   Ширину держим одинаковой (≤340), чтобы обложка нигде
   не раздувалась на пол-экрана.                          */
.adrail{
  --void:#A970FF;
  display:block;text-decoration:none;color:inherit;
  width:100%;max-width:340px;margin:0 auto 38px;
  background:var(--panel);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  transition:border-color .18s ease, transform .18s ease;
}
.adrail:hover{border-color:var(--void);transform:translateY(-2px);}
.adrail:focus-visible{outline:2px solid var(--void);outline-offset:3px;}
.adrail .mark{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);
  padding:12px 15px 10px;
}
.adrail picture,.adrail img{display:block;width:100%;height:auto;}
.adrail img{background:#120A1E;aspect-ratio:1/1;object-fit:cover;}
.adrail .body{padding:15px 15px 17px;}
.adrail h3{
  font-family:'Archivo',system-ui,sans-serif;font-weight:800;
  font-size:21px;letter-spacing:.005em;margin:0 0 7px;color:var(--ink);
}
.adrail .body p{color:var(--soft);font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:none;}
.adrail .go{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--void);border-radius:10px;padding:11px 13px;
  font-family:'Archivo',system-ui,sans-serif;font-weight:700;font-size:14.5px;
  color:#DCC6FF;transition:background .18s ease,color .18s ease;
}
.adrail:hover .go{background:var(--void);color:#140A24;}

@media (min-width:1180px){
  .wrap{
    max-width:1116px;   /* 760 текста + 56 зазор + 300 столбик */
    display:grid;grid-template-columns:minmax(0,760px) 300px;
    gap:56px;align-items:start;
  }
  .wrap > *{grid-column:1;}
  .wrap > .adrail{
    grid-column:2;grid-row:1 / span 40;
    position:sticky;top:22px;align-self:start;
    max-width:none;margin:0;
  }
}

@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important;} }
</style>
</head>

 ab0:'The map is your city. Not an invented one — the streets you walk to work.',

 cap3:'Das Spiel sagt nicht „geht nicht“, sondern wie viele Meter noch.',

 ab0:'Die Karte ist deine Stadt. Keine erfundene — die, durch die du zur Arbeit gehst.',
 ab1:'Setze einen Bunker dorthin, wo deine Füße stehen. Der Erdbunker ist kostenlos, einer pro Tag. Um ihn herum legt sich der Ring deines Bodens. Stelle Geschütze dazu, verbinde mehrere Punkte zu einer Schleife — und das Viertel gehört dir.',

 ab3:'Die Hälfte jedes Kaufpreises bleibt im Bunker. Wer ihn niederreißt, nimmt dieses Geld mit.',
 hInside:'Was drin ist',

 i2t:'Infanterie', i2p:'Der Trupp geht allein zum Punkt, bleibt auf Schussweite stehen und eröffnet das Feuer. Wer überlebt, kehrt in den Rucksack zurück.',
 i3t:'Drohne und Ferngeschoss', i3p:'Die Drohne schlägt aus einem Kilometer zu, die Rakete aus zweien. Sie fliegt dreißig Sekunden und ist für beide Seiten auf der Karte sichtbar.',
 i4t:'Clans', i4p:'Die Deinen, gegen die du nicht kämpfst und mit denen du die Beute teilst. Eigener Chat.',
 i5t:'Kuppel über neuem Punkt', i5p:'Zwei Stunden unantastbar, und man sieht, wie viel davon bleibt. Neulinge bekommen zwei Tage.',

// Какой язык показывать: что человек выбрал, иначе язык телефона,
// иначе английский — он есть у всех.
var lang = 'en';
function pickLang(){
  var saved = null;
  try{ saved = localStorage.getItem('ogt-site-lang'); }catch(e){}
  if(saved && L[saved]) return saved;
  var list = (navigator.languages && navigator.languages.length)
             ? navigator.languages : [navigator.language || 'en'];
  for(var i = 0; i < list.length; i++){
    var c = String(list[i] || '').slice(0,2).toLowerCase();
    if(L[c]) return c;
  }
  return 'en';
}

function paint(){
  var d = L[lang] || L.en;
  document.documentElement.lang = lang;
  document.title = d.title;
  var m = document.querySelector('meta[name="description"]');
  if(m) m.setAttribute('content', d.desc);
  var nodes = document.querySelectorAll('[data-t]');
  for(var i = 0; i < nodes.length; i++){
    var el = nodes[i], k = el.getAttribute('data-t');
    if(d[k] === undefined) continue;
    if(el.getAttribute('data-html')) el.innerHTML = d[k];
    else el.textContent = d[k];
  }
  var sel = document.getElementById('lang');
  if(sel) sel.value = lang;
  repaintInstall();
}

lang = pickLang();

document.getElementById('lang').addEventListener('change', function(e){
  lang = e.target.value;
  try{ localStorage.setItem('ogt-site-lang', lang); }catch(_){}
  paint();
});

// Работник нужен и здесь: без него браузер не предложит установку тому,
// кто пришёл сразу на эту страницу, а не в игру.
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

// Номер издания берём из того же файла, что и игра.
fetch('version.json', { cache:'no-store' })
  .then(function(r){ return r.json(); })
  .then(function(d){ if(d && d.v) document.getElementById('ver').textContent = d.v; })
  .catch(function(){});

var wait = null, installed = false, already = false;
var UA = navigator.userAgent || '';
var iOS = /iPhone|iPad|iPod/i.test(UA) ||
          (/Macintosh/.test(UA) && (navigator.maxTouchPoints || 0) > 1);

// ЧЕМ ОТКРЫТО. Раньше страница знала только «айфон или нет», а всем
// остальным показывала одну инструкцию про три точки. Но пункт меню у
// каждого браузера свой, и человек в Firefox искал то, чего там нет.
// Порядок проверок важен: почти все эти браузеры пишут в своей подписи
// слово Chrome, поэтому настоящий Chrome проверяем последним.
function brand(){
  if(/FBAN|FBAV|FB_IAB|Instagram|Telegram|TikTok|Twitter|Line\/|VKAndroidApp|OKApp|Snapchat|MicroMessenger/i.test(UA)) return 'inapp';
  if(iOS) return /CriOS|FxiOS|EdgiOS|OPT\//.test(UA) ? 'iosother' : 'safari';
  if(/SamsungBrowser/i.test(UA)) return 'samsung';
  if(/Firefox\//i.test(UA)) return 'firefox';
  if(/\bOPR\//i.test(UA)) return 'opera';
  if(/\bEdgA?\//i.test(UA)) return 'edge';
  if(/Chrome\//i.test(UA)) return 'chrome';
  return 'other';
}

var HOW = { chrome:'hChrome', samsung:'hSamsung', firefox:'hFirefox',
            opera:'hOpera', edge:'hEdge', safari:'jsIos',
            iosother:'jsIosHow', inapp:'inApp', other:'hOther' };

// Из Telegram и подобных поставить нельзя вообще — там урезанный
// браузер без такой возможности. Единственный выход — перепрыгнуть в
// нормальный, и это делается одной ссылкой, без объяснений на три
// абзаца.
function escapeUrl(){
  var u = location.href.replace(/^https?:\/\//, '');
  if(iOS) return 'x-safari-https://' + u;
  return 'intent://' + u + '#Intent;scheme=https;package=com.android.chrome;end';
}
function needEscape(){
  var b = brand();
  return b === 'inapp' || b === 'iosother' || b === 'other';
}

function standalone(){
  try{
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if(window.navigator && window.navigator.standalone === true) return true;
  }catch(e){}
  return false;
}

// Какую подпись показывать под кнопкой. Держим не сам текст, а ключ —
// тогда при смене языка подпись меняется вместе со страницей, а не
// остаётся на прежнем языке.
var noteKey = null, noteWarn = false, escapeShown = false, apkReady = false;

// ФАЙЛ ИГРЫ ДЛЯ ANDROID.
// Кнопку не рисуем «на всякий случай»: пока файла на сайте нет, она
// вела бы в пустоту, а нет ничего хуже кнопки, которая обманывает.
// Поэтому спрашиваем сайт, лежит ли файл, и показываем кнопку только
// если лежит. Выложил файл — кнопка появилась сама, править страницу
// не надо. Убрал — сама исчезла.
// На iPhone не показываем вовсе: Apple ставить файлы не разрешает,
// и кнопка была бы издевательством.
function checkApk(){
  if(iOS) return;
  try{
    fetch('gate-territory.apk', { method:'HEAD', cache:'no-store' })
      .then(function(r){ if(r && r.ok){ apkReady = true; repaintInstall(); } })
      .catch(function(){});
  }catch(_){}
}

// Перерисовать кнопку и подпись под текущий язык и текущее состояние.
function repaintInstall(){
  var d = L[lang] || L.en;
  var btn = document.getElementById('installtxt');
  var note = document.getElementById('getnote');
  if(!btn || !note) return;
  // Метку ставим только там, где она что-то различает. На Android рядом
  // с кнопкой из файла вторая «ANDROID» ничего не объясняет, а шумит.
  var плашка = document.getElementById('platpwa');
  if(плашка) плашка.textContent = iOS ? 'iPhone' : (apkReady ? '' : 'Android');
  var k = noteKey;
  if(installed || already || standalone()){
    btn.textContent = d.jsOpen;
    if(!k) k = installed ? 'jsDone' : 'jsHave';
  } else {
    btn.textContent = d.btnInstall;
    if(!k) k = iOS ? 'jsIos' : 'note';
  }
  note.textContent = d[k] !== undefined ? d[k] : (L.en[k] || '');
  note.style.color = noteWarn ? '#E0A32E' : '';

  var out = document.getElementById('escape');
  if(out){
    out.textContent = iOS ? d.btnSafari : d.btnChrome;
    out.style.display = (escapeShown && !(installed || already || standalone()))
                        ? 'block' : 'none';
  }

  // Главной — золотой — делаем ту кнопку, которая на этом телефоне
  // действительно ставит игру. Есть файл: он и главный, а «добавить
  // значок» уходит на второй план. Файла нет — главной остаётся она.
  var apk  = document.getElementById('getapk');
  var apkt = document.getElementById('apktxt');
  var apkn = document.getElementById('apknote');
  var кнопка = document.getElementById('install');
  if(apk && apkt && apkn && кнопка){
    apkt.textContent = d.btnApk;
    apkn.textContent = d.apkNote;
    apk.style.display  = apkReady ? '' : 'none';
    apkn.style.display = apkReady ? '' : 'none';
    кнопка.className = apkReady ? 'btn two ghost' : 'btn two';
  }
}

function setNote(k, warn){ noteKey = k; noteWarn = !!warn; repaintInstall(); }

paint();

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  wait = e;
  setNote('note', false);
});

window.addEventListener('appinstalled', function(){
  installed = true;
  setNote(null, false);
});

// Chrome умеет сказать, стоит ли уже эта игра на телефоне. Если стоит,
// окна установки он не покажет никогда — и раньше человек в этом месте
// упирался в инструкцию, которая ему не нужна. Теперь просто открываем.
checkApk();

try{
  if(navigator.getInstalledRelatedApps){
    navigator.getInstalledRelatedApps().then(function(list){
      if(list && list.length){ already = true; setNote(null, false); }
    }).catch(function(){});
  }
}catch(_){}

document.getElementById('install').addEventListener('click', function(){
  if(installed || already || standalone()){ location.href = 'index.html'; return; }
  if(wait){
    wait.prompt();
    wait.userChoice.then(function(){ wait = null; });
    return;
  }
  // Окна нет. Значит либо браузер так не умеет, либо Chrome уже
  // спрашивал и человек отказался — он тогда молчит месяцами. В обоих
  // случаях помогает не общая инструкция, а путь именно для этого
  // браузера, а из Telegram — прыжок в нормальный.
  escapeShown = needEscape();
  setNote(HOW[brand()] || 'hOther', true);
  if(!escapeShown){
    var how = document.querySelector('.how');
    if(how) how.scrollIntoView({ behavior:'smooth', block:'start' });
  }
});

document.getElementById('escape').addEventListener('click', function(){
  try{ location.href = escapeUrl(); }
  catch(_){ location.href = location.href; }
});
</script>
</body>
</html>
