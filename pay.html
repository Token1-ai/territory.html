<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8"/>
<meta name="google" content="notranslate"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Gate Territory · pay</title>
<style>
  :root{--bg:#12140F;--gold:#E0A32E;--txt:#E8E3D5;--dim:#9A9585;--bad:#B4462F;--ok:#7FBF6A;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.5 -apple-system,system-ui,Roboto,sans-serif;
    padding:22px 18px;max-width:520px;margin:0 auto;}
  h1{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 18px}
  .sum{font-size:40px;font-weight:700;line-height:1.1}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .box{border:1px solid rgba(224,163,46,.3);border-radius:12px;padding:14px;margin:16px 0;
    background:rgba(224,163,46,.06)}
  .row{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;
    border-bottom:1px solid rgba(255,255,255,.06)}
  .row:last-child{border:0}
  .row span{color:var(--dim)}
  button{width:100%;padding:15px;border:0;border-radius:12px;font-size:16px;font-weight:700;
    background:var(--gold);color:#12140F;margin-top:10px}
  button.ghost{background:transparent;color:var(--gold);border:1px solid rgba(224,163,46,.45)}
  button[disabled]{opacity:.45}
  #msg{margin-top:16px;padding:12px;border-radius:10px;font-size:14px;display:none}
  #msg.bad{background:rgba(180,70,47,.9);color:#fff;display:block}
  #msg.ok{background:rgba(127,191,106,.9);color:#12140F;display:block;font-weight:700}
  #msg.wait{background:rgba(255,255,255,.07);color:var(--dim);display:block}
  code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);word-break:break-all}
</style>
</head>
<body>
<h1>Gate Territory</h1>
<div class="sum" id="sum">—</div>
<div class="sub" id="sub"></div>

<div class="box">
  <div class="row"><span id="l-who">Player</span><b id="who">—</b></div>
  <div class="row"><span id="l-net">Network</span><b>BNB Chain</b></div>
  <div class="row"><span id="l-pay">You pay</span><b id="pay">—</b></div>
</div>

<button id="go">—</button>
<button class="ghost" id="back" style="display:none">—</button>
<div id="msg"></div>

<script>
// ═══════════ Страница оплаты ═══════════
// Открывается ВНУТРИ браузера кошелька. Здесь есть window.ethereum,
// поэтому перевод проходит. Игра остаётся у себя и сама досчитает
// зачисление — сюда она не переезжает.
//
// Ничего не весит: ни библиотек, ни картинок.

var P = new URLSearchParams(location.search);
var PLAYER = (P.get('u') || '').toLowerCase();
var USD    = parseFloat(P.get('a') || '0');
var KIND   = (P.get('k') || 'bnb');           // bnb | usd
var RATE   = parseFloat(P.get('r') || '600'); // запасной курс из игры

// ═══════════ Курс BNB в реальном времени ═══════════
// Число из ссылки — только подпорка. Между нажатием в игре и нажатием
// здесь человек мог уйти в кошелёк, поспать и вернуться через час.
// Спрашиваем биржу прямо перед тем, как строить перевод, иначе спишем
// не ту сумму и обманем человека.
var RATE_LIVE = false;
async function liveRate(){
  var tries = [
    ['https://api.binance.com/api/v3/ticker/price?symbol=BNBUSDT',
     function(j){ return parseFloat(j.price); }],
    ['https://api.coingecko.com/api/v3/simple/price?ids=binancecoin&vs_currencies=usd',
     function(j){ return parseFloat(j.binancecoin && j.binancecoin.usd); }],
    ['https://api.coinbase.com/v2/prices/BNB-USD/spot',
     function(j){ return parseFloat(j.data && j.data.amount); }]
  ];
  for(var i = 0; i < tries.length; i++){
    try{
      var c = new AbortController();
      var t = setTimeout(function(){ c.abort(); }, 4000);
      var r = await fetch(tries[i][0], { signal: c.signal, cache: 'no-store' });
      clearTimeout(t);
      if(!r.ok) continue;
      var v = tries[i][1](await r.json());
      if(isFinite(v) && v > 50 && v < 20000){ RATE = v; RATE_LIVE = true; return v; }
    }catch(e){}
  }
  return RATE;
}
// ── Холостой прогон ───────────────────────────────────────────────
// MetaMask пишет «недостаточно средств на комиссию», когда на самом
// деле контракт ОТКАЗЫВАЕТСЯ принимать перевод: кошелёк не смог
// посчитать газ и свалил вину на баланс. Прогоняем сделку вхолостую
// и достаём настоящую причину отказа словами.
function hexToStr(h){
  h = String(h||'').replace(/^0x/,'');
  var out = '';
  for(var i=0;i<h.length;i+=2){
    var c = parseInt(h.substr(i,2),16);
    if(c) out += String.fromCharCode(c);
  }
  return out;
}
function revertReason(err){
  var d = (err && (err.data && (err.data.data || err.data.originalError && err.data.originalError.data || err.data))) || '';
  if(typeof d !== 'string') d = (d && d.data) || '';
  d = String(d);
  // Error(string): 0x08c379a0 + смещение + длина + текст
  var i = d.indexOf('08c379a0');
  if(i >= 0){
    var body = d.slice(i + 8);
    var len = parseInt(body.slice(64, 128), 16);
    if(len > 0 && len < 400) return hexToStr(body.slice(128, 128 + len*2)).trim();
  }
  var ce = customError(d);
  if(ce) return ce;
  var m = err && (err.message || '');
  if(/insufficient funds/i.test(m)) return 'insufficient funds';
  return '';
}
// ── Собственные ошибки договора ──────────────────────────────────
// Контракт отвечает не текстом, а короткими кодами. Без разбора всё
// это выглядело просто как «revert» — то есть ни о чём.
// Внятные отказы договора: только на них и останавливаемся.
var HARD = ['приём денег временно закрыт', 'номер игрока пустой'];
var ERRS = {
  '9e87fac8': 'приём денег временно закрыт',
  '5f4b0a0b': 'номер игрока пустой',
  '81063e51': 'перевод хозяину не прошёл',
  '30cd7471': 'нужны права хозяина',
  'd92e233d': 'пустой адрес',
  '7dc6505a': 'нет предложения о передаче'
};
function customError(d){
  d = String(d || '').replace(/^0x/, '');
  if(d.length < 8) return '';
  var sel = d.slice(0, 8);
  // TooSmall(sent, need) — единственная, что несёт числа
  if(sel === 'e94fe3af'){
    var sent = BigInt('0x' + d.slice(8, 72));
    var need = BigInt('0x' + d.slice(72, 136));
    LAST_MIN = need;
    return 'слишком мало: прислано ' + fmtBnb(sent) + ', нужно от ' + fmtBnb(need) + ' BNB';
  }
  return ERRS[sel] || '';
}
function fmtBnb(w){
  var s = w.toString().padStart(19, '0');
  return (s.slice(0, s.length - 18) + '.' + s.slice(s.length - 18)).replace(/0+$/, '').replace(/\.$/, '.0');
}

// ── Что договор говорит о себе сам ───────────────────────────────
var SEL_MINWEI = '0xaddd7020';
var SEL_PAUSED = '0x5c975abb';
var LAST_MIN = null;
async function readWord(to, sel){
  try{
    var r = await ethereum.request({ method:'eth_call', params:[{ to: to, data: sel }, 'latest'] });
    return BigInt(r);
  }catch(e){ return null; }
}
// Проверяем ДО подписи: не закрыт ли приём и хватает ли суммы.
// Раньше человек узнавал об этом от кошелька, и то неправдой.
async function beforeSend(to, wei){
  var pz = await readWord(to, SEL_PAUSED);
  if(pz !== null && pz !== 0n) return (T.reject || 'Refused') + ': ' + ERRS['9e87fac8'];
  var mn = await readWord(to, SEL_MINWEI);
  if(mn !== null){
    LAST_MIN = mn;
    if(BigInt('0x' + wei) < mn){
      var needUsd = Number(mn) / 1e18 * RATE;
      return (T.reject || 'Refused') + ': минимум ' + fmtBnb(mn) + ' BNB (около $'
           + needUsd.toFixed(2) + '), а ты вводишь $' + USD.toFixed(2);
    }
  }
  return null;
}

async function dryRun(tx){
  try{
    await ethereum.request({ method:'eth_call', params:[tx, 'latest'] });
    return null;                       // прошло бы
  }catch(e){
    return revertReason(e) || 'revert';
  }
}

function paintSum(){
  if(!okLink) return;
  var amountBnb = (USD / RATE).toFixed(6);
  $('pay').textContent = (KIND === 'usd') ? (USD.toFixed(2) + ' USDT') : (amountBnb + ' BNB');
  $('sub').textContent = (KIND === 'usd')
      ? 'USDT \u00b7 1 = $1'
      : 'BNB \u00b7 $' + RATE.toFixed(2) + (RATE_LIVE ? ' \u2713' : ' ?');
}
var HOME   = P.get('h') || './index.html';

var GATE_BNB = '0x7c9411a216a425EcAa7f0c1a9bAA7554e4fcE1bf';
var GATE_USD = '0xb6C1dA2D079aB8fAFc149Cd74370567b57aB364B';
var USDT_BNB = '0x55d398326f99059fF775485246999027B3197955';
var SEL_TOPUP   = '0x2e007e98';
var SEL_TOPUSD  = '0xa9e1d5f2';
var SEL_APPROVE = '0x095ea7b3';
var BSC = '0x38';

var L = {
  en:{warn:'Note',tryany:'the wallet will ask you anyway',credited:'Money is in the game',slow:'Taking longer than usual. The game will finish it itself.',reject:'The contract refused the payment',who:'Player',net:'Network',pay:'You pay',go:'Confirm payment',back:'Back to the game',
      nowal:'No wallet here. Open this page inside your wallet app.',
      wrong:'Switch your wallet to BNB Chain.',sent:'Sent. Go back to the game — the money will arrive in about a minute.',
      cancel:'Payment cancelled.',step1:'Step 1 of 2 — allow the payment',step2:'Step 2 of 2 — confirm the transfer',
      bad:'Broken link. Open the shop in the game again.'},
  ru:{warn:'Замечание',tryany:'кошелёк всё равно спросит подтверждение',credited:'Деньги в игре',slow:'Дольше обычного. Игра доведёт до конца сама.',reject:'Контракт отказался принять платёж',who:'Игрок',net:'Сеть',pay:'Ты платишь',go:'Подтвердить оплату',back:'Вернуться в игру',
      nowal:'Здесь нет кошелька. Открой эту страницу внутри приложения кошелька.',
      wrong:'Переключи кошелёк на BNB Chain.',sent:'Отправлено. Возвращайся в игру — деньги придут примерно через минуту.',
      cancel:'Оплата отменена.',step1:'Шаг 1 из 2 — разреши списание',step2:'Шаг 2 из 2 — подтверди перевод',
      bad:'Ссылка испорчена. Открой лавку в игре заново.'},
  uk:{warn:'Зауваження',tryany:'гаманець усе одно запитає підтвердження',credited:'Гроші у грі',slow:'Довше ніж зазвичай. Гра доведе до кінця сама.',reject:'Контракт відмовився прийняти платіж',who:'Гравець',net:'Мережа',pay:'Ти платиш',go:'Підтвердити оплату',back:'Повернутись у гру',
      nowal:'Тут немає гаманця. Відкрий цю сторінку в застосунку гаманця.',
      wrong:'Перемкни гаманець на BNB Chain.',sent:'Надіслано. Повертайся у гру — гроші прийдуть за хвилину.',
      cancel:'Оплату скасовано.',step1:'Крок 1 з 2 — дозволь списання',step2:'Крок 2 з 2 — підтверди переказ',
      bad:'Посилання пошкоджено. Відкрий крамницю заново.'},
  pl:{warn:'Uwaga',tryany:'portfel i tak poprosi o potwierdzenie',credited:'Pieniądze są w grze',slow:'Dłużej niż zwykle. Gra dokończy sama.',reject:'Kontrakt odrzucił płatność',who:'Gracz',net:'Sieć',pay:'Płacisz',go:'Potwierdź płatność',back:'Wróć do gry',
      nowal:'Tu nie ma portfela. Otwórz tę stronę w aplikacji portfela.',
      wrong:'Przełącz portfel na BNB Chain.',sent:'Wysłane. Wróć do gry — pieniądze dojdą za około minutę.',
      cancel:'Płatność anulowana.',step1:'Krok 1 z 2 — zezwól na pobranie',step2:'Krok 2 z 2 — potwierdź przelew',
      bad:'Uszkodzony link. Otwórz sklep w grze ponownie.'}
};
var lang = (navigator.language || 'en').slice(0,2).toLowerCase();
var T = L[lang] || L.en;

function $(id){ return document.getElementById(id); }
function msg(text, cls){ var m = $('msg'); m.textContent = text; m.className = cls || 'wait'; }

function pad(h, right){
  h = String(h).replace(/^0x/,'');
  return right ? h.padEnd(64,'0') : h.padStart(64,'0');
}
// Считаем строкой, чтобы не потерять копейки на больших числах
function units(amount, dec){
  var s = String(amount).split('.');
  var frac = ((s[1]||'') + new Array(dec+1).join('0')).slice(0, dec);
  return BigInt(s[0] + frac).toString(16);
}

$('l-who').textContent = T.who;
$('l-net').textContent = T.net;
$('l-pay').textContent = T.pay;
$('go').textContent    = T.go;
$('back').textContent  = T.back;

var okLink = /^0x[0-9a-f]{40}$/.test(PLAYER) && USD > 0;
if(!okLink){
  msg(T.bad, 'bad');
  $('go').disabled = true;
} else {
  $('sum').textContent = '$' + USD.toFixed(2);
  $('who').textContent = PLAYER.slice(0,6) + '…' + PLAYER.slice(-4);
  paintSum();
  // и тут же уточняем курс у биржи, цифра на экране обновится сама
  liveRate().then(paintSum);
  // и спрашиваем у самого договора, какой у него минимум
  if(KIND !== 'usd'){
    readWord(GATE_BNB, SEL_MINWEI).then(function(mn){
      if(mn === null || mn === 0n) return;
      LAST_MIN = mn;
      var needUsd = Number(mn) / 1e18 * RATE;
      if(BigInt('0x' + units((USD / RATE * 1.01).toFixed(6), 18)) < mn){
        msg('Минимум пополнения — около $' + needUsd.toFixed(2)
            + ' (' + fmtBnb(mn) + ' BNB). Введена меньшая сумма.', 'bad');
        $('go').disabled = true;
      }
    });
  }
}

async function chain(){
  var id = await ethereum.request({ method:'eth_chainId' });
  if(id === BSC) return true;
  try{
    await ethereum.request({ method:'wallet_switchEthereumChain', params:[{ chainId: BSC }] });
    return true;
  }catch(e){
    // сети нет в кошельке — предлагаем добавить
    try{
      await ethereum.request({ method:'wallet_addEthereumChain', params:[{
        chainId: BSC, chainName:'BNB Smart Chain',
        nativeCurrency:{ name:'BNB', symbol:'BNB', decimals:18 },
        rpcUrls:['https://bsc-dataseed.bnbchain.org'],
        blockExplorerUrls:['https://bscscan.com'] }] });
      return true;
    }catch(_){ msg(T.wrong, 'bad'); return false; }
  }
}

$('go').onclick = async function(){
  if(!window.ethereum){ msg(T.nowal, 'bad'); return; }
  $('go').disabled = true;
  try{
    if(!await chain()){ $('go').disabled = false; return; }
    var acc = await ethereum.request({ method:'eth_requestAccounts' });
    var tx;
    if(KIND === 'usd'){
      var amt = units(USD, 18);
      msg(T.step1);
      await ethereum.request({ method:'eth_sendTransaction', params:[{
        from: acc[0], to: USDT_BNB,
        data: SEL_APPROVE + pad(GATE_USD.toLowerCase()) + pad(amt) }] });
      msg(T.step2);
      // topUpUSD(bytes20 player, uint256 amount)
      var body2 = { from: acc[0], to: GATE_USD,
                    data: SEL_TOPUSD + pad(PLAYER, true) + pad(amt) };
      var why2 = await dryRun(body2);
      if(why2 && HARD.indexOf(why2) < 0){
        msg((T.warn || 'Note') + ': ' + why2, 'wait');
      } else if(why2){
        msg((T.reject || 'The contract refused') + ': ' + why2, 'bad');
        $('go').disabled = false;
        return;
      }
      tx = await ethereum.request({ method:'eth_sendTransaction', params:[body2] });
    } else {
      // Последняя проверка курса — за миг до подписи. Плюс небольшой
      // запас: контракт считает по своему оракулу Chainlink, и если
      // прислать копейка в копейку, он отобьёт перевод из-за разницы
      // в доли процента. Излишек человеку зачтётся, он не пропадёт.
      await liveRate();
      paintSum();
      var wei = units((USD / RATE * 1.01).toFixed(6), 18);
      // Подбираем рабочую запись вызова холостыми прогонами — они
      // бесплатны и ничего не отправляют. Раньше адрес игрока
      // дописывался нулями СПРАВА, а по правилам ABI адрес стоит в
      // младших байтах слова, то есть нули идут СЛЕВА. Контракт
      // получал мусор вместо кошелька и молча отбивал перевод.
      // topUp(bytes20 player). У bytes20 нули по правилам ABI идут
      // СПРАВА — значит pad(..., true) здесь верно. Это не адрес.
      var body = { from: acc[0], to: GATE_BNB, value: '0x' + wei,
                   data: SEL_TOPUP + pad(PLAYER, true) };
      // Холостой прогон только ПРЕДУПРЕЖДАЕТ, а не запрещает.
      //
      // Раньше он запрещал — и платить стало нельзя ВООБЩЕ НИ ИЗ
      // КАКОГО кошелька, кроме одного. У разных кошельков свои узлы
      // сети, и холостой прогон у них отвечает по-разному: то голый
      // «revert», то «не хватает средств», даже когда настоящая
      // сделка прошла бы. Мой предохранитель оказался хуже болезни.
      //
      // Останавливаемся только там, где договор ответил ВНЯТНО:
      // мало прислал, приём закрыт, пустой номер игрока. Всё
      // остальное — предупреждение, а решает человек.
      var stop = await beforeSend(GATE_BNB, wei);
      if(stop){ msg(stop, 'bad'); $('go').disabled = false; return; }
      var why = await dryRun(body);
      if(why && HARD.indexOf(why) < 0 && why.indexOf('слишком мало') < 0){
        msg((T.warn || 'Note') + ': ' + why + ' \u2014 ' + (T.tryany || 'try anyway'), 'wait');
      } else if(why){
        msg((T.reject || 'The contract refused') + ': ' + why, 'bad');
        $('go').disabled = false;
        return;
      }
      tx = await ethereum.request({ method:'eth_sendTransaction', params:[body] });
    }
    $('go').style.display = 'none';
    $('back').style.display = 'block';
    try{ localStorage.setItem('ogt_last_tx', tx); }catch(e){}
    creditLoop(tx);
  }catch(e){
    msg(T.cancel, 'bad');
    $('go').disabled = false;
  }
};

// ── Зачисление ───────────────────────────────────────────────────
// РАНЬШЕ сервер дёргали ОДИН раз, сразу после подписи. Но сделка в
// этот миг ещё не в блокчейне: сервер смотрит, ничего не находит и
// бросает. Второй попытки не было. Запись в память телефона тоже не
// спасала: платят в браузере кошелька, а игра открыта в другом — это
// разные хранилища, игра её не видит.
//
// Теперь стучимся, пока не зачислится: почти три минуты, каждые пять
// секунд. Обычно хватает двух-трёх попыток.
async function creditLoop(tx){
  for(var i = 0; i < 34; i++){
    try{
      var r = await fetch('/api/topup', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tx_hash: tx }) });
      var j = await r.json();
      if(j && j.ok){
        msg((T.credited || 'Money is in the game') + (j.cents ? ' \u00b7 $' + (j.cents/100).toFixed(2) : ''), 'ok');
        try{ localStorage.removeItem('ogt_last_tx'); }catch(e){}
        return;
      }
      // сделка ещё не в цепочке — это нормально первые полминуты
      msg(T.sent + ' (' + (i + 1) + ')', 'wait');
    }catch(e){
      msg(T.sent + ' (' + (i + 1) + ')', 'wait');
    }
    await new Promise(function(r){ setTimeout(r, 5000); });
  }
  // Не дождались — не страшно: номер сделки остался записан, игра
  // повторит запрос сама. Показываем его, чтобы можно было прислать.
  msg((T.slow || 'Taking longer than usual') + '\n' + tx, 'wait');
}
